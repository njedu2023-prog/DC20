name: DC20 · 10:00 profit capital replay (research only)

on:
  workflow_run:
    workflows: ["DC20 · 10:00 profit historical training (research only)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: dc20-profit-1000-capital-replay
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  replay:
    if: >-
      github.repository == 'njedu2023-prog/DC20' && github.run_attempt == 1 &&
      github.event.workflow_run.id == 34671477608 &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_sha == '4675fab984050fa32be875fff07e0285e8903ebb' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'njedu2023-prog/DC20'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed replay code without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - name: Install hash-locked research runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test independent replay and production freeze
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: |
          python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
          python scripts/validate_decision_model_freeze.py --root .
      - name: Read only the exact upstream research artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dc20-profit-1000-history-4675fab984050fa32be875fff07e0285e8903ebb-34671477608
          run-id: 34671477608
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dc20-profit-1000-history
      - name: Rebuild labels and compare capital-constrained accounts
        run: >-
          python work/profit_1000_upgrade/capital_report.py
          --root "${RUNNER_TEMP}/dc20-profit-1000-history"
          --expected-source-run-id 34671477608
          --expected-source-commit 4675fab984050fa32be875fff07e0285e8903ebb
      - name: Verify production checkout unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Save source-bound diagnostics including blocked results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc20-profit-1000-capital-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-profit-1000-history/research_capital
          if-no-files-found: warn
          retention-days: 30
