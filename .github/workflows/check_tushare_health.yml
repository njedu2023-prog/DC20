name: DC2.0 · Tushare Health Check

on:
  workflow_dispatch: {}
  schedule:
    # Mon-Fri 10:40 Beijing (UTC+8). Chinese holidays are detected by trade_cal.
    - cron: "40 2 * * 1-5"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: dc20-tushare-health
  cancel-in-progress: true

jobs:
  health:
    name: Read-only fail-hard API probes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Verify pinned Python runtime
        run: python -c "import sys; assert sys.version_info[:3] == (3, 12, 13), sys.version"

      - name: Check Tushare token and endpoint entitlements
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -euo pipefail
          safe_json="${RUNNER_TEMP}/dc20-tushare-health.json"
          set +e
          python -B scripts/check_tushare_health.py --timeout-seconds 15 >"${safe_json}" 2>&1
          status=$?
          set -e
          SAFE_JSON="${safe_json}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SAFE_JSON"])
          lines = [line for line in path.read_text(encoding="utf-8").splitlines() if line]
          if len(lines) != 1:
              raise SystemExit("health command must emit exactly one safe JSON line")
          payload = json.loads(lines[0])
          compact = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          )
          path.write_text(compact + "\n", encoding="utf-8")
          print(compact)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("### DC2.0 Tushare health\n\n")
              out.write(f"`{compact}`\n")
          PY
          exit "${status}"
