name: DC20 daily cleanup replay acceptance

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/verify_daily_cleanup.yml
      - scripts/replay_daily_cleanup.py
      - scripts/rehearse_daily_publication.py
      - .github/workflows/deploy_dc20_pages.yml
      - decision.html
      - scripts/candidate_delivery_watchdog.py
      - scripts/daily_delivery_policy.py
      - models/decision_daily_delivery_policy_v1.json
      - models/decision_source_surface_review_20261107_system_cleanup.json

permissions:
  contents: read

concurrency:
  group: dc20-cleanup-readonly-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  LOKY_MAX_CPU_COUNT: "1"

jobs:
  historical-linked-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable cleaned version
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: cleaned
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout original baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline
          ref: 6a0f9e0a6ea5e57957fbac5c30849dd508d1daf2
          persist-credentials: false
      - name: Set up exact production Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: cleaned/requirements-dev.lock
      - name: Set up exact account Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install hash-locked runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r cleaned/requirements-dev.lock
      - name: Check retirement isolation and original continuation guards
        working-directory: cleaned
        env:
          PYTHONPATH: .:src
        run: |
          python scripts/validate_decision_model_freeze.py --runtime
          python -m pytest -q tests/test_daily_cleanup_replay.py tests/test_system_cleanup_source_review.py tests/test_daily_workflow_retirement.py tests/test_daily_delivery_policy.py tests/test_candidate_delivery_watchdog.py tests/test_candidate_delivery_missing_p0.py tests/test_compact_statistics_window.py tests/test_compact_statistics_window_pages.py tests/test_compact_statistics_window_frontend.py tests/test_pages_truthfulness_workflow.py
      - name: Recompute actual frozen D with both code versions
        run: |
          mkdir -p acceptance
          python cleaned/scripts/replay_daily_cleanup.py --code-root baseline --source-root baseline --signal-date 20261106 --label baseline --output acceptance/baseline-scoring.json
          python cleaned/scripts/replay_daily_cleanup.py --code-root cleaned --source-root baseline --signal-date 20261106 --label cleaned --output acceptance/cleaned-scoring.json
      - name: Rehearse original and cleaned publication without deploying
        run: |
          python cleaned/scripts/rehearse_daily_publication.py --root baseline --out acceptance/baseline-publication
          python cleaned/scripts/rehearse_daily_publication.py --root cleaned --out acceptance/cleaned-publication
      - name: Compare business results and measured durations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('acceptance')
          scoring=[json.loads((root/(name+'-scoring.json')).read_text()) for name in ('baseline','cleaned')]
          publication=[json.loads((root/(name+'-publication/result.json')).read_text()) for name in ('baseline','cleaned')]
          for item in scoring+publication:
              assert item['status']=='PASS',item
          for key in ('input_inventory_sha256','business_signature_sha256','promotion_top3','profit_top2'):
              assert scoring[0][key]==scoring[1][key], 'Recomputed rankings/inputs changed: '+key
          accounts=[{k:v for k,v in item['account'].items() if k not in ('data_bindings','publication')} for item in publication]
          assert accounts[0]==accounts[1], 'Simulated account business values changed'
          times=[item['total_seconds'] for item in publication]
          result={'status':'PASS','signal_date':'20261106','rankings_identical':True,'account_business_values_identical':True,
            'baseline_build_seconds':times[0],'cleaned_build_seconds':times[1],
            'build_seconds_saved':times[0]-times[1],
            'build_change_pct':(times[1]/times[0]-1)*100,
            'scope':'Real historical recomputation and actual Pages build on the same runner. Excludes fresh upstream collection, GitHub queue/install and public CDN propagation. No new natural freeze or public deployment.'}
          (root/'comparison.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Historical D20261106 cleanup acceptance\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n')
          PY
      - name: Preserve acceptance results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc20-cleanup-acceptance-${{ github.run_id }}
          path: acceptance/
          retention-days: 14
          if-no-files-found: warn
