name: DC20 daily cleanup replay acceptance

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/verify_daily_cleanup.yml
      - scripts/replay_daily_cleanup.py
      - scripts/rehearse_daily_publication.py
      - tests/test_publication_rehearsal_fixture.py
      - .github/workflows/deploy_dc20_pages.yml
      - decision.html
      - scripts/candidate_delivery_watchdog.py
      - scripts/daily_delivery_policy.py
      - models/decision_daily_delivery_policy_v1.json
      - models/decision_source_surface_review_20261107_system_cleanup.json
      - models/decision_source_surface_review_20261107_delivery_hardening.json
      - scripts/candidate_profit_pages.py
      - scripts/sync_market_raw.py
      - .github/workflows/run_primary_d_daily.yml
      - work/profit_1000_upgrade/candidate_*.py
      - tests/test_delivery_hardening_*.py
      - tests/test_*source_review.py
      - models/decision_source_surface_review_20261110_suspension_pin.json

permissions:
  contents: read

concurrency:
  group: dc20-cleanup-readonly-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  LOKY_MAX_CPU_COUNT: "1"

jobs:
  historical-linked-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable cleaned version
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: cleaned
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout original baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline
          ref: 943e62b27102c671cd440c45a160054a3bb092f9
          persist-credentials: false
      - name: Checkout immediate reliability baseline for matched latest-D replay
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: reliability-baseline
          ref: 65d4e0c1d80c177645eff1d1bbd53fee71cffda9
          persist-credentials: false
      - name: Set up exact production Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: cleaned/requirements-dev.lock
      - name: Set up exact account Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install hash-locked runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r cleaned/requirements-dev.lock
      - name: Check retirement isolation and original continuation guards
        working-directory: cleaned
        env:
          PYTHONPATH: .:src
        run: |
          python scripts/validate_decision_model_freeze.py --runtime
          python -m pytest -q tests/test_daily_metadata_source_review.py tests/test_reliability_isolation_source_review.py tests/test_suspension_evidence_registry.py tests/test_primary_failure_diagnostics.py tests/test_candidate_runtime_preflight.py tests/test_suspension_pin_source_review.py tests/test_system_cleanup_source_review.py tests/test_delivery_hardening_source_review.py tests/test_next_day_statistics_source_review.py tests/test_next_day_p0_profile_source_review.py tests/test_existing_continuation_source_review.py tests/test_settlement_noop_source_review.py
          python -m pytest -q tests/test_daily_cleanup_replay.py tests/test_publication_rehearsal_fixture.py tests/test_system_cleanup_source_review.py tests/test_daily_workflow_retirement.py tests/test_daily_delivery_policy.py tests/test_candidate_delivery_watchdog.py tests/test_candidate_delivery_missing_p0.py tests/test_compact_statistics_window.py tests/test_compact_statistics_window_pages.py tests/test_compact_statistics_window_frontend.py tests/test_pages_truthfulness_workflow.py
      - name: Exercise guarded delivery fault recovery
        working-directory: cleaned
        env:
          PYTHONPATH: .:src
        run: |
          mkdir -p ../acceptance
          python -m pytest -q tests/test_delivery_hardening_*.py tests/test_dc20_writer_queue.py work/profit_1000_upgrade/test_candidate_natural_p0_continuation.py work/profit_1000_upgrade/test_candidate_natural_evidence_publication.py work/profit_1000_upgrade/test_candidate_natural_publication.py work/profit_1000_upgrade/test_candidate_natural_evidence.py work/profit_1000_upgrade/test_candidate_natural_trigger_gate.py --junitxml=../acceptance/hardening-tests.xml
      - name: Recover exact original metadata blobs for offline replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          root=Path('baseline'); cache=Path('original-source-cache'); cache.mkdir()
          for day in ('20260914','20261014','20261028','20261106'):
              receipt=json.loads((root/f'work/profit_1000_upgrade/candidate_natural_forward/p0_sources_{day}.json').read_text())
              for binding in receipt['source_file_bindings']:
                  raw=(root/binding['path']).read_bytes()
                  if hashlib.sha256(raw).hexdigest()==binding['sha256']: continue
                  request=urllib.request.Request('https://api.github.com/repos/njedu2023-prog/DC20/git/blobs/'+binding['git_blob_sha1'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(request,timeout=60) as response: blob=json.load(response)
                  assert blob['sha']==binding['git_blob_sha1'] and blob['encoding']=='base64'
                  raw=base64.b64decode(blob['content'])
                  assert len(raw)==binding['bytes'] and hashlib.sha256(raw).hexdigest()==binding['sha256']
                  assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==binding['git_blob_sha1']
                  (cache/binding['sha256']).write_bytes(raw)
          PYCODE
      - name: Recompute actual frozen D with both code versions
        run: |
          mkdir -p acceptance
          for day in 20260914 20261014 20261028 20261106; do
            python cleaned/scripts/replay_daily_cleanup.py --code-root baseline --source-root baseline --original-source-cache original-source-cache --signal-date "$day" --label baseline --output "acceptance/baseline-scoring-$day.json"
            python cleaned/scripts/replay_daily_cleanup.py --code-root cleaned --source-root baseline --original-source-cache original-source-cache --signal-date "$day" --label cleaned --output "acceptance/cleaned-scoring-$day.json"
          done
      - name: Compare historical rankings against the original retirement baseline
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('acceptance')
          days=('20260914','20261014','20261028','20261106')
          for day in days:
              pair=[json.loads((root/(name+'-scoring-'+day+'.json')).read_text()) for name in ('baseline','cleaned')]
              assert all(item['status']=='PASS' and item['signal_date']==day for item in pair)
              for key in ('input_inventory_sha256','business_signature_sha256','promotion_top3','profit_top2'):
                  assert pair[0][key]==pair[1][key], (day,key)
          result={'status':'PASS','baseline_commit':'943e62b27102c671cd440c45a160054a3bb092f9',
              'replayed_days':list(days),'rankings_and_scores_identical':True,
              'scope':'OLD_RETIREMENT_BASELINE_HISTORICAL_RANKING_COMPATIBILITY_ONLY; not the immediate reliability timing baseline and no publication comparison.'}
          raw=json.dumps(result,ensure_ascii=False,indent=2)
          (root/'historical-ranking-comparison.json').write_text(raw+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Original retirement baseline historical ranking compatibility\n```json\n'+raw+'\n```\n')
          print(raw)
          PY
      - name: Rehearse three matched publication builds without deploying
        run: |
          for trial in 1 2 3; do
            if [ "$trial" = "2" ]; then order="cleaned reliability-baseline"; else order="reliability-baseline cleaned"; fi
            for version in $order; do
              rehearsal="$RUNNER_TEMP/dc20-$version-$trial"
              cp -a "$version" "$rehearsal"
              python cleaned/scripts/rehearse_daily_publication.py --root "$rehearsal" --out "acceptance/$version-publication-$trial" --source-root reliability-baseline --expected-signal-date 20261110 --expected-source-head 65d4e0c1d80c177645eff1d1bbd53fee71cffda9
              rm -rf -- "$rehearsal"
            done
          done
      - name: Compare business results and measured durations
        run: |
          python - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root=Path('acceptance')
          builds={name:[json.loads((root/(name+'-publication-'+str(i)+'/result.json')).read_text()) for i in (1,2,3)] for name in ('reliability-baseline','cleaned')}
          publication=[item for name in ('reliability-baseline','cleaned') for item in builds[name]]
          for item in publication:
              assert item['status']=='PASS',item
              assert item['natural_freeze_created'] is False and item['public_deploy_performed'] is False
              assert item['protected_files_unchanged'] > 0
          assert all(item['signal_date']=='20261110' for item in publication), 'Publication comparison must use the immediate reliability D'
          assert all(item['source_fixture']['signal_date']=='20261110' and item['source_fixture']['source_head']=='65d4e0c1d80c177645eff1d1bbd53fee71cffda9' for item in publication), 'Publication builds must use the immutable immediate-baseline fixture'
          assert len({item['business_input_inventory_sha256'] for item in publication})==1, 'Publication timing requires identical business inputs'
          accounts=[{k:v for k,v in item['account'].items() if k not in ('data_bindings','publication')} for item in publication]
          assert all(value==accounts[0] for value in accounts), 'Simulated account business values changed'
          samples={name:[item['total_seconds'] for item in builds[name]] for name in builds}
          times=[statistics.median(samples[name]) for name in ('reliability-baseline','cleaned')]
          result={'status':'PASS','signal_date':'20261110','baseline_commit':'65d4e0c1d80c177645eff1d1bbd53fee71cffda9',
            'repaired_commit':os.environ['GITHUB_SHA'],'same_business_inputs':True,'account_business_values_identical':True,
            'build_trials':samples,'timing_statistic':'median_of_three_matched_builds',
            'baseline_build_seconds':times[0],'cleaned_build_seconds':times[1],
            'build_seconds_saved':times[0]-times[1],
            'build_change_pct':(times[1]/times[0]-1)*100,
            'scope':'IMMEDIATE_RELIABILITY_BASELINE_MATCHED_PAGES_BUILD; actual Pages preparation on the same runner. Excludes upstream collection, GitHub queue/install and public CDN propagation. No new natural freeze or public deployment; ranking recomputation is reported separately.'}
          (root/'publication-comparison.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Immediate baseline D20261110 publication preparation acceptance\n```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n')
          PY
      - name: Recompute latest original freeze with immediate old and new code
        run: |
          for trial in 1 2 3; do
            if [ "$trial" = "2" ]; then order="cleaned reliability-baseline"; else order="reliability-baseline cleaned"; fi
            for version in $order; do
              python cleaned/scripts/replay_daily_cleanup.py --code-root "$version" --source-root reliability-baseline --signal-date 20261110 --label "$version" --output "acceptance/reliability-$version-$trial.json"
            done
          done
          python - <<'PY'
          import json, statistics, os
          from pathlib import Path
          root=Path('acceptance')
          reports={name:[json.loads((root/f'reliability-{name}-{trial}.json').read_text()) for trial in (1,2,3)] for name in ('reliability-baseline','cleaned')}
          rows=[r for group in reports.values() for r in group]
          assert all(r['status']=='PASS' and r['signal_date']=='20261110' for r in rows)
          for key in ('input_inventory_sha256','business_signature_sha256','promotion_top3','profit_top2'):
              assert all(row[key]==rows[0][key] for row in rows),key
          durations={name:[r['seconds_total'] for r in group] for name,group in reports.items()}
          medians={name:statistics.median(v) for name,v in durations.items()}
          before,after=medians['reliability-baseline'],medians['cleaned']
          result={'status':'PASS','baseline_commit':'65d4e0c1d80c177645eff1d1bbd53fee71cffda9','signal_date':'20261110',
              'same_inputs':True,'rankings_and_scores_identical':True,'trials_seconds':durations,
              'baseline_median_seconds':before,'repaired_median_seconds':after,'seconds_saved':before-after,
              'change_pct':(after/before-1)*100,'scope':'READ_ONLY_REAL_FROZEN_RECOMPUTATION; excludes upstream collection, queue, CI, installation and public deployment; not a new natural freeze'}
          raw=json.dumps(result,ensure_ascii=False,indent=2)
          (root/'reliability-comparison.json').write_text(raw+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Immediate baseline reliability acceptance\n```json\n'+raw+'\n```\n')
          print(raw)
          PY
      - name: Preserve acceptance results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc20-cleanup-acceptance-${{ github.run_id }}
          path: acceptance/
          retention-days: 14
          if-no-files-found: warn
