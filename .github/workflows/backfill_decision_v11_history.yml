name: Backfill Decision V11 Two-Year History

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；完成真实回填、重建和校验但不提交"
        required: true
        default: true
        type: boolean
      start_date:
        description: "历史起始日 YYYYMMDD"
        required: false
        default: "20200101"
        type: string
      end_date:
        description: "历史结束日 YYYYMMDD（留空=北京时间今天）"
        required: false
        type: string
      max_missing_dates:
        description: "本次最多新增历史信号日"
        required: false
        default: "500"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Read-only backfill, rebuild, and validate
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      has_changes: ${{ steps.candidate.outputs.has_changes }}
    steps:
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dry-run mode and immutable base
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${INPUT_DRY_RUN:-true}" != false ]; then publish=false; fi
          git rev-parse HEAD > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Require active production freeze and enforced pins for real publication
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from top10decision.decision.model_freeze import load_model_freeze, model_freeze_active, validate_pinned_files
          root = Path('.').resolve(); manifest = load_model_freeze(root, required=True)
          active = model_freeze_active(manifest)
          if os.environ['PUBLISH'] == 'true' and not active: raise SystemExit('real Backfill publication requires active Decision freeze')
          audit = validate_pinned_files(root, manifest, force_enforcement=not active)
          if audit.get('enforced') is not True: raise SystemExit('Backfill preflight did not enforce frozen pins')
          PY
      - name: Resolve bounded history request
        id: request
        env:
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_MAX: ${{ inputs.max_missing_dates }}
        run: |
          set -euo pipefail
          start="${INPUT_START:-20200101}"
          end="${INPUT_END:-$(TZ=Asia/Shanghai date +%Y%m%d)}"
          maximum="${INPUT_MAX:-500}"
          echo "${start}" | grep -Eq '^[0-9]{8}$'
          echo "${end}" | grep -Eq '^[0-9]{8}$'
          echo "${maximum}" | grep -Eq '^[0-9]+$'
          test "${maximum}" -ge 1
          test "${maximum}" -le 500
          echo "start_date=${start}" >> "${GITHUB_OUTPUT}"
          echo "end_date=${end}" >> "${GITHUB_OUTPUT}"
          echo "max_missing_dates=${maximum}" >> "${GITHUB_OUTPUT}"
      - name: Backfill immutable history without publishing
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/backfill_decision_v11_history.py \
            --start-date "${{ steps.request.outputs.start_date }}" \
            --end-date "${{ steps.request.outputs.end_date }}" \
            --max-missing-dates "${{ steps.request.outputs.max_missing_dates }}" \
            --receipt "${RUNNER_TEMP}/backfill-receipt.json"
          test -s "${RUNNER_TEMP}/backfill-receipt.json"
      - name: Validate owner-scoped Backfill artifacts before candidate creation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          validation_report="${RUNNER_TEMP}/backfill-validation.json"
          python scripts/validate_backfill_artifacts.py \
            --root "${GITHUB_WORKSPACE}" \
            --receipt "${RUNNER_TEMP}/backfill-receipt.json" \
            --start-date "${{ steps.request.outputs.start_date }}" \
            --end-date "${{ steps.request.outputs.end_date }}" \
            --max-missing-dates "${{ steps.request.outputs.max_missing_dates }}" \
            > "${validation_report}"
          git diff --no-renames --name-only -z HEAD > "${RUNNER_TEMP}/backfill-tracked-dirty.bin"
          git ls-files --others --exclude-standard -z > "${RUNNER_TEMP}/backfill-untracked-dirty.bin"
          VALIDATION_REPORT="${validation_report}" TRACKED_DIRTY="${RUNNER_TEMP}/backfill-tracked-dirty.bin" UNTRACKED_DIRTY="${RUNNER_TEMP}/backfill-untracked-dirty.bin" python - <<'PY'
          import json, os
          from pathlib import Path
          from top10decision.auction_v3.config import TARGET_INDEPENDENT_OOS_DATES

          validation=json.loads(
              Path(os.environ['VALIDATION_REPORT']).read_text(encoding='utf-8')
          )
          if (
              not isinstance(validation, dict)
              or validation.get('validated') is not True
              or type(validation.get('live_independent_oos_capacity')) is not int
              or validation['live_independent_oos_capacity'] < TARGET_INDEPENDENT_OOS_DATES
          ):
              raise SystemExit('Backfill owner validation report is invalid')
          expected=validation.get('expected_dirty_paths')
          if (
              not isinstance(expected, list)
              or not expected
              or any(type(path) is not str or not path for path in expected)
              or len(expected) != len(set(expected))
          ):
              raise SystemExit('Backfill expected dirty path inventory is invalid')
          allowed_exact=set(expected)
          paths=[]
          for name in ('TRACKED_DIRTY','UNTRACKED_DIRTY'):
              paths.extend(
                  item.decode()
                  for item in Path(os.environ[name]).read_bytes().split(b'\0')
                  if item
              )
          bad=sorted({path for path in paths if path not in allowed_exact})
          if bad:
              raise SystemExit(f'Backfill modified non-owner paths: {bad}')
          if validation.get('status') == 'produced':
              required={
                  path for path in allowed_exact
                  if path.endswith('/manifest_latest.json')
                  or '/training_' in path
              }
              if not required.issubset(set(paths)):
                  raise SystemExit('Backfill produced receipt is missing required dirty paths')
          PY
          python -m unittest discover -s tests -p 'test_auction_v3.py' -v
          python -m unittest discover -s tests -p 'test_decision_v8_calibration.py' -v
          python -m unittest discover -s tests -p 'test_decision_contract.py' -v
      - name: Build one exact allowlisted Backfill candidate patch
        id: candidate
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- data/auction_v3/history/tplus1_open_0930_v1 data/market/trade_cal_sse.csv
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/staged_index.bin"
          STAGED_PATHS="${RUNNER_TEMP}/staged_paths.bin" STAGED_INDEX="${RUNNER_TEMP}/staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/auction_v3/history/tplus1_open_0930_v1/training_*.csv','data/auction_v3/history/tplus1_open_0930_v1/manifest_latest.json','data/market/trade_cal_sse.csv')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed)]
          if bad: raise SystemExit(f'non-allowlisted Backfill paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Backfill index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Backfill paths staged: {bad_modes}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/candidate.patch"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path(os.environ['CANDIDATE_PATCH'])
          Path(os.environ['CANDIDATE_SHA']).write_text(hashlib.sha256(patch.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PY
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi
      - name: Validate exact Backfill candidate in an isolated frozen runtime
        env:
          HAS_CHANGES: ${{ steps.candidate.outputs.has_changes }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/backfill-runtime"
          cleanup() {
            git worktree remove --force "${runtime_root}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "${runtime_root}" "$(cat "${RUNNER_TEMP}/base_sha.txt")"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          patch=Path(os.environ['CANDIDATE_PATCH'])
          claimed=Path(os.environ['CANDIDATE_SHA']).read_text(encoding='ascii').strip()
          actual=hashlib.sha256(patch.read_bytes()).hexdigest()
          if re.fullmatch(r'[0-9a-f]{64}', claimed) is None or claimed != actual:
              raise SystemExit('Backfill candidate patch SHA256 mismatch before isolated validation')
          PY
          if [ "${HAS_CHANGES}" = "true" ]; then
            git -C "${runtime_root}" apply --index --binary "${RUNNER_TEMP}/candidate.patch"
          else
            test ! -s "${RUNNER_TEMP}/candidate.patch"
          fi
          PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_backfill_artifacts.py" \
            --root "${runtime_root}" \
            --receipt "${RUNNER_TEMP}/backfill-receipt.json" \
            --start-date "${{ steps.request.outputs.start_date }}" \
            --end-date "${{ steps.request.outputs.end_date }}" \
            --max-missing-dates "${{ steps.request.outputs.max_missing_dates }}"
          replay_report="${RUNNER_TEMP}/backfill-frozen-replay.json"
          replay_stdout="${RUNNER_TEMP}/backfill-frozen-replay.stdout"
          set +e
          PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/run_deterministic_numeric.py" \
            "${runtime_root}/scripts/replay_frozen_canonical_v2.py" \
            --root "${runtime_root}" \
            --report "${replay_report}" > "${replay_stdout}"
          replay_status=$?
          set -e
          if [ "${replay_status}" -ne 0 ]; then
            REPLAY_REPORT="${replay_report}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          report = Path(os.environ['REPLAY_REPORT'])
          error = ''
          if report.is_file():
              try:
                  payload = json.loads(report.read_text(encoding='utf-8'))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  payload = {}
              if isinstance(payload, dict) and isinstance(payload.get('error'), str):
                  error = payload['error']
          lowered = error.lower()
          if 'pinned' in lowered:
              reason = 'PIN_DRIFT'
          elif 'action' in lowered or 'watchlist' in lowered:
              reason = 'ACTION_WATCHLIST_DRIFT'
          elif 'canonical' in lowered:
              reason = 'CANONICAL_RUNTIME_DRIFT'
          elif 'history' in lowered or 'snapshot' in lowered:
              reason = 'FROZEN_HISTORY_DRIFT'
          else:
              reason = 'FROZEN_RUNTIME_VALIDATION_FAILED'
          print(json.dumps({
              'component': 'backfill_frozen_replay',
              'error_sha256': hashlib.sha256(error.encode('utf-8')).hexdigest(),
              'reason_code': reason,
              'status': 'fail',
          }, separators=(',', ':'), sort_keys=True))
          PY
            exit "${replay_status}"
          fi
          if [ "${PUBLISH}" = "true" ]; then
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime
          else
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime --force-inactive
          fi
          RUNTIME_ROOT="${runtime_root}" PYTHONPATH="${runtime_root}/src" python - <<'PY'
          import json, os
          from pathlib import Path
          from top10decision.auction_v3.config import TARGET_INDEPENDENT_OOS_DATES

          payload=json.loads(
              (Path(os.environ['RUNTIME_ROOT']) / 'outputs/auction_v3/metrics/backtest_latest.json')
              .read_text(encoding='utf-8')
          )
          actual=payload.get('oos_dates')
          if type(actual) is not int or actual < TARGET_INDEPENDENT_OOS_DATES:
              raise SystemExit(
                  f'independent OOS coverage is invalid or below {TARGET_INDEPENDENT_OOS_DATES}'
              )
          PY
      - name: Upload immutable candidate patch
        if: ${{ steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backfill-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/backfill-receipt.json
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate.patch.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: CAS publish one Backfill commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Setup pinned Python for publisher revalidation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked publisher validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Download validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backfill-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {'base_sha.txt', 'backfill-receipt.json', 'candidate.patch', 'candidate.patch.sha256'}
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply exact base candidate and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/publish_staged_index.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PUBLISH_STAGED_INDEX="${RUNNER_TEMP}/publish_staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/auction_v3/history/tplus1_open_0930_v1/training_*.csv','data/auction_v3/history/tplus1_open_0930_v1/manifest_latest.json','data/market/trade_cal_sse.csv')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed)]
          if bad: raise SystemExit(f'non-allowlisted Backfill publish paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['PUBLISH_STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Backfill publish index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Backfill publish paths staged: {bad_modes}')
          if not paths: raise SystemExit('Backfill candidate patch became empty')
          PY
          CANDIDATE_DIR="${RUNNER_TEMP}/candidate" PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PYTHONPATH="${GITHUB_WORKSPACE}/src" python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.validate_backfill_artifacts import validate_backfill_artifacts

          candidate=Path(os.environ['CANDIDATE_DIR'])
          receipt_path=candidate / 'backfill-receipt.json'
          receipt=json.loads(receipt_path.read_text(encoding='utf-8'))
          if not isinstance(receipt, dict):
              raise SystemExit('Backfill publisher receipt must be one JSON object')
          start_date=receipt.get('requested_start_date')
          end_date=receipt.get('requested_end_date')
          maximum=receipt.get('max_missing_dates')
          if type(start_date) is not str or type(end_date) is not str or type(maximum) is not int:
              raise SystemExit('Backfill publisher receipt request fields are invalid')
          validation=validate_backfill_artifacts(
              Path('.').resolve(),
              receipt_path,
              start_date=start_date,
              end_date=end_date,
              max_missing_dates=maximum,
          )
          expected=validation.get('expected_dirty_paths')
          if not isinstance(expected, list) or not expected:
              raise SystemExit('Backfill publisher expected path inventory is invalid')
          paths={
              item.decode()
              for item in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0')
              if item
          }
          if not paths.issubset(set(expected)):
              raise SystemExit('Backfill publisher patch exceeds the validated receipt inventory')
          if validation.get('status') == 'produced':
              required={
                  path for path in expected
                  if path.endswith('/manifest_latest.json') or '/training_' in path
              }
              if not required.issubset(paths):
                  raise SystemExit('Backfill publisher patch omits required produced artifacts')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: extend Decision V11 two-year history'
      - name: Publish exact CAS commit with minimally injected token
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact published Backfill revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
