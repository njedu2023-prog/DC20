name: DC20 · two single-stock auction protocol checks (diagnostic only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/AUCTION_SINGLE_STOCK_PROBE.json"

permissions:
  contents: read

concurrency:
  group: dc20-research-auction-single-stock-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  diagnostic-only:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact version without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test isolated upgrade contracts before the two diagnostic calls
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -B -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production freeze
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -B scripts/validate_decision_model_freeze.py --root .
      - name: Diagnose exactly two frozen T and stock pairs with no retries
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -euo pipefail
          diagnostic_exit=0
          python -B work/profit_1000_upgrade/auction_single_stock_probe.py \
            --output "${RUNNER_TEMP}/single-stock-auction-probe" || diagnostic_exit=$?
          if [ "${diagnostic_exit}" -ne 0 ] && [ "${diagnostic_exit}" -ne 2 ]; then
            exit "${diagnostic_exit}"
          fi
          test -s "${RUNNER_TEMP}/single-stock-auction-probe/auction_single_stock_probe.json"
      - name: Verify no checkout source model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain only the bounded diagnostic without prices or tables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-single-stock-auction-probe-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/single-stock-auction-probe/auction_single_stock_probe.json
          if-no-files-found: error
          retention-days: 30
