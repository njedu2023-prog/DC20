name: DC2.0 · Test Decision Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test-decision-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check

      - name: Run decision core regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -q
