name: DC2.0 · Test Decision Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

jobs:
  test-decision-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "checkout is dirty after Git attribute normalization" >&2
            exit 1
          fi
          eol_violations="$(
            git ls-files --eol |
              awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/'
          )"
          if [[ -n "${eol_violations}" ]]; then
            printf '%s\n' "${eol_violations}"
            echo "tracked text blobs violate their required LF normalization" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check

      - name: Run decision core regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -q

  frozen-canonical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "checkout is dirty after Git attribute normalization" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check

      - name: Run and diagnose full frozen canonical runtime replay
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          replay_report="${RUNNER_TEMP}/core-frozen-replay.json"
          replay_stdout="${RUNNER_TEMP}/core-frozen-replay.stdout"
          set +e
          python scripts/run_deterministic_numeric.py \
            scripts/replay_frozen_canonical_v2.py \
            --root "${GITHUB_WORKSPACE}" \
            --signal-date 20260814 \
            --report-date 20260817 \
            --expected-action-semantic-sha256 1bf6eea649d69688f8263fee60c0df0606cb7b4ed86e0d9fd07f2937f999385f \
            --report "${replay_report}" > "${replay_stdout}"
          replay_status=$?
          set -e
          sed -n '1,240p' "${replay_stdout}"
          REPLAY_REPORT="${replay_report}" \
            REPLAY_STATUS="${replay_status}" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          report = Path(os.environ['REPLAY_REPORT'])
          payload = json.loads(report.read_text(encoding='utf-8'))

          def load(relative):
              path = root / relative
              if not path.is_file():
                  return {}
              return json.loads(path.read_text(encoding='utf-8'))

          manifest = load('models/decision_model_freeze.json')
          meta = load('outputs/auction_v3/models/model_meta_latest.json')
          backtest = load('outputs/auction_v3/metrics/backtest_latest.json')

          def compact(value):
              fingerprint = value if isinstance(value, dict) else {}
              return {
                  key: fingerprint.get(key)
                  for key in (
                      'provenance_sha256',
                      'semantic_sha256',
                      'policy_sha256',
                      'artifact_sha256',
                  )
              }

          manifest_model = (
              manifest.get('production', {})
              .get('canonical_v2', {})
              .get('model', {})
          )
          diagnostic = {
              'status': payload.get('status'),
              'error': payload.get('error'),
              'manifest': compact(
                  manifest_model.get('fingerprint_v2', {})
              ),
              'model_meta': compact(meta.get('model_fingerprint_v2', {})),
              'backtest': compact(backtest.get('model_fingerprint_v2', {})),
          }
          print(json.dumps(
              diagnostic,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ))
          status = int(os.environ['REPLAY_STATUS'])
          if status == 0:
              runtime = payload.get('runtime_validation') or {}
              if (
                  payload.get('status') != 'pass'
                  or runtime.get('validated') is not True
              ):
                  raise SystemExit(
                      'Core full frozen replay runtime was not validated'
                  )
          PY
          if [ "${replay_status}" -ne 0 ]; then
            exit "${replay_status}"
          fi
