name: DC2.0 · Test Decision Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test-decision-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "checkout is dirty after Git attribute normalization" >&2
            exit 1
          fi
          eol_violations="$(
            git ls-files --eol |
              awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/'
          )"
          if [[ -n "${eol_violations}" ]]; then
            printf '%s\n' "${eol_violations}"
            echo "tracked text blobs violate their required LF normalization" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check

      - name: Run decision core regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -q
