name: DC2.0 · Test Decision Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "models/decision_model_freeze.json"
      - "models/decision_promotion_v13_validation.json"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

jobs:
  test-decision-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          if [[ -n "${status}" ]]; then
            printf '%s\n' "${status}"
            echo "checkout is dirty after Git attribute normalization" >&2
            exit 1
          fi
          eol_violations="$(
            git ls-files --eol |
              awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/'
          )"
          if [[ -n "${eol_violations}" ]]; then
            printf '%s\n' "${eol_violations}"
            echo "tracked text blobs violate their required LF normalization" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check

      - name: Run decision core regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -q

      - name: Run full frozen canonical runtime replay
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          replay_report="${RUNNER_TEMP}/core-frozen-replay.json"
          python scripts/run_deterministic_numeric.py \
            scripts/replay_frozen_canonical_v2.py \
            --root "${GITHUB_WORKSPACE}" \
            --signal-date 20260814 \
            --report-date 20260817 \
            --report "${replay_report}"
          REPLAY_REPORT="${replay_report}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ['REPLAY_REPORT']).read_text(encoding='utf-8')
          )
          if payload.get('status') != 'pass':
              raise SystemExit('Core full frozen replay did not pass')
          runtime = payload.get('runtime_validation') or {}
          if runtime.get('validated') is not True:
              raise SystemExit('Core full frozen replay runtime was not validated')
          PY
