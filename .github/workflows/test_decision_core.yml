name: Test Decision Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/top10decision/models/costs.py"
      - "src/top10decision/regime/simple_regime.py"
      - "src/top10decision/risk/guardrails.py"
      - "tests/test_decision_*.py"
      - ".github/workflows/test_decision_core.yml"
  pull_request:
    paths:
      - "src/top10decision/models/costs.py"
      - "src/top10decision/regime/simple_regime.py"
      - "src/top10decision/risk/guardrails.py"
      - "tests/test_decision_*.py"
      - ".github/workflows/test_decision_core.yml"

permissions:
  contents: read

jobs:
  test-decision-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run decision core regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest -q tests/test_decision_*.py
