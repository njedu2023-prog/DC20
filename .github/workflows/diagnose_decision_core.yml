name: DC20 · Read-only core timeout diagnosis

# Supplemental diagnostics only. The frozen core/source/replay jobs remain
# unchanged and required; this job cannot replace or bypass those checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_decision_core.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

jobs:
  test-decision-core:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          eol_violations="$(git ls-files --eol | awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/')"
          test -z "${eol_violations}"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock
      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check
      - name: Validate supervisor on actual Linux process groups
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python -m pytest tests/test_core_diagnostic_supervisor.py -q --tb=short --junitxml="$RUNNER_TEMP/core-supervisor-selftest.xml"
          python -c 'import os,sys,xml.etree.ElementTree as E; assert sys.platform.startswith("linux") and callable(getattr(os,"waitid",None)); r=E.parse(os.environ["RUNNER_TEMP"]+"/core-supervisor-selftest.xml").getroot(); s=list(r.iter("testsuite")); assert sum(int(x.get("tests","0")) for x in s)==30; assert all(int(x.get(k,"0"))==0 for x in s for k in ("skipped","failures","errors"))'
      - name: Run decision core regression tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          node --version
          # A ten-minute observation window is NOT the required core CI gate.
          # Direct regular-file logs avoid a descendant keeping tee/PIPE open.
          # Timeout remains exit 124; cleanup only signals its own child group.
          python -u scripts/diagnose_core_supervisor.py --output "$RUNNER_TEMP/core-timeout-diagnostic"
      - name: Preserve core regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-timeout-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-supervisor-selftest.xml
            ${{ runner.temp }}/core-timeout-diagnostic/core-regression.log
            ${{ runner.temp }}/core-timeout-diagnostic/core-regression.xml
            ${{ runner.temp }}/core-timeout-diagnostic/core-progress.jsonl
            ${{ runner.temp }}/core-timeout-diagnostic/core-supervisor.json
          if-no-files-found: warn
          retention-days: 14
