name: DC2.0 · Deploy Decision Pages

on:
  push:
    branches: [main]
    paths:
      - decision.html
      - outputs/decision/**
      - outputs/auction_v3/metrics/three_engine_oof_top10_latest.csv.gz
      - outputs/auction_v3/metrics/observation_cumulative_latest.json
      - data/decision_three_engines/five_year_supervised_ledger.csv.gz
      - data/decision_three_engines/five_year_ledger_manifest.json
      - data/market/trade_cal_sse.csv
      - data/decision_executable_profit/forward/selections/primary_mixed_index.json
      - data/decision_executable_profit/forward/selections/shadow_*.json
      - data/decision_executable_profit/forward/selections/shadow_*.csv
      - data/decision_executable_profit/forward/verifications/t_verification_*.json
      - data/decision_executable_profit/forward/settlements/settlement_*.json
      - data/decision_executable_profit/forward/statistics/summary.json
      - models/decision_model_freeze.json
      - models/decision_primary_profit_forward_shadow_bridge_contract.json
      - models/decision_primary_profit_research_contract.json
      - models/decision_three_engines/validation_latest.json
      - models/decision_three_rank_history_sources.json
      - src/top10decision/decision/legacy_profit_relative_research.py
      - requirements.lock
      - scripts/build_decision_three_rank_history.py
      - scripts/project_decision_legacy_profit_relative_research.py
      - scripts/publish_primary_profit_rankings.py
      - scripts/freeze_primary_profit_forward_shadow.py
      - scripts/validate_decision_model_freeze.py
      - scripts/decision_pages_truth.py
      - .github/workflows/deploy_dc20_pages.yml
      - .github/workflows/run_primary_profit_forward_shadow.yml
  workflow_dispatch: {}
  workflow_call:
    inputs:
      expected_head:
        description: "Exact writer commit that must be deployed"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dc20-pages
  cancel-in-progress: false

jobs:
  deploy:
    # P0/P1 writers own exact-head Pages deployments. Their marked commits must
    # not start this generic deployer and later replace the writer-owned page.
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        !(
          github.event_name == 'push' &&
          (
            contains(github.event.head_commit.message, '[dc20-p0-pages-owned]') ||
            contains(github.event.head_commit.message, '[dc20-p1-pages-owned]') ||
            contains(github.event.head_commit.message, '[dc20-shadow-pages-owned]')
          )
        )
      }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_head || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact reusable-writer deployment revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "${EXPECTED_HEAD}" | grep -Eq '^[0-9a-f]{40}$'
          test "${actual}" = "${EXPECTED_HEAD}"

      - name: Set up pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact hash-locked Decision runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements.lock

      - name: Validate frozen Decision trust root before projection
        env:
          PYTHONPATH: src
        run: python scripts/validate_decision_model_freeze.py --root .

      - name: Validate optional legacy-profit relative research chain
        id: legacy_profit_relative
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.publish_primary_profit_rankings import (
              SINGLE_INDEX_SCHEMA,
              validate_primary_profit_bundle,
          )
          from top10decision.decision.legacy_profit_relative_research import (
              OUTPUT_ROOT,
              validate_repository_chain,
          )

          root = Path('.').resolve(strict=True)
          source = root / OUTPUT_ROOT
          publish = False
          contract = 'none'
          if source.exists():
              index_path = source / 'index.json'
              index = {}
              if index_path.is_file() and not index_path.is_symlink():
                  try:
                      import json
                      index = json.loads(index_path.read_text(encoding='utf-8'))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      index = {}
              if index.get('schema_version') == SINGLE_INDEX_SCHEMA:
                  bundle = validate_primary_profit_bundle(root)
                  evidence = bundle['single']
                  publish = True
                  contract = 'primary'
                  print(
                      'primary single/mixed profit bundle validated: '
                      f"D={evidence['projection']['signal_date']} "
                      f"N={evidence['projection']['candidate_count']} "
                      f"sha256={evidence['projection_json_sha256']}"
                  )
              else:
                  try:
                      evidence = validate_repository_chain(root)
                  except Exception as exc:
                      # The old sidecar is optional human-decision-support
                      # research. Quarantine it instead of weakening official
                      # promotion truth. A declared P1 schema never reaches
                      # this catch: its complete bundle must pass or deploy
                      # fails closed.
                      print(
                          '::warning title=Legacy profit research quarantined::'
                          f'{type(exc).__name__}: {exc}'
                      )
                  else:
                      publish = True
                      contract = 'legacy'
                      print(
                          'legacy profit relative research validated: '
                          f"D={evidence['signal_date']} "
                          f"N={evidence['candidate_count']} "
                          f"sha256={evidence['projection_sha256']}"
                      )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'publish={str(publish).lower()}\n')
              handle.write(f'contract={contract}\n')
          PY

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build isolated DC2.0 Decision site
        id: site
        env:
          DC2_SYSTEM_NAME: DC2.0
          MAX_REPORT_AGE_DAYS: "1"
          PUBLISH_LEGACY_PROFIT_RELATIVE: ${{ steps.legacy_profit_relative.outputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p _site/outputs
          cp decision.html _site/index.html
          cp decision.html _site/decision.html
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path('outputs/decision').resolve(strict=True)
          destination = Path('_site/outputs/decision')
          destination.mkdir(parents=True, exist_ok=True)
          optional_name = 'legacy_profit_relative_research'
          publish_optional = (
              os.environ.get('PUBLISH_LEGACY_PROFIT_RELATIVE') == 'true'
          )
          for child in source.iterdir():
              if child.name == optional_name:
                  continue
              target = destination / child.name
              if child.is_dir():
                  shutil.copytree(child, target)
              else:
                  shutil.copy2(child, target)
          optional_source = source / optional_name
          if publish_optional:
              if not optional_source.is_dir() or optional_source.is_symlink():
                  raise SystemExit(
                      'validated legacy-profit research directory is unsafe'
                  )
              shutil.copytree(optional_source, destination / optional_name)

          statistics_relative = Path(
              'outputs/auction_v3/metrics/observation_cumulative_latest.json'
          )
          statistics_source = Path(statistics_relative).resolve(strict=True)
          if not statistics_source.is_file() or statistics_source.is_symlink():
              raise SystemExit('public observation statistics source is unsafe')
          statistics = json.loads(statistics_source.read_text(encoding='utf-8'))
          if statistics.get('public_start_signal_date') != '20260828':
              raise SystemExit('public observation statistics must start at D=20260828')
          forward = statistics.get('forward_shadow')
          if not isinstance(forward, dict) or forward.get('start_signal_date') != '20260828':
              raise SystemExit('public forward observation statistics must start at D=20260828')
          statistics_target = Path('_site') / statistics_relative
          statistics_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(statistics_source, statistics_target)
          if statistics_target.read_bytes() != statistics_source.read_bytes():
              raise SystemExit('public observation statistics copy drifted')
          PY
          python3 scripts/build_decision_three_rank_history.py \
            --source-root . \
            --output-root _site/outputs/decision/three_rank_history
          PYTHONPATH=src python3 - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          from pathlib import Path

          from scripts.publish_primary_profit_rankings import (
              CONTRACT_PATH as PRIMARY_PROFIT_CONTRACT_PATH,
              MIXED_INDEX_SCHEMA,
              validate_primary_profit_bundle,
          )
          from top10decision.decision.primary_profit_forward_shadow_bridge import (
              CONTRACT_PATH as PRIMARY_SHADOW_CONTRACT_PATH,
              PRIMARY_INDEX_PATH as PRIMARY_SHADOW_SELECTION_INDEX_PATH,
              PUBLIC_INDEX_PATH as PRIMARY_SHADOW_PUBLIC_INDEX_PATH,
              validate_primary_profit_forward_shadow_repository_chain,
          )
          from top10decision.decision.executable_profit_research_projection import (
              _validate_existing_index_chain,
          )

          repo_root = Path('.').resolve(strict=True)
          site_root = Path('_site').resolve(strict=True)
          index_path = (
              site_root
              / 'outputs/decision/executable_profit_research/index.json'
          )
          if index_path.exists():
              if not index_path.is_file() or index_path.is_symlink():
                  raise SystemExit('Pages executable-profit research index is unsafe')
              candidate_index = json.loads(index_path.read_text(encoding='utf-8'))
              if candidate_index.get('schema_version') == MIXED_INDEX_SCHEMA:
                  bundle = validate_primary_profit_bundle(repo_root)
                  contract_source = repo_root / PRIMARY_PROFIT_CONTRACT_PATH
                  contract_target = site_root / PRIMARY_PROFIT_CONTRACT_PATH
                  contract_target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(contract_source, contract_target)
                  if contract_target.read_bytes() != contract_source.read_bytes():
                      raise SystemExit('Pages P1 contract copy drifted')
                  public_bundle = validate_primary_profit_bundle(
                      site_root,
                      expected_signal_date=bundle['inputs'].signal_date,
                      expected_generation_mode=bundle['inputs'].generation_mode,
                  )
                  shadow_index_source = repo_root / PRIMARY_SHADOW_PUBLIC_INDEX_PATH
                  if shadow_index_source.exists():
                      signal_date = bundle['inputs'].signal_date
                      shadow_chain = validate_primary_profit_forward_shadow_repository_chain(
                          repo_root,
                          signal_date,
                      )
                      shadow_index = json.loads(
                          shadow_index_source.read_text(encoding='utf-8')
                      )
                      mixed_sha = bundle['mixed']['projection_json_sha256']
                      if (
                          shadow_index.get('latest_signal_date') != signal_date
                          or shadow_index.get('latest_mixed_projection_sha256')
                          != mixed_sha
                      ):
                          raise SystemExit(
                              'Pages Shadow sidecar is not bound to same-D P1 bytes'
                          )
                      state_relative = Path(str(shadow_index['latest_state_url']))
                      state_source = repo_root / state_relative
                      if (
                          state_relative.is_absolute()
                          or '..' in state_relative.parts
                          or not state_source.is_file()
                          or state_source.is_symlink()
                          or hashlib.sha256(state_source.read_bytes()).hexdigest()
                          != shadow_index['latest_state_sha256']
                      ):
                          raise SystemExit('Pages Shadow state source is unsafe or SHA-drifted')
                      shadow_state = json.loads(state_source.read_text(encoding='utf-8'))
                      sources = shadow_state.get('source_bindings') or {}
                      mixed = sources.get('mixed_projection') or {}
                      selection = sources.get('selection') or {}
                      statistics = sources.get('statistics') or {}
                      if (
                          shadow_state.get('signal_date') != signal_date
                          or mixed.get('path')
                          != bundle['mixed']['index']['latest_projection_json_url']
                          or mixed.get('sha256') != mixed_sha
                      ):
                          raise SystemExit('Pages Shadow state/P1 binding drifted')

                      selection_relative = Path(str(selection.get('path') or ''))
                      statistics_relative = Path(str(statistics.get('path') or ''))
                      selection_source = repo_root / selection_relative
                      statistics_source = repo_root / statistics_relative
                      for label, source_path, relative, expected_sha in (
                          ('selection', selection_source, selection_relative, selection.get('sha256')),
                          ('statistics', statistics_source, statistics_relative, statistics.get('sha256')),
                      ):
                          if (
                              relative.is_absolute()
                              or '..' in relative.parts
                              or not source_path.is_file()
                              or source_path.is_symlink()
                              or hashlib.sha256(source_path.read_bytes()).hexdigest()
                              != expected_sha
                          ):
                              raise SystemExit(
                                  f'Pages Shadow {label} source is unsafe or SHA-drifted'
                              )
                      selection_payload = json.loads(
                          selection_source.read_text(encoding='utf-8')
                      )
                      csv_relative = Path(
                          str((selection_payload.get('downloads') or {}).get('csv_url') or '')
                      )
                      csv_source = repo_root / csv_relative
                      csv_sha = (selection_payload.get('downloads') or {}).get('csv_sha256')
                      if (
                          csv_relative.is_absolute()
                          or '..' in csv_relative.parts
                          or not csv_source.is_file()
                          or csv_source.is_symlink()
                          or hashlib.sha256(csv_source.read_bytes()).hexdigest() != csv_sha
                      ):
                          raise SystemExit('Pages Shadow selection CSV is unsafe or SHA-drifted')

                      truth_relatives = []
                      expected_truth = {
                          't_verification': (
                              'data/decision_executable_profit/forward/verifications/'
                              f't_verification_{signal_date}.json'
                          ),
                          't1_settlement': (
                              'data/decision_executable_profit/forward/settlements/'
                              f'settlement_{signal_date}.json'
                          ),
                      }
                      for key, expected in expected_truth.items():
                          binding = sources.get(key)
                          if binding is None:
                              continue
                          relative = Path(str(binding.get('path') or ''))
                          source_path = repo_root / relative
                          if (
                              relative.as_posix() != expected
                              or relative.is_absolute()
                              or '..' in relative.parts
                              or not source_path.is_file()
                              or source_path.is_symlink()
                              or hashlib.sha256(source_path.read_bytes()).hexdigest()
                              != binding.get('sha256')
                          ):
                              raise SystemExit(
                                  f'Pages Shadow {key} source is unsafe or SHA-drifted'
                              )
                          truth_relatives.append(relative)

                      exact_sources = (
                          PRIMARY_SHADOW_CONTRACT_PATH,
                          PRIMARY_SHADOW_SELECTION_INDEX_PATH,
                          selection_relative,
                          csv_relative,
                          statistics_relative,
                          *truth_relatives,
                      )
                      for relative in exact_sources:
                          source_path = repo_root / relative
                          target_path = site_root / relative
                          if not source_path.is_file() or source_path.is_symlink():
                              raise SystemExit(
                                  f'Pages exact Shadow source is missing or unsafe: {relative}'
                              )
                          target_path.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(source_path, target_path)
                          if target_path.read_bytes() != source_path.read_bytes():
                              raise SystemExit(
                                  f'Pages exact Shadow source copy drifted: {relative}'
                              )
                      for relative in (
                          PRIMARY_SHADOW_PUBLIC_INDEX_PATH,
                          state_relative,
                      ):
                          if (site_root / relative).read_bytes() != (repo_root / relative).read_bytes():
                              raise SystemExit(
                                  f'Pages public Shadow sidecar bytes drifted: {relative}'
                              )
                      cutover_relative = (
                          Path('outputs/decision/executable_profit_research')
                          / 'shadow_cutover_index.json'
                      )
                      cutover_target = site_root / cutover_relative
                      grandfather_state_relative = (
                          Path('outputs/decision/executable_profit_research')
                          / 'shadow_state_20260828_asof_20260828.json'
                      )
                      chain_status = shadow_chain.get('public_cumulative_status')
                      if chain_status == 'GRANDFATHERED_PRE_CUTOVER_HIDDEN':
                          # Preserve the immutable repository evidence, but never
                          # publish its D25+D28 cumulative summary as the active
                          # Pages chain.  The generated selection-only pointer is
                          # same-D/SHA bound and carries no historical metrics.
                          for relative in (
                              PRIMARY_SHADOW_PUBLIC_INDEX_PATH,
                              state_relative,
                              statistics_relative,
                          ):
                              target = site_root / relative
                              if target.exists():
                                  if not target.is_file() or target.is_symlink():
                                      raise SystemExit(
                                          f'Pages grandfathered Shadow target is unsafe: {relative}'
                                      )
                                  target.unlink()
                          selected_slots = int(
                              (selection_payload.get('shadow_top2') or {}).get(
                                  'actual_slots', -1
                              )
                          )
                          if (
                              signal_date != '20260828'
                              or selected_slots != 2
                              or selection_payload.get('signal_date') != signal_date
                              or selection_payload.get('snapshot_sha256')
                              != selection.get('snapshot_sha256')
                              or selection_payload.get('selection_identity_sha256')
                              != selection.get('selection_identity_sha256')
                          ):
                              raise SystemExit(
                                  'Pages grandfathered Shadow selection-only cutover drifted'
                              )
                          cutover = {
                              'schema_version': (
                                  'dc20_primary_profit_forward_shadow_cutover_index_v1'
                              ),
                              'index_kind': (
                                  'primary_profit_forward_shadow_selection_only_cutover'
                              ),
                              'data_alias': False,
                              'public_start_signal_date': '20260828',
                              'signal_date': signal_date,
                              'exec_date': selection_payload['exec_date'],
                              'exit_date': selection_payload['exit_date'],
                              'candidate_count': selection_payload['top10_count'],
                              'selected_slots': selected_slots,
                              'top10_members_sha256': selection_payload[
                                  'top10_members_sha256'
                              ],
                              'mixed_projection_sha256': mixed_sha,
                              'selection': {
                                  'path': selection_relative.as_posix(),
                                  'sha256': selection['sha256'],
                                  'snapshot_sha256': selection[
                                      'snapshot_sha256'
                                  ],
                                  'selection_identity_sha256': selection[
                                      'selection_identity_sha256'
                                  ],
                                  'csv_path': csv_relative.as_posix(),
                                  'csv_sha256': csv_sha,
                              },
                              'boundaries': shadow_state['boundaries'],
                          }
                          cutover_target.parent.mkdir(parents=True, exist_ok=True)
                          cutover_target.write_text(
                              json.dumps(
                                  cutover,
                                  ensure_ascii=False,
                                  sort_keys=True,
                                  indent=2,
                              ) + '\n',
                              encoding='utf-8',
                          )
                          print(json.dumps({
                              'status': 'PUBLIC_PRIMARY_SHADOW_SELECTION_ONLY_CUTOVER',
                              'signal_date': signal_date,
                              'selected_slots': selected_slots,
                              'mixed_projection_sha256': mixed_sha,
                          }, ensure_ascii=False, sort_keys=True))
                      elif chain_status == 'D28_CUTOVER_VALID':
                          statistics_source_payload = json.loads(
                              statistics_source.read_text(encoding='utf-8')
                          )
                          if (
                              statistics_source_payload.get(
                                  'public_start_signal_date'
                              ) != '20260828'
                              or (
                                  statistics_source_payload.get('scope') or {}
                              ).get('minimum_signal_date') != '20260828'
                          ):
                              raise SystemExit(
                                  'Pages standard Shadow summary lacks D28 cutover marker'
                              )
                          # The repository keeps this immutable pre-cutover pair
                          # for audit, but the bulk outputs/decision projection
                          # must never re-publish it beside the new public chain.
                          grandfather_target = site_root / grandfather_state_relative
                          if grandfather_target.exists():
                              if (
                                  not grandfather_target.is_file()
                                  or grandfather_target.is_symlink()
                              ):
                                  raise SystemExit(
                                      'Pages grandfathered Shadow state target is unsafe'
                                  )
                              grandfather_target.unlink()
                          if cutover_target.exists():
                              if not cutover_target.is_file() or cutover_target.is_symlink():
                                  raise SystemExit('Pages Shadow cutover pointer is unsafe')
                              cutover_target.unlink()
                          print(json.dumps({
                              'status': 'PUBLIC_PRIMARY_SHADOW_CHAIN_COPIED',
                              'signal_date': signal_date,
                              'as_of_date': shadow_state['as_of_date'],
                              'selected_slots': shadow_state['selected_slots'],
                              'mixed_projection_sha256': mixed_sha,
                          }, ensure_ascii=False, sort_keys=True))
                      else:
                          raise SystemExit(
                              f'Pages Shadow cumulative chain status is unsupported: {chain_status}'
                          )
                  print(json.dumps({
                      'status': 'PUBLIC_PRIMARY_PROFIT_CHAIN_VALIDATED',
                      'signal_date': public_bundle['inputs'].signal_date,
                      'generation_mode': public_bundle['inputs'].generation_mode,
                      'candidate_count': len(
                          public_bundle['inputs'].selected_runtime
                      ),
                  }, ensure_ascii=False, sort_keys=True))
                  # The legacy forward-shadow branch below remains byte-for-byte
                  # strict. Point it at an absent sentinel only after the P1
                  # pair has passed its separate complete contract.
                  index_path = site_root / '.p1-primary-profit-already-validated'
          if index_path.exists():
              if not index_path.is_file() or index_path.is_symlink():
                  raise SystemExit('Pages executable-profit research index is unsafe')
              index = json.loads(index_path.read_text(encoding='utf-8'))
              # Validate against the complete repository first. The public
              # site then receives only exact source bytes named by this
              # validated chain; no data directory is copied wholesale.
              _validate_existing_index_chain(repo_root, index)
              signal_date = str(index['latest_signal_date'])
              projection_path = (
                  repo_root / str(index['latest_projection_json_url'])
              )
              statistics_path = repo_root / str(index['latest_statistics_url'])
              projection = json.loads(projection_path.read_text(encoding='utf-8'))
              statistics = json.loads(statistics_path.read_text(encoding='utf-8'))

              expected_paths = {
                  'contract': (
                      'models/decision_executable_profit_research_projection_contract.json'
                  ),
                  'selection_json': (
                      'data/decision_executable_profit/forward/selections/'
                      f'shadow_{signal_date}.json'
                  ),
                  'selection_csv': (
                      'data/decision_executable_profit/forward/selections/'
                      f'shadow_{signal_date}.csv'
                  ),
                  't_verification': (
                      'data/decision_executable_profit/forward/verifications/'
                      f't_verification_{signal_date}.json'
                  ),
                  't1_settlement': (
                      'data/decision_executable_profit/forward/settlements/'
                      f'settlement_{signal_date}.json'
                  ),
                  'statistics': (
                      'data/decision_executable_profit/forward/statistics/summary.json'
                  ),
              }
              selection = projection['source_bindings']['selection']
              exact_sources = [
                  (
                      'contract',
                      expected_paths['contract'],
                      projection['contract_file_sha256'],
                  ),
                  (
                      'selection_json',
                      selection['json_path'],
                      selection['json_sha256'],
                  ),
                  (
                      'selection_csv',
                      selection['csv_path'],
                      selection['csv_sha256'],
                  ),
              ]
              for kind in ('t_verification', 't1_settlement', 'statistics'):
                  binding = statistics['source_bindings'][kind]
                  if binding is not None:
                      exact_sources.append(
                          (kind, binding['path'], binding['file_sha256'])
                      )

              def safe_file(root, relative, label):
                  value = Path(str(relative))
                  if value.is_absolute() or '..' in value.parts:
                      raise SystemExit(f'Pages executable-profit {label} path is unsafe')
                  current = root
                  for part in value.parts:
                      current = current / part
                      if current.is_symlink():
                          raise SystemExit(
                              f'Pages executable-profit {label} has a symlink ancestor'
                          )
                  if not current.is_file() or current.resolve(strict=True) != current:
                      raise SystemExit(
                          f'Pages executable-profit {label} source is not a regular file'
                      )
                  return value, current

              def copy_exact_source(kind, relative, expected_sha256):
                  if relative != expected_paths[kind]:
                      raise SystemExit(
                          f'Pages executable-profit {kind} path is not exact dated source'
                      )
                  if re.fullmatch(r'[0-9a-f]{64}', str(expected_sha256)) is None:
                      raise SystemExit(
                          f'Pages executable-profit {kind} SHA256 is invalid'
                      )
                  value, source = safe_file(repo_root, relative, kind)
                  payload = source.read_bytes()
                  if hashlib.sha256(payload).hexdigest() != expected_sha256:
                      raise SystemExit(
                          f'Pages executable-profit {kind} source SHA256 drifted'
                      )
                  target = site_root / value
                  current = site_root
                  for part in value.parent.parts:
                      current = current / part
                      if current.exists():
                          if not current.is_dir() or current.is_symlink():
                              raise SystemExit(
                                  f'Pages executable-profit {kind} target ancestor is unsafe'
                              )
                      else:
                          current.mkdir()
                  if target.exists() and (
                      not target.is_file() or target.is_symlink()
                  ):
                      raise SystemExit(
                          f'Pages executable-profit {kind} target is unsafe'
                      )
                  target.write_bytes(payload)
                  if (
                      target.read_bytes() != payload
                      or hashlib.sha256(target.read_bytes()).hexdigest()
                      != expected_sha256
                  ):
                      raise SystemExit(
                          f'Pages executable-profit {kind} target copy drifted'
                      )
                  return value.as_posix()

              copied_sources = [
                  copy_exact_source(kind, relative, expected_sha256)
                  for kind, relative, expected_sha256 in exact_sources
              ]
              if len(copied_sources) != len(set(copied_sources)):
                  raise SystemExit(
                      'Pages executable-profit source copy inventory is duplicated'
                  )
              _validate_existing_index_chain(site_root, index)
              print(json.dumps({
                  'status': 'PUBLIC_RESEARCH_CHAIN_VALIDATED',
                  'signal_date': index['latest_signal_date'],
                  'as_of_date': index['latest_statistics_as_of_date'],
                  'projection_url': index['latest_projection_json_url'],
                  'statistics_url': index['latest_statistics_url'],
                  'copied_source_paths': copied_sources,
              }, ensure_ascii=False, sort_keys=True))
          PY
          touch _site/.nojekyll

          HEAD_SHA="$(git rev-parse HEAD)"
          export HEAD_SHA

          python3 - <<'PY'
          import json
          import os
          import html as html_module
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from scripts.decision_pages_truth import (
              assess_decision_pages_truth,
              project_report_index_action_truth,
              validate_report_index_action_truth,
          )
          from scripts.publish_primary_profit_rankings import (
              MIXED_INDEX_SCHEMA,
              validate_primary_profit_bundle,
          )
          from top10decision.decision.executable_profit_research_projection import (
              INDEX_SCHEMA as FORWARD_SHADOW_INDEX_SCHEMA,
          )

          index_path = Path("_site/outputs/decision/report_index.json")
          source_index_path = Path("outputs/decision/report_index.json")
          project_report_index_action_truth(
              source_report_index_path=source_index_path,
              site_root=Path("_site"),
          )

          action_truth = validate_report_index_action_truth(
              report_index_path=index_path,
              site_root=Path("_site"),
          )
          report_index = json.loads(index_path.read_text(encoding="utf-8"))
          report_date = str(report_index.get("latest_report_date", "")).strip()
          report_file = str(report_index.get("latest_report_file", "")).strip()
          latest_rows = [
              row for row in report_index.get("reports", [])
              if isinstance(row, dict) and row.get("report_date") == report_date
          ]
          if len(latest_rows) != 1:
              raise SystemExit("projected report_index must contain one latest report row")
          latest_row = latest_rows[0]
          research_available = latest_row.get("research_available", False)
          research_url = latest_row.get("research_url", "")
          research_kind = latest_row.get("research_kind", "")
          if type(research_available) is not bool:
              raise SystemExit("latest research_available must be a bool when present")
          if not isinstance(research_url, str) or not isinstance(research_kind, str):
              raise SystemExit("latest research URL and kind must be strings")
          if research_available:
              if research_kind == "dc20_independent":
                  expected_research_url = (
                      f"outputs/decision/research_context_dc20_{report_date}.json"
                  )
              elif research_kind in {"legacy_daily", "historical_archive"}:
                  expected_research_url = (
                      f"outputs/decision/research_context_{report_date}.json"
                  )
              else:
                  raise SystemExit("latest research_kind is unsupported")
              if research_url != expected_research_url:
                  raise SystemExit("latest research_url is not exact")
          else:
              expected_research_url = ""
              if research_url or research_kind:
                  raise SystemExit(
                      "unavailable latest research context must not have URL or kind"
                  )
          inventory_projected = report_index.get("inventory_projected")
          source_latest_report_date = report_index.get("source_latest_report_date")
          if not report_date or not report_file:
              raise SystemExit("report_index.json is missing latest_report_date/latest_report_file")
          if type(inventory_projected) is not bool:
              raise SystemExit("projected report_index inventory_projected must be a bool")
          if not isinstance(source_latest_report_date, str):
              raise SystemExit("projected report_index source_latest_report_date must be a string")
          if inventory_projected and report_index.get("generated_at_utc") is not None:
              raise SystemExit("projected inventory must not inherit source generated_at_utc")
          if Path(report_file).name != report_file:
              raise SystemExit(f"latest_report_file must be a basename: {report_file!r}")
          report_path = index_path.parent / report_file
          if not report_path.is_file() or report_path.stat().st_size <= 0:
              raise SystemExit(f"latest report is missing or empty: {report_path}")

          freeze_path = Path("models/decision_model_freeze.json")
          if not freeze_path.is_file():
              raise SystemExit(f"missing Decision freeze manifest: {freeze_path}")
          freeze_manifest = json.loads(freeze_path.read_text(encoding="utf-8"))
          freeze_active = freeze_manifest.get("active") is True

          try:
              report_day = datetime.strptime(report_date, "%Y%m%d").date()
          except ValueError as exc:
              raise SystemExit(f"invalid latest_report_date: {report_date!r}") from exc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          max_report_age_days = int(os.environ["MAX_REPORT_AGE_DAYS"])
          if max_report_age_days < 0:
              raise SystemExit("MAX_REPORT_AGE_DAYS must be non-negative")

          evaluation_path = index_path.parent / f"eval_{report_date}.json"
          truth = assess_decision_pages_truth(
              evaluation_path=evaluation_path,
              calendar_path=Path("data/market/trade_cal_sse.csv"),
              report_date=report_date,
              today=today,
              freeze_active=freeze_active,
              max_report_age_days=max_report_age_days,
          )
          signal_date = truth.signal_date
          report_age_days = (today - report_day).days
          prospective = truth.prospective

          executable_profit_index_path = (
              Path('_site/outputs/decision/executable_profit_research/index.json')
          )
          executable_profit_available = executable_profit_index_path.is_file()
          executable_profit_signal_date = ''
          executable_profit_as_of_date = ''
          executable_profit_projection_url = ''
          executable_profit_statistics_url = ''
          executable_profit_contract = 'none'
          primary_profit_status = None
          primary_profit_generation_mode = None
          primary_profit_candidate_count = None
          primary_profit_top10_members_sha256 = None
          primary_single_profit_projection_sha256 = None
          primary_mixed_profit_projection_sha256 = None
          primary_profit_source_bundle_sha256 = None
          primary_profit_source_feature_snapshot_sha256 = None
          if executable_profit_available:
              executable_profit_index = json.loads(
                  executable_profit_index_path.read_text(encoding='utf-8')
              )
              executable_profit_schema = executable_profit_index.get(
                  'schema_version'
              )
              if executable_profit_schema == MIXED_INDEX_SCHEMA:
                  executable_profit_contract = 'primary'
                  primary_bundle = validate_primary_profit_bundle(Path('_site'))
                  primary_inputs = primary_bundle['inputs']
                  primary_mixed = primary_bundle['mixed']['projection']
                  primary_profit_status = primary_mixed['status']
                  primary_profit_generation_mode = primary_inputs.generation_mode
                  primary_profit_candidate_count = len(
                      primary_inputs.selected_runtime
                  )
                  primary_profit_top10_members_sha256 = primary_mixed[
                      'top10_members_sha256'
                  ]
                  primary_single_profit_projection_sha256 = primary_bundle[
                      'single'
                  ]['projection_json_sha256']
                  primary_mixed_profit_projection_sha256 = primary_bundle[
                      'mixed'
                  ]['projection_json_sha256']
                  primary_profit_source_bundle_sha256 = primary_mixed[
                      'source_bundle_sha256'
                  ]
                  primary_profit_source_feature_snapshot_sha256 = primary_mixed[
                      'source_feature_snapshot_sha256'
                  ]
              elif executable_profit_schema == FORWARD_SHADOW_INDEX_SCHEMA:
                  executable_profit_contract = 'forward_shadow'
              else:
                  raise SystemExit(
                      'unsupported executable-profit research index schema'
                  )
              executable_profit_signal_date = str(
                  executable_profit_index.get('latest_signal_date') or ''
              )
              executable_profit_as_of_date = str(
                  executable_profit_index.get('latest_statistics_as_of_date') or ''
              )
              executable_profit_projection_url = str(
                  executable_profit_index.get('latest_projection_json_url') or ''
              )
              executable_profit_statistics_url = str(
                  executable_profit_index.get('latest_statistics_url') or ''
              )

          # Reconstruct the public state defensively so the workflow fails closed
          # if its strict helper and the rendered truth ever diverge.
          stale_reasons = list(truth.stale_reasons)
          if not freeze_active and "freeze_inactive" not in stale_reasons:
              stale_reasons.append("freeze_inactive")
          if (
              report_age_days < 0
              and not prospective
              and "report_date_in_future" not in stale_reasons
          ):
              stale_reasons.append("report_date_in_future")
          elif (
              report_age_days > max_report_age_days
              and "report_expired" not in stale_reasons
          ):
              stale_reasons.append("report_expired")
          stale = bool(stale_reasons)
          stale_reason = "+".join(stale_reasons) if stale_reasons else "none"
          freshness_state = (
              "STALE"
              if stale
              else "PROSPECTIVE_NEXT_SESSION"
              if prospective
              else "CURRENT"
          )
          if (
              report_age_days != truth.report_age_days
              or tuple(stale_reasons) != truth.stale_reasons
              or stale is not truth.stale
              or stale_reason != truth.stale_reason
              or freshness_state != truth.freshness_state
          ):
              raise SystemExit("Pages freshness helper/rendered truth mismatch")

          head_sha = os.environ["HEAD_SHA"].strip()
          if len(head_sha) != 40:
              raise SystemExit(f"invalid checked-out HEAD SHA: {head_sha!r}")

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          revision = {
              "schema_version": "decision_pages_revision_v3",
              "system_name": os.environ["DC2_SYSTEM_NAME"],
              "repository": repository,
              "branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "head_sha": head_sha,
              "run_id": run_id,
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "run_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "signal_date": signal_date,
              "report_date": report_date,
              "report_file": report_file,
              "latest_action_report_date": action_truth.latest_action_report_date,
              "latest_action_url": action_truth.latest_action_url,
              "latest_research_available": research_available,
              "latest_research_url": research_url,
              "executable_profit_research_available": executable_profit_available,
              "executable_profit_contract": executable_profit_contract,
              "executable_profit_signal_date": executable_profit_signal_date,
              "executable_profit_statistics_as_of_date": executable_profit_as_of_date,
              "executable_profit_projection_url": executable_profit_projection_url,
              "executable_profit_statistics_url": executable_profit_statistics_url,
              "primary_profit_status": primary_profit_status,
              "primary_profit_generation_mode": primary_profit_generation_mode,
              "primary_profit_candidate_count": primary_profit_candidate_count,
              "primary_profit_top10_members_sha256": primary_profit_top10_members_sha256,
              "primary_single_profit_projection_sha256": primary_single_profit_projection_sha256,
              "primary_mixed_profit_projection_sha256": primary_mixed_profit_projection_sha256,
              "primary_profit_source_bundle_sha256": primary_profit_source_bundle_sha256,
              "primary_profit_source_feature_snapshot_sha256": primary_profit_source_feature_snapshot_sha256,
              # The index timestamp proves index reconstruction, not report
              # generation.  Preserve the legacy key as an explicit null so
              # consumers cannot mistake an Auction/migration time for report
              # provenance.
              "report_generated_at_utc": None,
              "report_index_generated_at_utc": report_index.get("generated_at_utc"),
              "report_index_inventory_projected": inventory_projected,
              "source_index_latest_report_date": source_latest_report_date,
              "freeze_active": freeze_active,
              "report_age_days": report_age_days,
              "prospective": prospective,
              "freshness_state": freshness_state,
              "stale": stale,
              "stale_reason": stale_reason,
              "published_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }

          revision_path = Path("_site/revision.json")
          revision_path.write_text(
              json.dumps(revision, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          entry_html = Path("_site/index.html").read_text(encoding="utf-8")
          if "<title>DC2.0 Decision 竞价研究</title>" not in entry_html:
              raise SystemExit("index.html does not carry the DC2.0 display title")
          banner_id = "dc20-truthfulness-banner"
          if banner_id in entry_html:
              raise SystemExit(f"source decision.html unexpectedly contains {banner_id}")
          if stale:
              reason_text = {
                  "freeze_inactive": "生产冻结未启用",
                  "report_expired": f"报告已过期（报告日 {report_date}，距今 {report_age_days} 天）",
                  "report_date_in_future": f"报告日期异常（{report_date} 晚于当前日期）",
              }
              details = "；".join(reason_text[item] for item in stale_reasons)
              banner = (
                  f'<aside id="{banner_id}" role="alert" '
                  f'data-freeze-active="{str(freeze_active).lower()}" '
                  f'data-report-age-days="{report_age_days}" '
                  f'data-stale-reason="{html_module.escape(stale_reason, quote=True)}" '
                  'style="padding:16px 20px;'
                  'border:4px solid #7f1d1d;background:#fee2e2;color:#450a0a;'
                  'font:800 18px/1.5 system-ui,sans-serif;text-align:center">'
                  f'以下报告正文是只读历史快照｜禁止据此交易｜{html_module.escape(details)}'
                  '</aside>'
              )
              report_details = re.search(
                  r'<details\s+id="reportDetails"\b[^>]*>.*?</summary>',
                  entry_html,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              if report_details is None:
                  raise SystemExit("decision.html is missing the report body for stale banner")
              entry_html = (
                  entry_html[: report_details.end()]
                  + banner
                  + entry_html[report_details.end() :]
              )
              Path("_site/index.html").write_text(entry_html, encoding="utf-8")
              Path("_site/decision.html").write_text(entry_html, encoding="utf-8")
          if Path("_site/decision.html").read_bytes() != Path("_site/index.html").read_bytes():
              raise SystemExit("index.html and decision.html must be identical entry points")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"head_sha={head_sha}\n")
              output.write(f"signal_date={signal_date}\n")
              output.write(f"report_date={report_date}\n")
              output.write(f"report_file={report_file}\n")
              output.write(f"research_available={str(research_available).lower()}\n")
              output.write(f"research_url={research_url}\n")
              output.write(f"executable_profit_available={str(executable_profit_available).lower()}\n")
              output.write(f"executable_profit_contract={executable_profit_contract}\n")
              output.write(f"executable_profit_signal_date={executable_profit_signal_date}\n")
              output.write(f"executable_profit_as_of_date={executable_profit_as_of_date}\n")
              output.write(f"executable_profit_projection_url={executable_profit_projection_url}\n")
              output.write(f"executable_profit_statistics_url={executable_profit_statistics_url}\n")
              output.write(f"primary_profit_status={primary_profit_status or ''}\n")
              output.write(f"primary_profit_generation_mode={primary_profit_generation_mode or ''}\n")
              output.write(
                  'primary_profit_candidate_count='
                  f"{'' if primary_profit_candidate_count is None else primary_profit_candidate_count}\n"
              )
              output.write(f"primary_profit_top10_members_sha256={primary_profit_top10_members_sha256 or ''}\n")
              output.write(f"primary_single_profit_projection_sha256={primary_single_profit_projection_sha256 or ''}\n")
              output.write(f"primary_mixed_profit_projection_sha256={primary_mixed_profit_projection_sha256 or ''}\n")
              output.write(f"primary_profit_source_bundle_sha256={primary_profit_source_bundle_sha256 or ''}\n")
              output.write(f"primary_profit_source_feature_snapshot_sha256={primary_profit_source_feature_snapshot_sha256 or ''}\n")
              output.write(f"freeze_active={str(freeze_active).lower()}\n")
              output.write(f"report_age_days={report_age_days}\n")
              output.write(f"prospective={str(prospective).lower()}\n")
              output.write(f"freshness_state={freshness_state}\n")
              output.write(f"stale={str(stale).lower()}\n")
              output.write(f"stale_reason={stale_reason}\n")

          print(json.dumps(revision, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy DC2.0 Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify public primary-profit bundle when present
        if: ${{ steps.site.outputs.executable_profit_contract == 'primary' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SIGNAL_DATE: ${{ steps.site.outputs.executable_profit_signal_date }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          public_root="${RUNNER_TEMP}/generic-public-primary-profit"
          files=(
            revision.json
            models/decision_primary_profit_research_contract.json
            "outputs/decision/primary_d_receipt_${SIGNAL_DATE}.json"
            "outputs/decision/primary_d_runtime_features_${SIGNAL_DATE}.csv"
            "outputs/decision/three_rank_top10_${SIGNAL_DATE}.json"
            "outputs/decision/three_rank_top10_${SIGNAL_DATE}.csv"
            outputs/decision/legacy_profit_relative_research/index.json
            "outputs/decision/legacy_profit_relative_research/projection_${SIGNAL_DATE}.json"
            "outputs/decision/legacy_profit_relative_research/projection_${SIGNAL_DATE}.csv"
            outputs/decision/executable_profit_research/index.json
            "outputs/decision/executable_profit_research/projection_${SIGNAL_DATE}.json"
            "outputs/decision/executable_profit_research/projection_${SIGNAL_DATE}.csv"
          )
          shadow_index="_site/outputs/decision/executable_profit_research/shadow_index.json"
          shadow_cutover_index="_site/outputs/decision/executable_profit_research/shadow_cutover_index.json"
          if [ -f "${shadow_index}" ]; then
            shadow_state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["latest_state_url"])' "${shadow_index}")"
            shadow_selection="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["source_bindings"]["selection"]["path"])' "_site/${shadow_state}")"
            shadow_statistics="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["source_bindings"]["statistics"]["path"])' "_site/${shadow_state}")"
            shadow_csv="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["downloads"]["csv_url"])' "_site/${shadow_selection}")"
            shadow_t="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1],encoding="utf-8"))["source_bindings"]["t_verification"]; print("" if v is None else v["path"])' "_site/${shadow_state}")"
            shadow_t1="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1],encoding="utf-8"))["source_bindings"]["t1_settlement"]; print("" if v is None else v["path"])' "_site/${shadow_state}")"
            files+=(
              models/decision_primary_profit_forward_shadow_bridge_contract.json
              data/decision_executable_profit/forward/selections/primary_mixed_index.json
              "${shadow_selection}"
              "${shadow_csv}"
              "${shadow_statistics}"
              outputs/decision/executable_profit_research/shadow_index.json
              "${shadow_state}"
            )
            if [ -n "${shadow_t}" ]; then files+=("${shadow_t}"); fi
            if [ -n "${shadow_t1}" ]; then files+=("${shadow_t1}"); fi
          elif [ -f "${shadow_cutover_index}" ]; then
            shadow_selection="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["selection"]["path"])' "${shadow_cutover_index}")"
            shadow_csv="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["selection"]["csv_path"])' "${shadow_cutover_index}")"
            files+=(
              models/decision_primary_profit_forward_shadow_bridge_contract.json
              data/decision_executable_profit/forward/selections/primary_mixed_index.json
              outputs/decision/executable_profit_research/shadow_cutover_index.json
              "${shadow_selection}"
              "${shadow_csv}"
            )
          fi
          for relative in "${files[@]}"; do
            mkdir -p "${public_root}/$(dirname "${relative}")"
            curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
              "${PAGE_URL%/}/${relative}?run_id=${GITHUB_RUN_ID}" \
              -o "${public_root}/${relative}"
            cmp -s "_site/${relative}" "${public_root}/${relative}"
          done
          if [ -f "${shadow_cutover_index}" ]; then
            for relative in \
              outputs/decision/executable_profit_research/shadow_index.json \
              data/decision_executable_profit/forward/statistics/summary.json; do
              http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                "${PAGE_URL%/}/${relative}?run_id=${GITHUB_RUN_ID}")"
              if [ "${http_code}" != 404 ]; then
                echo "grandfathered Shadow artifact remained public: ${relative} HTTP ${http_code}" >&2
                exit 1
              fi
            done
          elif [ -f "${shadow_index}" ]; then
            http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              "${PAGE_URL%/}/outputs/decision/executable_profit_research/shadow_cutover_index.json?run_id=${GITHUB_RUN_ID}")"
            if [ "${http_code}" != 404 ]; then
              echo "selection-only cutover pointer remained beside standard Shadow chain" >&2
              exit 1
            fi
          else
            echo "public primary Shadow has neither a standard nor cutover pointer" >&2
            exit 1
          fi
          grandfather_state="outputs/decision/executable_profit_research/shadow_state_20260828_asof_20260828.json"
          http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${PAGE_URL%/}/${grandfather_state}?run_id=${GITHUB_RUN_ID}")"
          if [ "${http_code}" != 404 ]; then
            echo "grandfathered Shadow state remained public: ${grandfather_state} HTTP ${http_code}" >&2
            exit 1
          fi
