name: DC2.0 · Deploy Decision Pages

on:
  push:
    branches: [main]
    paths:
      - decision.html
      - outputs/decision/**
      - outputs/auction_v3/metrics/three_engine_oof_top10_latest.csv.gz
      - data/decision_three_engines/five_year_supervised_ledger.csv.gz
      - data/decision_three_engines/five_year_ledger_manifest.json
      - data/market/trade_cal_sse.csv
      - models/decision_model_freeze.json
      - models/decision_three_engines/validation_latest.json
      - models/decision_three_rank_history_sources.json
      - src/top10decision/decision/legacy_profit_relative_research.py
      - requirements.lock
      - scripts/build_decision_three_rank_history.py
      - scripts/project_decision_legacy_profit_relative_research.py
      - scripts/validate_decision_model_freeze.py
      - scripts/decision_pages_truth.py
      - .github/workflows/deploy_dc20_pages.yml
  schedule:
    - cron: "30 9 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      expected_head:
        description: "Exact writer commit that must be deployed"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dc20-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_head || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact reusable-writer deployment revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "${EXPECTED_HEAD}" | grep -Eq '^[0-9a-f]{40}$'
          test "${actual}" = "${EXPECTED_HEAD}"

      - name: Set up pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact hash-locked Decision runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements.lock

      - name: Validate frozen Decision trust root before projection
        env:
          PYTHONPATH: src
        run: python scripts/validate_decision_model_freeze.py --root .

      - name: Validate optional legacy-profit relative research chain
        id: legacy_profit_relative
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from top10decision.decision.legacy_profit_relative_research import (
              OUTPUT_ROOT,
              validate_repository_chain,
          )

          root = Path('.').resolve(strict=True)
          source = root / OUTPUT_ROOT
          publish = False
          if source.exists():
              try:
                  evidence = validate_repository_chain(root)
              except Exception as exc:
                  # This sidecar is optional human-decision-support research.
                  # Quarantine it instead of blocking or weakening the official
                  # promotion/Decision truth deployment.
                  print(
                      '::warning title=Legacy profit research quarantined::'
                      f'{type(exc).__name__}: {exc}'
                  )
              else:
                  publish = True
                  print(
                      'legacy profit relative research validated: '
                      f"D={evidence['signal_date']} "
                      f"N={evidence['candidate_count']} "
                      f"sha256={evidence['projection_sha256']}"
                  )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'publish={str(publish).lower()}\n')
          PY

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build isolated DC2.0 Decision site
        id: site
        env:
          DC2_SYSTEM_NAME: DC2.0
          MAX_REPORT_AGE_DAYS: "1"
        run: |
          set -euo pipefail
          mkdir -p _site/outputs
          cp decision.html _site/index.html
          cp decision.html _site/decision.html
          PUBLISH_LEGACY_PROFIT_RELATIVE="${{ steps.legacy_profit_relative.outputs.publish }}" \
            python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path('outputs/decision').resolve(strict=True)
          destination = Path('_site/outputs/decision')
          destination.mkdir(parents=True, exist_ok=True)
          optional_name = 'legacy_profit_relative_research'
          publish_optional = (
              os.environ.get('PUBLISH_LEGACY_PROFIT_RELATIVE') == 'true'
          )
          for child in source.iterdir():
              if child.name == optional_name:
                  continue
              target = destination / child.name
              if child.is_dir():
                  shutil.copytree(child, target)
              else:
                  shutil.copy2(child, target)
          optional_source = source / optional_name
          if publish_optional:
              if not optional_source.is_dir() or optional_source.is_symlink():
                  raise SystemExit(
                      'validated legacy-profit research directory is unsafe'
                  )
              shutil.copytree(optional_source, destination / optional_name)
          PY
          python3 scripts/build_decision_three_rank_history.py \
            --source-root . \
            --output-root _site/outputs/decision/three_rank_history
          PYTHONPATH=src python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          from top10decision.decision.executable_profit_research_projection import (
              _validate_existing_index_chain,
          )

          repo_root = Path('.').resolve(strict=True)
          site_root = Path('_site').resolve(strict=True)
          index_path = (
              site_root
              / 'outputs/decision/executable_profit_research/index.json'
          )
          if index_path.exists():
              if not index_path.is_file() or index_path.is_symlink():
                  raise SystemExit('Pages executable-profit research index is unsafe')
              index = json.loads(index_path.read_text(encoding='utf-8'))
              # Validate against the complete repository first. The public
              # site then receives only exact source bytes named by this
              # validated chain; no data directory is copied wholesale.
              _validate_existing_index_chain(repo_root, index)
              signal_date = str(index['latest_signal_date'])
              projection_path = (
                  repo_root / str(index['latest_projection_json_url'])
              )
              statistics_path = repo_root / str(index['latest_statistics_url'])
              projection = json.loads(projection_path.read_text(encoding='utf-8'))
              statistics = json.loads(statistics_path.read_text(encoding='utf-8'))

              expected_paths = {
                  'contract': (
                      'models/decision_executable_profit_research_projection_contract.json'
                  ),
                  'selection_json': (
                      'data/decision_executable_profit/forward/selections/'
                      f'shadow_{signal_date}.json'
                  ),
                  'selection_csv': (
                      'data/decision_executable_profit/forward/selections/'
                      f'shadow_{signal_date}.csv'
                  ),
                  't_verification': (
                      'data/decision_executable_profit/forward/verifications/'
                      f't_verification_{signal_date}.json'
                  ),
                  't1_settlement': (
                      'data/decision_executable_profit/forward/settlements/'
                      f'settlement_{signal_date}.json'
                  ),
                  'statistics': (
                      'data/decision_executable_profit/forward/statistics/summary.json'
                  ),
              }
              selection = projection['source_bindings']['selection']
              exact_sources = [
                  (
                      'contract',
                      expected_paths['contract'],
                      projection['contract_file_sha256'],
                  ),
                  (
                      'selection_json',
                      selection['json_path'],
                      selection['json_sha256'],
                  ),
                  (
                      'selection_csv',
                      selection['csv_path'],
                      selection['csv_sha256'],
                  ),
              ]
              for kind in ('t_verification', 't1_settlement', 'statistics'):
                  binding = statistics['source_bindings'][kind]
                  if binding is not None:
                      exact_sources.append(
                          (kind, binding['path'], binding['file_sha256'])
                      )

              def safe_file(root, relative, label):
                  value = Path(str(relative))
                  if value.is_absolute() or '..' in value.parts:
                      raise SystemExit(f'Pages executable-profit {label} path is unsafe')
                  current = root
                  for part in value.parts:
                      current = current / part
                      if current.is_symlink():
                          raise SystemExit(
                              f'Pages executable-profit {label} has a symlink ancestor'
                          )
                  if not current.is_file() or current.resolve(strict=True) != current:
                      raise SystemExit(
                          f'Pages executable-profit {label} source is not a regular file'
                      )
                  return value, current

              def copy_exact_source(kind, relative, expected_sha256):
                  if relative != expected_paths[kind]:
                      raise SystemExit(
                          f'Pages executable-profit {kind} path is not exact dated source'
                      )
                  if re.fullmatch(r'[0-9a-f]{64}', str(expected_sha256)) is None:
                      raise SystemExit(
                          f'Pages executable-profit {kind} SHA256 is invalid'
                      )
                  value, source = safe_file(repo_root, relative, kind)
                  payload = source.read_bytes()
                  if hashlib.sha256(payload).hexdigest() != expected_sha256:
                      raise SystemExit(
                          f'Pages executable-profit {kind} source SHA256 drifted'
                      )
                  target = site_root / value
                  current = site_root
                  for part in value.parent.parts:
                      current = current / part
                      if current.exists():
                          if not current.is_dir() or current.is_symlink():
                              raise SystemExit(
                                  f'Pages executable-profit {kind} target ancestor is unsafe'
                              )
                      else:
                          current.mkdir()
                  if target.exists() and (
                      not target.is_file() or target.is_symlink()
                  ):
                      raise SystemExit(
                          f'Pages executable-profit {kind} target is unsafe'
                      )
                  target.write_bytes(payload)
                  if (
                      target.read_bytes() != payload
                      or hashlib.sha256(target.read_bytes()).hexdigest()
                      != expected_sha256
                  ):
                      raise SystemExit(
                          f'Pages executable-profit {kind} target copy drifted'
                      )
                  return value.as_posix()

              copied_sources = [
                  copy_exact_source(kind, relative, expected_sha256)
                  for kind, relative, expected_sha256 in exact_sources
              ]
              if len(copied_sources) != len(set(copied_sources)):
                  raise SystemExit(
                      'Pages executable-profit source copy inventory is duplicated'
                  )
              _validate_existing_index_chain(site_root, index)
              print(json.dumps({
                  'status': 'PUBLIC_RESEARCH_CHAIN_VALIDATED',
                  'signal_date': index['latest_signal_date'],
                  'as_of_date': index['latest_statistics_as_of_date'],
                  'projection_url': index['latest_projection_json_url'],
                  'statistics_url': index['latest_statistics_url'],
                  'copied_source_paths': copied_sources,
              }, ensure_ascii=False, sort_keys=True))
          PY
          touch _site/.nojekyll

          HEAD_SHA="$(git rev-parse HEAD)"
          export HEAD_SHA

          python3 - <<'PY'
          import json
          import os
          import html as html_module
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from scripts.decision_pages_truth import (
              assess_decision_pages_truth,
              project_report_index_action_truth,
              validate_report_index_action_truth,
          )

          index_path = Path("_site/outputs/decision/report_index.json")
          source_index_path = Path("outputs/decision/report_index.json")
          project_report_index_action_truth(
              source_report_index_path=source_index_path,
              site_root=Path("_site"),
          )

          action_truth = validate_report_index_action_truth(
              report_index_path=index_path,
              site_root=Path("_site"),
          )
          report_index = json.loads(index_path.read_text(encoding="utf-8"))
          report_date = str(report_index.get("latest_report_date", "")).strip()
          report_file = str(report_index.get("latest_report_file", "")).strip()
          latest_rows = [
              row for row in report_index.get("reports", [])
              if isinstance(row, dict) and row.get("report_date") == report_date
          ]
          if len(latest_rows) != 1:
              raise SystemExit("projected report_index must contain one latest report row")
          latest_row = latest_rows[0]
          research_available = latest_row.get("research_available", False)
          research_url = latest_row.get("research_url", "")
          if type(research_available) is not bool:
              raise SystemExit("latest research_available must be a bool when present")
          expected_research_url = f"outputs/decision/research_context_{report_date}.json"
          if research_available and research_url != expected_research_url:
              raise SystemExit("latest research_url is not exact")
          if not research_available and research_url:
              raise SystemExit("unavailable latest research context must not have research_url")
          inventory_projected = report_index.get("inventory_projected")
          source_latest_report_date = report_index.get("source_latest_report_date")
          if not report_date or not report_file:
              raise SystemExit("report_index.json is missing latest_report_date/latest_report_file")
          if type(inventory_projected) is not bool:
              raise SystemExit("projected report_index inventory_projected must be a bool")
          if not isinstance(source_latest_report_date, str):
              raise SystemExit("projected report_index source_latest_report_date must be a string")
          if inventory_projected and report_index.get("generated_at_utc") is not None:
              raise SystemExit("projected inventory must not inherit source generated_at_utc")
          if Path(report_file).name != report_file:
              raise SystemExit(f"latest_report_file must be a basename: {report_file!r}")
          report_path = index_path.parent / report_file
          if not report_path.is_file() or report_path.stat().st_size <= 0:
              raise SystemExit(f"latest report is missing or empty: {report_path}")

          freeze_path = Path("models/decision_model_freeze.json")
          if not freeze_path.is_file():
              raise SystemExit(f"missing Decision freeze manifest: {freeze_path}")
          freeze_manifest = json.loads(freeze_path.read_text(encoding="utf-8"))
          freeze_active = freeze_manifest.get("active") is True

          try:
              report_day = datetime.strptime(report_date, "%Y%m%d").date()
          except ValueError as exc:
              raise SystemExit(f"invalid latest_report_date: {report_date!r}") from exc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          max_report_age_days = int(os.environ["MAX_REPORT_AGE_DAYS"])
          if max_report_age_days < 0:
              raise SystemExit("MAX_REPORT_AGE_DAYS must be non-negative")

          evaluation_path = index_path.parent / f"eval_{report_date}.json"
          truth = assess_decision_pages_truth(
              evaluation_path=evaluation_path,
              calendar_path=Path("data/market/trade_cal_sse.csv"),
              report_date=report_date,
              today=today,
              freeze_active=freeze_active,
              max_report_age_days=max_report_age_days,
          )
          signal_date = truth.signal_date
          report_age_days = (today - report_day).days
          prospective = truth.prospective

          executable_profit_index_path = (
              Path('_site/outputs/decision/executable_profit_research/index.json')
          )
          executable_profit_available = executable_profit_index_path.is_file()
          executable_profit_signal_date = ''
          executable_profit_as_of_date = ''
          executable_profit_projection_url = ''
          executable_profit_statistics_url = ''
          if executable_profit_available:
              executable_profit_index = json.loads(
                  executable_profit_index_path.read_text(encoding='utf-8')
              )
              executable_profit_signal_date = str(
                  executable_profit_index.get('latest_signal_date') or ''
              )
              executable_profit_as_of_date = str(
                  executable_profit_index.get('latest_statistics_as_of_date') or ''
              )
              executable_profit_projection_url = str(
                  executable_profit_index.get('latest_projection_json_url') or ''
              )
              executable_profit_statistics_url = str(
                  executable_profit_index.get('latest_statistics_url') or ''
              )

          # Reconstruct the public state defensively so the workflow fails closed
          # if its strict helper and the rendered truth ever diverge.
          stale_reasons = list(truth.stale_reasons)
          if not freeze_active and "freeze_inactive" not in stale_reasons:
              stale_reasons.append("freeze_inactive")
          if (
              report_age_days < 0
              and not prospective
              and "report_date_in_future" not in stale_reasons
          ):
              stale_reasons.append("report_date_in_future")
          elif (
              report_age_days > max_report_age_days
              and "report_expired" not in stale_reasons
          ):
              stale_reasons.append("report_expired")
          stale = bool(stale_reasons)
          stale_reason = "+".join(stale_reasons) if stale_reasons else "none"
          freshness_state = (
              "STALE"
              if stale
              else "PROSPECTIVE_NEXT_SESSION"
              if prospective
              else "CURRENT"
          )
          if (
              report_age_days != truth.report_age_days
              or tuple(stale_reasons) != truth.stale_reasons
              or stale is not truth.stale
              or stale_reason != truth.stale_reason
              or freshness_state != truth.freshness_state
          ):
              raise SystemExit("Pages freshness helper/rendered truth mismatch")

          head_sha = os.environ["HEAD_SHA"].strip()
          if len(head_sha) != 40:
              raise SystemExit(f"invalid checked-out HEAD SHA: {head_sha!r}")

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["GITHUB_RUN_ID"])
          revision = {
              "schema_version": "decision_pages_revision_v3",
              "system_name": os.environ["DC2_SYSTEM_NAME"],
              "repository": repository,
              "branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "head_sha": head_sha,
              "run_id": run_id,
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "run_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "signal_date": signal_date,
              "report_date": report_date,
              "report_file": report_file,
              "latest_action_report_date": action_truth.latest_action_report_date,
              "latest_action_url": action_truth.latest_action_url,
              "latest_research_available": research_available,
              "latest_research_url": research_url,
              "executable_profit_research_available": executable_profit_available,
              "executable_profit_signal_date": executable_profit_signal_date,
              "executable_profit_statistics_as_of_date": executable_profit_as_of_date,
              "executable_profit_projection_url": executable_profit_projection_url,
              "executable_profit_statistics_url": executable_profit_statistics_url,
              # The index timestamp proves index reconstruction, not report
              # generation.  Preserve the legacy key as an explicit null so
              # consumers cannot mistake an Auction/migration time for report
              # provenance.
              "report_generated_at_utc": None,
              "report_index_generated_at_utc": report_index.get("generated_at_utc"),
              "report_index_inventory_projected": inventory_projected,
              "source_index_latest_report_date": source_latest_report_date,
              "freeze_active": freeze_active,
              "report_age_days": report_age_days,
              "prospective": prospective,
              "freshness_state": freshness_state,
              "stale": stale,
              "stale_reason": stale_reason,
              "published_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }

          revision_path = Path("_site/revision.json")
          revision_path.write_text(
              json.dumps(revision, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          entry_html = Path("_site/index.html").read_text(encoding="utf-8")
          if "<title>DC2.0 Decision 竞价研究</title>" not in entry_html:
              raise SystemExit("index.html does not carry the DC2.0 display title")
          banner_id = "dc20-truthfulness-banner"
          if banner_id in entry_html:
              raise SystemExit(f"source decision.html unexpectedly contains {banner_id}")
          if stale:
              reason_text = {
                  "freeze_inactive": "生产冻结未启用",
                  "report_expired": f"报告已过期（报告日 {report_date}，距今 {report_age_days} 天）",
                  "report_date_in_future": f"报告日期异常（{report_date} 晚于当前日期）",
              }
              details = "；".join(reason_text[item] for item in stale_reasons)
              banner = (
                  f'<aside id="{banner_id}" role="alert" '
                  f'data-freeze-active="{str(freeze_active).lower()}" '
                  f'data-report-age-days="{report_age_days}" '
                  f'data-stale-reason="{html_module.escape(stale_reason, quote=True)}" '
                  'style="position:sticky;top:0;z-index:2147483647;padding:16px 20px;'
                  'border:4px solid #7f1d1d;background:#fee2e2;color:#450a0a;'
                  'font:800 18px/1.5 system-ui,sans-serif;text-align:center">'
                  f'只读历史快照｜禁止据此交易｜{html_module.escape(details)}'
                  '</aside>'
              )
              body = re.search(r"<body\b[^>]*>", entry_html, flags=re.IGNORECASE)
              if body is None:
                  raise SystemExit("decision.html is missing a body element for stale banner")
              entry_html = entry_html[: body.end()] + banner + entry_html[body.end() :]
              Path("_site/index.html").write_text(entry_html, encoding="utf-8")
              Path("_site/decision.html").write_text(entry_html, encoding="utf-8")
          if Path("_site/decision.html").read_bytes() != Path("_site/index.html").read_bytes():
              raise SystemExit("index.html and decision.html must be identical entry points")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"head_sha={head_sha}\n")
              output.write(f"signal_date={signal_date}\n")
              output.write(f"report_date={report_date}\n")
              output.write(f"report_file={report_file}\n")
              output.write(f"research_available={str(research_available).lower()}\n")
              output.write(f"research_url={research_url}\n")
              output.write(f"executable_profit_available={str(executable_profit_available).lower()}\n")
              output.write(f"executable_profit_signal_date={executable_profit_signal_date}\n")
              output.write(f"executable_profit_as_of_date={executable_profit_as_of_date}\n")
              output.write(f"executable_profit_projection_url={executable_profit_projection_url}\n")
              output.write(f"executable_profit_statistics_url={executable_profit_statistics_url}\n")
              output.write(f"freeze_active={str(freeze_active).lower()}\n")
              output.write(f"report_age_days={report_age_days}\n")
              output.write(f"prospective={str(prospective).lower()}\n")
              output.write(f"freshness_state={freshness_state}\n")
              output.write(f"stale={str(stale).lower()}\n")
              output.write(f"stale_reason={stale_reason}\n")

          print(json.dumps(revision, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy DC2.0 Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify public DC2.0 Pages revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_HEAD: ${{ steps.site.outputs.head_sha }}
          EXPECTED_SIGNAL_DATE: ${{ steps.site.outputs.signal_date }}
          EXPECTED_REPORT_DATE: ${{ steps.site.outputs.report_date }}
          EXPECTED_REPORT_FILE: ${{ steps.site.outputs.report_file }}
          EXPECTED_RESEARCH_AVAILABLE: ${{ steps.site.outputs.research_available }}
          EXPECTED_RESEARCH_URL: ${{ steps.site.outputs.research_url }}
          EXPECTED_EXECUTABLE_PROFIT_AVAILABLE: ${{ steps.site.outputs.executable_profit_available }}
          EXPECTED_EXECUTABLE_PROFIT_SIGNAL_DATE: ${{ steps.site.outputs.executable_profit_signal_date }}
          EXPECTED_EXECUTABLE_PROFIT_AS_OF_DATE: ${{ steps.site.outputs.executable_profit_as_of_date }}
          EXPECTED_EXECUTABLE_PROFIT_PROJECTION_URL: ${{ steps.site.outputs.executable_profit_projection_url }}
          EXPECTED_EXECUTABLE_PROFIT_STATISTICS_URL: ${{ steps.site.outputs.executable_profit_statistics_url }}
          EXPECTED_FREEZE_ACTIVE: ${{ steps.site.outputs.freeze_active }}
          EXPECTED_REPORT_AGE_DAYS: ${{ steps.site.outputs.report_age_days }}
          EXPECTED_PROSPECTIVE: ${{ steps.site.outputs.prospective }}
          EXPECTED_FRESHNESS_STATE: ${{ steps.site.outputs.freshness_state }}
          EXPECTED_STALE: ${{ steps.site.outputs.stale }}
          EXPECTED_STALE_REASON: ${{ steps.site.outputs.stale_reason }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          from top10decision.decision.executable_profit_research_projection import (
              validate_research_projection,
              validate_research_projection_index,
              validate_shadow_statistics_projection,
          )

          base_url = os.environ["PAGE_URL"].rstrip("/") + "/"
          expected_head = os.environ["EXPECTED_HEAD"]
          expected_signal_date = os.environ["EXPECTED_SIGNAL_DATE"]
          expected_report_date = os.environ["EXPECTED_REPORT_DATE"]
          expected_report_file = os.environ["EXPECTED_REPORT_FILE"]
          expected_research_available = os.environ["EXPECTED_RESEARCH_AVAILABLE"] == "true"
          expected_research_url = os.environ["EXPECTED_RESEARCH_URL"]
          expected_executable_profit_available = os.environ["EXPECTED_EXECUTABLE_PROFIT_AVAILABLE"] == "true"
          expected_executable_profit_signal_date = os.environ["EXPECTED_EXECUTABLE_PROFIT_SIGNAL_DATE"]
          expected_executable_profit_as_of_date = os.environ["EXPECTED_EXECUTABLE_PROFIT_AS_OF_DATE"]
          expected_executable_profit_projection_url = os.environ["EXPECTED_EXECUTABLE_PROFIT_PROJECTION_URL"]
          expected_executable_profit_statistics_url = os.environ["EXPECTED_EXECUTABLE_PROFIT_STATISTICS_URL"]
          expected_freeze_active = os.environ["EXPECTED_FREEZE_ACTIVE"] == "true"
          expected_report_age_days = int(os.environ["EXPECTED_REPORT_AGE_DAYS"])
          expected_prospective = os.environ["EXPECTED_PROSPECTIVE"] == "true"
          expected_freshness_state = os.environ["EXPECTED_FRESHNESS_STATE"]
          expected_stale = os.environ["EXPECTED_STALE"] == "true"
          expected_stale_reason = os.environ["EXPECTED_STALE_REASON"]
          expected_run_id = os.environ["EXPECTED_RUN_ID"]
          expected_repository = os.environ["EXPECTED_REPOSITORY"]
          cache_buster = f"?run_id={expected_run_id}"

          def fetch_bytes(path):
              request = Request(
                  urljoin(base_url, path) + cache_buster,
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "DC2.0-Pages-verifier",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"GET {path!r} returned HTTP {response.status}")
                  return response.read()

          def fetch_text(path):
              return fetch_bytes(path).decode("utf-8")

          last_error = None
          for attempt in range(1, 13):
              try:
                  root_html = fetch_text("")
                  decision_html = fetch_text("decision.html")
                  revision = json.loads(fetch_text("revision.json"))
                  public_index = json.loads(fetch_text("outputs/decision/report_index.json"))
                  public_eval = json.loads(
                      fetch_text(f"outputs/decision/eval_{expected_report_date}.json")
                  )
                  public_report = fetch_text(f"outputs/decision/{expected_report_file}")
                  public_research = (
                      json.loads(fetch_text(expected_research_url))
                      if expected_research_available
                      else None
                  )
                  public_executable_profit_index = None
                  if expected_executable_profit_available:
                      executable_profit_prefix = (
                          'outputs/decision/executable_profit_research/'
                      )
                      executable_profit_index_url = executable_profit_prefix + 'index.json'
                      local_executable_profit_index = (
                          Path('_site') / executable_profit_index_url
                      )
                      local_executable_profit_index_bytes = (
                          local_executable_profit_index.read_bytes()
                      )
                      public_executable_profit_index_bytes = fetch_bytes(
                          executable_profit_index_url
                      )
                      if (
                          public_executable_profit_index_bytes
                          != local_executable_profit_index_bytes
                      ):
                          raise RuntimeError(
                              'executable-profit public index differs from exact build'
                          )
                      public_executable_profit_index = json.loads(
                          public_executable_profit_index_bytes.decode('utf-8')
                      )
                      validate_research_projection_index(
                          public_executable_profit_index
                      )
                      if (
                          public_executable_profit_index.get('latest_signal_date')
                          != expected_executable_profit_signal_date
                          or public_executable_profit_index.get(
                              'latest_statistics_as_of_date'
                          )
                          != expected_executable_profit_as_of_date
                          or public_executable_profit_index.get(
                              'latest_projection_json_url'
                          )
                          != expected_executable_profit_projection_url
                          or public_executable_profit_index.get(
                              'latest_statistics_url'
                          )
                          != expected_executable_profit_statistics_url
                      ):
                          raise RuntimeError(
                              'executable-profit public index date/URL binding drifted'
                          )
                      executable_profit_bindings = (
                          (
                              public_executable_profit_index[
                                  'latest_projection_json_url'
                              ],
                              public_executable_profit_index[
                                  'latest_projection_json_sha256'
                              ],
                              'projection_json',
                          ),
                          (
                              public_executable_profit_index[
                                  'latest_projection_csv_url'
                              ],
                              public_executable_profit_index[
                                  'latest_projection_csv_sha256'
                              ],
                              'projection_csv',
                          ),
                          (
                              public_executable_profit_index[
                                  'latest_statistics_url'
                              ],
                              public_executable_profit_index[
                                  'latest_statistics_json_sha256'
                              ],
                              'statistics',
                          ),
                      )
                      executable_profit_payloads = {}
                      for url, expected_sha256, kind in executable_profit_bindings:
                          if (
                              not isinstance(url, str)
                              or not url.startswith(executable_profit_prefix)
                              or 'latest' in url.lower()
                          ):
                              raise RuntimeError(
                                  f'executable-profit public {kind} URL is not exact dated'
                              )
                          public_bytes = fetch_bytes(url)
                          if hashlib.sha256(public_bytes).hexdigest() != expected_sha256:
                              raise RuntimeError(
                                  f'executable-profit public SHA256 mismatch: {url}'
                              )
                          local_path = Path('_site') / url
                          if public_bytes != local_path.read_bytes():
                              raise RuntimeError(
                                  f'executable-profit public bytes differ from build: {url}'
                              )
                          if kind != 'projection_csv':
                              executable_profit_payloads[kind] = json.loads(
                                  public_bytes.decode('utf-8')
                              )
                      validate_research_projection(
                          executable_profit_payloads['projection_json'],
                          require_downloads=True,
                      )
                      validate_shadow_statistics_projection(
                          executable_profit_payloads['statistics']
                      )
                      projection_payload = executable_profit_payloads[
                          'projection_json'
                      ]
                      statistics_payload = executable_profit_payloads['statistics']
                      exact_signal_date = str(
                          public_executable_profit_index['latest_signal_date']
                      )
                      expected_source_paths = {
                          'contract': (
                              'models/'
                              'decision_executable_profit_research_projection_contract.json'
                          ),
                          'selection_json': (
                              'data/decision_executable_profit/forward/selections/'
                              f'shadow_{exact_signal_date}.json'
                          ),
                          'selection_csv': (
                              'data/decision_executable_profit/forward/selections/'
                              f'shadow_{exact_signal_date}.csv'
                          ),
                          'three_rank_json': (
                              'outputs/decision/'
                              f'three_rank_top10_{exact_signal_date}.json'
                          ),
                          'three_rank_csv': (
                              'outputs/decision/'
                              f'three_rank_top10_{exact_signal_date}.csv'
                          ),
                          't_verification': (
                              'data/decision_executable_profit/forward/verifications/'
                              f't_verification_{exact_signal_date}.json'
                          ),
                          't1_settlement': (
                              'data/decision_executable_profit/forward/settlements/'
                              f'settlement_{exact_signal_date}.json'
                          ),
                          'statistics': (
                              'data/decision_executable_profit/forward/statistics/'
                              'summary.json'
                          ),
                      }
                      projection_sources = projection_payload['source_bindings']
                      exact_source_bindings = [
                          (
                              'contract',
                              expected_source_paths['contract'],
                              projection_payload['contract_file_sha256'],
                          ),
                          (
                              'selection_json',
                              projection_sources['selection']['json_path'],
                              projection_sources['selection']['json_sha256'],
                          ),
                          (
                              'selection_csv',
                              projection_sources['selection']['csv_path'],
                              projection_sources['selection']['csv_sha256'],
                          ),
                          (
                              'three_rank_json',
                              projection_sources['three_rank']['json_path'],
                              projection_sources['three_rank']['json_sha256'],
                          ),
                          (
                              'three_rank_csv',
                              projection_sources['three_rank']['csv_path'],
                              projection_sources['three_rank']['csv_sha256'],
                          ),
                      ]
                      for kind in (
                          't_verification',
                          't1_settlement',
                          'statistics',
                      ):
                          binding = statistics_payload['source_bindings'][kind]
                          if binding is not None:
                              exact_source_bindings.append(
                                  (kind, binding['path'], binding['file_sha256'])
                              )

                      seen_source_urls = set()
                      for kind, url, expected_sha256 in exact_source_bindings:
                          if (
                              url != expected_source_paths[kind]
                              or re.fullmatch(
                                  r'[0-9a-f]{64}', str(expected_sha256)
                              )
                              is None
                              or url in seen_source_urls
                          ):
                              raise RuntimeError(
                                  f'executable-profit public {kind} source binding is not exact'
                              )
                          seen_source_urls.add(url)
                          local_source_path = Path('_site') / url
                          if (
                              not local_source_path.is_file()
                              or local_source_path.is_symlink()
                          ):
                              raise RuntimeError(
                                  f'executable-profit local source is missing: {url}'
                              )
                          local_source_bytes = local_source_path.read_bytes()
                          public_source_bytes = fetch_bytes(url)
                          if (
                              hashlib.sha256(public_source_bytes).hexdigest()
                              != expected_sha256
                          ):
                              raise RuntimeError(
                                  f'executable-profit public source SHA256 mismatch: {url}'
                              )
                          if public_source_bytes != local_source_bytes:
                              raise RuntimeError(
                                  'executable-profit public source bytes differ '
                                  f'from exact build: {url}'
                              )
                  history_prefix = "outputs/decision/three_rank_history/"
                  local_history_root = Path("_site") / history_prefix
                  local_history_index_bytes = (local_history_root / "index.json").read_bytes()
                  public_history_index_bytes = fetch_bytes(history_prefix + "index.json")
                  if public_history_index_bytes != local_history_index_bytes:
                      raise RuntimeError("history public SHA256 mismatch: index.json")
                  history_index = json.loads(public_history_index_bytes.decode("utf-8"))
                  if (
                      history_index.get("schema_version")
                      != "dc20_three_rank_history_index_v2"
                      or history_index.get("index_kind")
                      != "dated_annual_shards_pointer_only"
                      or history_index.get("data_alias") is not False
                      or history_index.get("latest_fallback_allowed") is not False
                      or history_index.get("actual_execution_claimed") is not False
                  ):
                      raise RuntimeError("public history index contract is invalid")

                  history_bindings = [
                      (
                          history_index.get("statistics_url"),
                          history_index.get("statistics_sha256"),
                      ),
                      (
                          history_index.get("report_map_url"),
                          history_index.get("report_map_sha256"),
                      ),
                  ]
                  for shard in history_index.get("shards", []):
                      if not isinstance(shard, dict):
                          raise RuntimeError("public history shard binding is invalid")
                      history_bindings.extend(
                          [
                              (shard.get("json_url"), shard.get("json_sha256")),
                              (shard.get("csv_url"), shard.get("csv_sha256")),
                              (
                                  shard.get("evidence_url"),
                                  shard.get("evidence_sha256"),
                              ),
                          ]
                      )
                  for history_url, expected_history_sha256 in history_bindings:
                      if (
                          not isinstance(history_url, str)
                          or not history_url.startswith(history_prefix)
                          or "latest" in history_url.lower()
                          or not isinstance(expected_history_sha256, str)
                          or len(expected_history_sha256) != 64
                      ):
                          raise RuntimeError("public history artifact binding is invalid")
                      public_history_bytes = fetch_bytes(history_url)
                      if hashlib.sha256(public_history_bytes).hexdigest() != expected_history_sha256:
                          raise RuntimeError(
                              f"history public SHA256 mismatch: {history_url}"
                          )
                      local_history_path = Path("_site") / history_url
                      if public_history_bytes != local_history_path.read_bytes():
                          raise RuntimeError(
                              f"history public bytes differ from build: {history_url}"
                          )
                  history_statistics = json.loads(
                      fetch_text(history_index["statistics_url"])
                  )
                  p_fill_oof = history_statistics.get("p_fill_shadow_top2_oof")
                  p_fill_forward = history_statistics.get(
                      "p_fill_shadow_top2_forward"
                  )
                  if (
                      history_statistics.get("schema_version")
                      != "dc20_three_rank_history_statistics_v2"
                      or history_statistics.get("actual_execution_claimed") is not False
                      or history_statistics.get("final_model_historical_scoring_used")
                      is not False
                      or history_statistics.get("calendar_source")
                      != "tushare:trade_cal:SSE"
                      or history_statistics.get("strict_calendar") is not True
                      or history_statistics.get("exchange") != "SSE"
                      or history_statistics["official_model_status"]["promotion"]
                      != "TIME_HONEST_OOF_RESEARCH"
                      or history_statistics["official_model_status"]["big_loss"]
                      != "RESEARCH_NOT_RELEASED"
                      or history_statistics["official_model_status"]["profit"]
                      != "RESEARCH_NOT_RELEASED"
                      or not isinstance(p_fill_oof, dict)
                      or p_fill_oof.get("schema_version")
                      != "dc20_p_fill_shadow_oof_cumulative_v1"
                      or p_fill_oof.get("selection_dates", 0) <= 0
                      or p_fill_oof.get("selected_slots", 0) <= 0
                      or p_fill_oof.get("separation_guards", {}).get(
                          "actual_execution_claimed"
                      ) is not False
                      or not isinstance(p_fill_forward, dict)
                      or p_fill_forward.get("schema_version")
                      != "dc20_p_fill_shadow_forward_top2_v1"
                      or p_fill_forward.get("separation_guards", {}).get(
                          "actual_execution_claimed"
                      ) is not False
                      or p_fill_forward.get("fill_truth", {}).get(
                          "actual_order_fill_observed"
                      ) is not False
                      or p_fill_forward.get("returns", {}).get(
                          "actual_trading_result"
                      ) is not False
                  ):
                      raise RuntimeError("public history release status is unsafe")

                  if "<title>DC2.0 Decision 竞价研究</title>" not in root_html:
                      raise RuntimeError("public root does not contain the DC2.0 title")
                  if root_html != decision_html:
                      raise RuntimeError("public root and decision.html are not identical")
                  if revision.get("head_sha") != expected_head:
                      raise RuntimeError(
                          f"stale head_sha: {revision.get('head_sha')} != {expected_head}"
                      )
                  if str(revision.get("run_id")) != expected_run_id:
                      raise RuntimeError(
                          f"stale run_id: {revision.get('run_id')} != {expected_run_id}"
                      )
                  if revision.get("repository") != expected_repository:
                      raise RuntimeError("revision repository does not match this repository")
                  if revision.get("branch") != "main":
                      raise RuntimeError("revision branch is not main")
                  if revision.get("signal_date") != expected_signal_date:
                      raise RuntimeError("revision signal_date does not match the build")
                  if str(revision.get("report_date")) != expected_report_date:
                      raise RuntimeError(
                          "revision report_date does not match the built report index"
                      )
                  if str(revision.get("report_file")) != expected_report_file:
                      raise RuntimeError(
                          "revision report_file does not match the built report index"
                      )
                  if revision.get("freeze_active") is not expected_freeze_active:
                      raise RuntimeError("revision freeze_active does not match the build")
                  if revision.get("report_age_days") != expected_report_age_days:
                      raise RuntimeError("revision report_age_days does not match the build")
                  if revision.get("prospective") is not expected_prospective:
                      raise RuntimeError("revision prospective does not match the build")
                  if revision.get("freshness_state") != expected_freshness_state:
                      raise RuntimeError("revision freshness_state does not match the build")
                  if revision.get("stale") is not expected_stale:
                      raise RuntimeError("revision stale does not match the build")
                  if revision.get("stale_reason") != expected_stale_reason:
                      raise RuntimeError("revision stale_reason does not match the build")
                  if str(public_index.get("latest_report_date")) != expected_report_date:
                      raise RuntimeError(
                          "public report_index latest_report_date does not match revision.json"
                      )
                  if str(public_index.get("latest_report_file")) != expected_report_file:
                      raise RuntimeError(
                          "public report_index latest_report_file does not match revision.json"
                      )
                  if public_index.get("latest_action_report_date") != revision.get(
                      "latest_action_report_date"
                  ):
                      raise RuntimeError(
                          "public latest_action_report_date does not match revision.json"
                      )
                  if public_index.get("latest_action_url") != revision.get(
                      "latest_action_url"
                  ):
                      raise RuntimeError(
                          "public latest_action_url does not match revision.json"
                      )
                  public_latest_rows = [
                      row for row in public_index.get("reports", [])
                      if isinstance(row, dict)
                      and str(row.get("report_date")) == expected_report_date
                  ]
                  if len(public_latest_rows) != 1:
                      raise RuntimeError("public report_index has no unique latest row")
                  public_latest_row = public_latest_rows[0]
                  if (public_latest_row.get("research_available", False) is True) is not expected_research_available:
                      raise RuntimeError("public latest research availability does not match build")
                  if str(public_latest_row.get("research_url", "")) != expected_research_url:
                      raise RuntimeError("public latest research URL does not match build")
                  if revision.get("latest_research_available") is not expected_research_available:
                      raise RuntimeError("revision latest research availability does not match build")
                  if str(revision.get("latest_research_url", "")) != expected_research_url:
                      raise RuntimeError("revision latest research URL does not match build")
                  if (
                      revision.get('executable_profit_research_available')
                      is not expected_executable_profit_available
                      or str(revision.get('executable_profit_signal_date') or '')
                      != expected_executable_profit_signal_date
                      or str(
                          revision.get(
                              'executable_profit_statistics_as_of_date'
                          )
                          or ''
                      )
                      != expected_executable_profit_as_of_date
                      or str(revision.get('executable_profit_projection_url') or '')
                      != expected_executable_profit_projection_url
                      or str(revision.get('executable_profit_statistics_url') or '')
                      != expected_executable_profit_statistics_url
                  ):
                      raise RuntimeError(
                          'revision executable-profit public binding differs from build'
                      )
                  if (
                      expected_executable_profit_available
                      and public_executable_profit_index is None
                  ):
                      raise RuntimeError(
                          'revision claims executable-profit data without a public index'
                      )
                  if expected_research_available:
                      if not isinstance(public_research, dict):
                          raise RuntimeError("public latest research context is not an object")
                      research_schema = public_research.get("schema_version")
                      if public_research.get("research_only") is not True:
                          raise RuntimeError("public latest research context is not research-only")
                      if public_research.get("action_authorized") is not False:
                          raise RuntimeError("public latest research context authorizes action")
                      if str(public_research.get("report_date")) != expected_report_date:
                          raise RuntimeError("public latest research context report date is wrong")
                      if str(public_research.get("signal_date")) != expected_signal_date:
                          raise RuntimeError("public latest research context signal date is wrong")
                      if research_schema == "decision_research_context_v1_daily":
                          if public_research.get("formal_buy_count") != 0:
                              raise RuntimeError("public latest Daily research context has formal buys")
                          for collection in ("candidates", "stage_watchlist"):
                              rows = public_research.get(collection)
                              if not isinstance(rows, list) or any(
                                  not isinstance(row, dict)
                                  or row.get("action") != "WATCH"
                                  or float(row.get("target_weight") or 0) != 0.0
                                  or int(row.get("trade_selected") or 0) != 0
                                  or row.get("market_order_allowed") is not False
                                  for row in rows
                              ):
                                  raise RuntimeError(
                                      f"public latest Daily research context {collection} contains action claims"
                                  )
                      elif research_schema == "decision_research_context_v1_historical_parity":
                          if public_research.get("historical_parity") is not True:
                              raise RuntimeError("public historical parity marker is missing")
                          if public_research.get("runtime_network_dependency") is not False:
                              raise RuntimeError("public historical parity has a runtime dependency")
                          binding = public_research.get("source_binding")
                          if not isinstance(binding, dict):
                              raise RuntimeError("public historical parity source binding is missing")
                          payloads = public_research.get("payloads_base64")
                          artifact_bindings = binding.get("artifacts")
                          artifact_keys = {"action_plan", "decision_report", "evaluation"}
                          if (
                              not isinstance(payloads, dict)
                              or set(payloads) != artifact_keys
                              or not isinstance(artifact_bindings, dict)
                              or set(artifact_bindings) != artifact_keys
                          ):
                              raise RuntimeError("public historical parity artifact set is invalid")
                          decoded = {}
                          for artifact in sorted(artifact_keys):
                              artifact_binding = artifact_bindings[artifact]
                              if not isinstance(artifact_binding, dict):
                                  raise RuntimeError(f"public historical parity {artifact} binding is invalid")
                              try:
                                  raw = base64.b64decode(
                                      str(payloads.get(artifact) or "").encode("ascii"),
                                      validate=True,
                                  )
                              except Exception as exc:
                                  raise RuntimeError(
                                      f"public historical parity {artifact} payload is invalid base64"
                                  ) from exc
                              if hashlib.sha256(raw).hexdigest() != artifact_binding.get("raw_sha256"):
                                  raise RuntimeError(
                                      f"public historical parity {artifact} raw SHA256 mismatch"
                                  )
                              git_header = f"blob {len(raw)}\0".encode("ascii")
                              if hashlib.sha1(git_header + raw).hexdigest() != artifact_binding.get("blob_sha"):
                                  raise RuntimeError(
                                      f"public historical parity {artifact} Git blob SHA mismatch"
                                  )
                              decoded[artifact] = raw
                          legacy = json.loads(decoded["action_plan"].decode("utf-8"))
                          if str(legacy.get("report_date")) != expected_report_date:
                              raise RuntimeError("public historical parity payload report date is wrong")
                          if str(legacy.get("signal_date")) != expected_signal_date:
                              raise RuntimeError("public historical parity payload signal date is wrong")
                          if str(legacy.get("exec_date")) != expected_report_date:
                              raise RuntimeError("public historical parity payload exec date is wrong")
                          legacy_exit_date = str(legacy.get("exit_date") or "")
                          if not expected_signal_date < expected_report_date < legacy_exit_date:
                              raise RuntimeError("public historical parity payload date order is wrong")
                          legacy_report = decoded["decision_report"].decode("utf-8-sig")
                          legacy_report_lines = legacy_report.splitlines()
                          if legacy_report_lines[:1] != [f"# Decision Report ({expected_report_date})"]:
                              raise RuntimeError("public historical parity report heading is wrong")
                          for field, value in (
                              ("signal_date", expected_signal_date),
                              ("exec_date", expected_report_date),
                              ("exit_date", legacy_exit_date),
                          ):
                              if legacy_report_lines.count(f"- {field}: **{value}**") != 1:
                                  raise RuntimeError(
                                      f"public historical parity report {field} binding is wrong"
                                  )
                          legacy_evaluation = json.loads(decoded["evaluation"].decode("utf-8"))
                          for field, value in (
                              ("signal_date", expected_signal_date),
                              ("exec_date", expected_report_date),
                              ("exit_date", legacy_exit_date),
                          ):
                              if str(legacy_evaluation.get(field) or "") != value:
                                  raise RuntimeError(
                                      f"public historical parity evaluation {field} binding is wrong"
                                  )
                      else:
                          raise RuntimeError("public latest research context schema is invalid")
                  if revision.get("report_generated_at_utc") is not None:
                      raise RuntimeError(
                          "legacy report_generated_at_utc must remain null without report provenance"
                      )
                  if public_index.get("generated_at_utc") != revision.get(
                      "report_index_generated_at_utc"
                  ):
                      raise RuntimeError(
                          "public report index generated_at_utc does not match revision.json"
                      )
                  if public_index.get("inventory_projected") is not revision.get(
                      "report_index_inventory_projected"
                  ):
                      raise RuntimeError(
                          "public report index projection state does not match revision.json"
                      )
                  if public_index.get("source_latest_report_date") != revision.get(
                      "source_index_latest_report_date"
                  ):
                      raise RuntimeError(
                          "public source latest report date does not match revision.json"
                      )
                  if not isinstance(public_eval, dict):
                      raise RuntimeError("public latest eval is not an object")
                  if str(public_eval.get("signal_date")) != expected_signal_date:
                      raise RuntimeError(
                          "public latest eval signal_date does not match revision.json"
                      )
                  if str(public_eval.get("exec_date")) != expected_report_date:
                      raise RuntimeError(
                          "public latest eval exec_date does not match revision.json"
                      )
                  if not public_report.strip():
                      raise RuntimeError("public latest report is empty")
                  banner_id = 'id="dc20-truthfulness-banner"'
                  if expected_stale:
                      required_banner_fragments = (
                          banner_id,
                          "只读历史快照",
                          "禁止据此交易",
                          f'data-freeze-active="{str(expected_freeze_active).lower()}"',
                          f'data-report-age-days="{expected_report_age_days}"',
                          f'data-stale-reason="{expected_stale_reason}"',
                      )
                      if any(fragment not in root_html for fragment in required_banner_fragments):
                          raise RuntimeError("public stale banner does not match revision.json")
                  elif banner_id in root_html:
                      raise RuntimeError("fresh active page unexpectedly contains stale banner")

                  print(
                      json.dumps(
                          {
                              "status": "ok",
                              "page_url": base_url,
                              "head_sha": expected_head,
                              "run_id": expected_run_id,
                              "signal_date": expected_signal_date,
                              "report_date": expected_report_date,
                              "report_file": expected_report_file,
                              "freeze_active": expected_freeze_active,
                              "report_age_days": expected_report_age_days,
                              "prospective": expected_prospective,
                              "freshness_state": expected_freshness_state,
                              "stale": expected_stale,
                              "stale_reason": expected_stale_reason,
                          },
                          ensure_ascii=False,
                          sort_keys=True,
                      )
                  )
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"attempt {attempt}/12: {exc}")
                  if attempt < 12:
                      time.sleep(10)
          else:
              raise SystemExit(f"Pages verification failed: {last_error}")
          PY
