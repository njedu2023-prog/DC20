name: DC20 · 10:00 profit historical training (research only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/COLLECTION.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: dc20-profit-1000-history-training
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  research:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout exact research version without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked research runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Test new research contracts before credentials
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production model and source freeze remains intact
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py --root .
      - name: Read the two pinned historical raw-data artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 300 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/9987577487/zip \
            --output "${RUNNER_TEMP}/source.zip"
          curl --fail --silent --show-error --location --max-time 300 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/9987956113/zip \
            --output "${RUNNER_TEMP}/tail.zip"
      - name: Verify full archives and create isolated research mirror
        run: >-
          python work/profit_1000_upgrade/run.py
          --output "${RUNNER_TEMP}/dc20-profit-1000-history"
          --source-zip "${RUNNER_TEMP}/source.zip"
          --tail-zip "${RUNNER_TEMP}/tail.zip"
      - name: Collect exact missing evidence within fixed budget
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python work/profit_1000_upgrade/collect.py
          --root "${RUNNER_TEMP}/dc20-profit-1000-history"
          --report "${RUNNER_TEMP}/dc20-profit-1000-history/collection_receipt.json"
      - name: Replay new labels and train only after data gates pass
        if: ${{ !cancelled() }}
        run: >-
          python work/profit_1000_upgrade/run.py
          --evaluate-root "${RUNNER_TEMP}/dc20-profit-1000-history"
      - name: Verify no production source, model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Save research results and data provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc20-profit-1000-history-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-profit-1000-history
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          compression-level: 6
