name: DC20 · per-stock auction v3 qualification (offline only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/auction_truth_v3.py"
      - "work/profit_1000_upgrade/test_auction_truth_v3.py"
      - "work/profit_1000_upgrade/auction_v3_report.py"
      - "work/profit_1000_upgrade/test_auction_v3_report.py"
      - ".github/workflows/research_profit_auction_v3_check.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dc20-auction-v3-offline-qualification
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  qualification:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact version without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test all isolated upgrade contracts
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production freeze is intact
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py --root .
      - name: Read two exact retained artifacts without market-data credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 180 --max-filesize 30000000 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/10292829634/zip \
            --output "${RUNNER_TEMP}/history-v2.zip"
          curl --fail --silent --show-error --location --max-time 180 --max-filesize 500000 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/10293161278/zip \
            --output "${RUNNER_TEMP}/two-date-diagnostic.zip"
      - name: Verify both ZIP digests and compare every frozen candidate on the two dates
        run: |
          set -euo pipefail
          python work/profit_1000_upgrade/auction_v3_report.py \
            --v2-archive "${RUNNER_TEMP}/history-v2.zip" \
            --diagnostic-archive "${RUNNER_TEMP}/two-date-diagnostic.zip" \
            > "${RUNNER_TEMP}/auction-v3-comparison.json"
      - name: Verify no production source model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain comparison only and no source migration or labels
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc20-auction-v3-comparison-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/auction-v3-comparison.json
          if-no-files-found: error
          retention-days: 30
