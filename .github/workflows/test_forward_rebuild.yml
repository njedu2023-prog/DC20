name: DC20 · Forward rebuild acceptance (read only)

on:
  push:
    branches: [main]
    paths:
      - 'forward/**'
      - '.github/workflows/test_forward_rebuild.yml'
      - '.github/workflows/accept_forward_inputs.yml'
  pull_request:
    paths:
      - 'forward/**'
      - '.github/workflows/test_forward_rebuild.yml'
      - '.github/workflows/accept_forward_inputs.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  LOKY_MAX_CPU_COUNT: '1'

jobs:
  migration-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify repository text normalization
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          violations="$(git ls-files --eol | awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/')"
          if [[ -n "$violations" ]]; then
            printf '%s\n' "$violations"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install existing locked test environment
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: New forward contracts and regressions
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python -m pytest forward/tests -q
          node --check forward/web/app.js
          node forward/tests/test_web.cjs
      - name: Historical replay stays outside new forward ledger
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python -m forward.cli --root . preview --signal-date 20260908 --revision "$SOURCE_REVISION" --output "$RUNNER_TEMP/dc20-forward-preview"
          python -c 'import json, os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"dc20-forward-preview"/"ledger.json"; v=json.loads(p.read_text()); assert not v["days"] and v["activated_at_utc"] is None'

  promotion-inference:
    # Intentionally no `needs`: profit, truth and aggregate tests cannot prevent
    # the isolated P0 inference artifact from being produced and retained.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      receipt_sha256: ${{ steps.infer.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install frozen inference environment
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Collect a fixed immutable upstream bundle outside the repository
        id: collect
        run: |
          python -m forward.bundle_rehearsal --root . collect --signal-date 20260908 --pred-commit 1615abe7600d518dd04fcbbf5b159aad8ce95bf7 --market-commit ff7a16b1d37b7f6befca5e4180ade7051fcd1df1 --output "$RUNNER_TEMP/forward-input-bundle"
      - name: Independently recompute promotion from the accepted bundle
        id: infer
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          INPUT_MANIFEST_SHA256: ${{ steps.collect.outputs.manifest_sha256 }}
        run: |
          python -m forward.bundle_rehearsal --root . promotion --bundle "$RUNNER_TEMP/forward-input-bundle" --manifest-sha256 "$INPUT_MANIFEST_SHA256" --output "$RUNNER_TEMP/forward-primary"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Preserve promotion before any profit work
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forward-promotion-rehearsal
          path: ${{ runner.temp }}/forward-primary/*.json
          if-no-files-found: error
          retention-days: 14

  profit-inference:
    needs: [promotion-inference]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      receipt_sha256: ${{ steps.infer.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install frozen inference environment
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: forward-promotion-rehearsal
          path: ${{ runner.temp }}/forward-primary
      - name: Append independently recomputed profit research
        id: infer
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PRIMARY_RECEIPT_SHA256: ${{ needs.promotion-inference.outputs.receipt_sha256 }}
        run: |
          python -m forward.bundle_rehearsal --root . profit --primary "$RUNNER_TEMP/forward-primary" --primary-receipt-sha256 "$PRIMARY_RECEIPT_SHA256" --output "$RUNNER_TEMP/forward-profit"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forward-profit-rehearsal
          path: ${{ runner.temp }}/forward-profit/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare completed recomputation against frozen historical evidence
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python -m forward.rehearsal --root . compare --primary "$RUNNER_TEMP/forward-primary" --profit "$RUNNER_TEMP/forward-profit"

  promotion-release-candidate:
    # Preparation only; independent of P1 and the aggregate migration tests.
    needs: [promotion-inference]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: forward-promotion-rehearsal
          path: ${{ runner.temp }}/forward-primary
      - name: Prepare promotion and Top3 release candidate only
        env:
          PRIMARY_RECEIPT_SHA256: ${{ needs.promotion-inference.outputs.receipt_sha256 }}
        run: |
          python -m forward.release_candidate --root . promotion --primary "$RUNNER_TEMP/forward-primary" --primary-receipt-sha256 "$PRIMARY_RECEIPT_SHA256" --output "$RUNNER_TEMP/forward-promotion-release-candidate"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forward-promotion-release-candidate
          path: ${{ runner.temp }}/forward-promotion-release-candidate/
          if-no-files-found: error
          retention-days: 14

  profit-release-candidate:
    needs: [promotion-inference, profit-inference]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: forward-promotion-rehearsal
          path: ${{ runner.temp }}/forward-primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: forward-profit-rehearsal
          path: ${{ runner.temp }}/forward-profit
      - name: Prepare profit and Top2 candidate without recording a ledger
        env:
          PRIMARY_RECEIPT_SHA256: ${{ needs.promotion-inference.outputs.receipt_sha256 }}
          PROFIT_RECEIPT_SHA256: ${{ needs.profit-inference.outputs.receipt_sha256 }}
        run: |
          python -m forward.release_candidate --root . profit --primary "$RUNNER_TEMP/forward-primary" --primary-receipt-sha256 "$PRIMARY_RECEIPT_SHA256" --profit "$RUNNER_TEMP/forward-profit" --profit-receipt-sha256 "$PROFIT_RECEIPT_SHA256" --output "$RUNNER_TEMP/forward-profit-release-candidate"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forward-profit-release-candidate
          path: ${{ runner.temp }}/forward-profit-release-candidate/
          if-no-files-found: error
          retention-days: 14
