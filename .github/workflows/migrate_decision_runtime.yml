name: DC2.0 · Migrate Decision Canonical Runtime

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build locally without artifact upload or publication
        required: true
        type: boolean
        default: true
      signal_date:
        description: Optional exact latest-action signal date (YYYYMMDD)
        required: false
        type: string
        default: ""
      expected_base_sha:
        description: Optional exact 40-character main SHA operator pin
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Isolated frozen replay and exact-path validation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      has_changes: ${{ steps.candidate.outputs.has_changes }}
      report_date: ${{ steps.candidate.outputs.report_date }}
    steps:
      # Full working-tree materialization is a migration precondition: the
      # frozen replay reads current and prior-session raw files. Never use a
      # sparse checkout here; the wrapper also rejects sparse/skip-worktree.
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve explicit mode
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "${INPUT_DRY_RUN}" in
            true) echo 'publish=false' >> "${GITHUB_OUTPUT}" ;;
            false) echo 'publish=true' >> "${GITHUB_OUTPUT}" ;;
            *) echo 'dry_run must be a native boolean' >&2; exit 2 ;;
          esac

      - name: Bind checkout to exact main base
        id: base
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse --verify HEAD^{commit})" = "${base_sha}"
          if ! [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'checkout HEAD is not a full lowercase SHA' >&2
            exit 2
          fi
          if [ -n "${EXPECTED_BASE_SHA}" ]; then
            if ! [[ "${EXPECTED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'expected_base_sha is not a full lowercase SHA' >&2
              exit 2
            fi
            test "${base_sha}" = "${EXPECTED_BASE_SHA}"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Require remote main still equals checkout base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            if (ref.data.object.type !== 'commit' || ref.data.object.sha !== process.env.BASE_SHA) {
              core.setFailed(`remote main moved before compute: ${ref.data.object.sha}`);
            }

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check

      - name: Replay frozen runtime in detached exact-base worktree
        id: candidate
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          INPUT_SIGNAL_DATE: ${{ inputs.signal_date }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          migration_root="${RUNNER_TEMP}/decision-runtime-migration-worktree"
          candidate_root="${RUNNER_TEMP}/decision-runtime-candidate"
          test ! -e "${migration_root}"
          test ! -e "${candidate_root}"
          git worktree add --detach "${migration_root}" "${BASE_SHA}"
          test "$(git -C "${migration_root}" rev-parse HEAD)" = "${BASE_SHA}"
          test -z "$(git -C "${migration_root}" status --porcelain=v1 --untracked-files=all)"
          mode=dry_run
          if [ "${PUBLISH}" = "true" ]; then mode=publish_candidate; fi
          args=(
            build
            --root "${migration_root}"
            --base-sha "${BASE_SHA}"
            --output-root "${candidate_root}"
            --mode "${mode}"
          )
          if [ -n "${INPUT_SIGNAL_DATE}" ]; then
            args+=(--signal-date "${INPUT_SIGNAL_DATE}")
          fi
          python "${migration_root}/scripts/migrate_decision_runtime.py" "${args[@]}"
          python "${migration_root}/scripts/migrate_decision_runtime.py" verify \
            --candidate-root "${candidate_root}" \
            --base-sha "${BASE_SHA}" \
            --root "${GITHUB_WORKSPACE}"
          CANDIDATE_ROOT="${candidate_root}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(
              (Path(os.environ['CANDIDATE_ROOT']) / 'migration-receipt.json').read_text(encoding='utf-8')
          )
          changed = receipt['changed_paths']
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"has_changes={'true' if changed else 'false'}\n")
              handle.write(f"report_date={receipt['report_date']}\n")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('### Canonical runtime migration candidate\n\n')
              handle.write(f"- mode: `{receipt['mode']}`\n")
              handle.write(f"- base: `{receipt['base_sha']}`\n")
              handle.write(f"- signal/report: `{receipt['signal_date']}` / `{receipt['report_date']}`\n")
              handle.write('- timing: `RETROSPECTIVE`\n')
              handle.write(f"- changed paths: `{len(changed)}`\n")
              handle.write(f"- restored replay side effects: `{len(receipt['restored_paths'])}`\n")
          PY
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Require remote main unchanged at compute completion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            if (ref.data.object.type !== 'commit' || ref.data.object.sha !== process.env.BASE_SHA) {
              throw new Error(`remote main moved during compute: ${ref.data.object.sha}`);
            }

      - name: Upload immutable migration candidate only for real publication
        if: ${{ steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: decision-runtime-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decision-runtime-candidate
          if-no-files-found: error
          retention-days: 1

  publish:
    name: GitHub API exact-base CAS single commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the receipt base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.compute.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download validated migration bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: decision-runtime-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decision-runtime-candidate

      # The publisher independently re-runs the exact-observation verifier.
      # Jobs do not share Python environments, so use the same interpreter and
      # hash-locked dependencies as compute before any publication is possible.
      - name: Setup Python for independent envelope verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies for independent envelope verification
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check

      - name: Reverify strict envelope from exact base
        env:
          BASE_SHA: ${{ needs.compute.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/migrate_decision_runtime.py verify \
            --candidate-root "${RUNNER_TEMP}/decision-runtime-candidate" \
            --base-sha "${BASE_SHA}" \
            --root "${GITHUB_WORKSPACE}"

      - name: Publish one retrospective migration commit by GitHub API CAS
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BASE_SHA: ${{ needs.compute.outputs.base_sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/decision-runtime-candidate
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const root = process.env.CANDIDATE_ROOT;
            const receipt = JSON.parse(fs.readFileSync(path.join(root, 'migration-receipt.json'), 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseSha = process.env.BASE_SHA;
            const exactKeys = (value, expected, label) => {
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                throw new Error(`${label} must be an object`);
              }
              const actual = Object.keys(value).sort();
              const wanted = [...expected].sort();
              if (actual.length !== wanted.length || actual.some((key, index) => key !== wanted[index])) {
                throw new Error(`${label} keys are not exact`);
              }
            };
            exactKeys(receipt, [
              'schema_version', 'allowlist_version', 'status', 'mode', 'base_sha',
              'base_tree_sha', 'signal_date', 'report_date', 'exec_date', 'exit_date',
              'timing', 'live_delivery_met', 'execution_or_fill_claimed',
              'replay_source', 'replay_status', 'replay_report_sha256',
              'replay_numeric_runtime', 'action_rebuild_stability',
              'freeze_active', 'forced_inactive', 'pins_enforced',
              'validators_passed', 'post_prune_validators_passed', 'validator_summary',
              'changed_paths', 'restored_paths', 'output_sha256', 'output_size',
              'base_blob_sha1', 'source_evidence', 'truth_reference_evidence',
              'truth_binding_summary'
            ], 'migration receipt V2');
            if (receipt.mode !== 'publish_candidate') {
              throw new Error(`publisher rejects receipt mode: ${receipt.mode}`);
            }
            if (receipt.schema_version !== 'decision_runtime_migration_receipt_v2') {
              throw new Error('publisher requires migration receipt V2');
            }
            if (receipt.base_sha !== baseSha || receipt.timing !== 'RETROSPECTIVE') {
              throw new Error('receipt base/timing mismatch');
            }
            if (receipt.live_delivery_met !== false || receipt.execution_or_fill_claimed !== false) {
              throw new Error('receipt contains a live delivery or execution/fill claim');
            }
            const runtime = receipt.replay_numeric_runtime;
            exactKeys(runtime, [
              'schema_version', 'host_contract', 'launcher_sha256',
              'numpy_cpu_dispatch_cap', 'numpy_x86_v4_disabled',
              'openblas_coretype', 'target', 'target_sha256', 'threadpools'
            ], 'numeric runtime');
            if (runtime.schema_version !== 'dc20_deterministic_numeric_runtime_v1' ||
                runtime.host_contract !== 'github_ubuntu_24_04_x86_64' ||
                runtime.numpy_cpu_dispatch_cap !== 'X86_V3' ||
                runtime.numpy_x86_v4_disabled !== true ||
                runtime.openblas_coretype !== 'Haswell' ||
                runtime.target !== 'replay_frozen_canonical_v2.py') {
              throw new Error('numeric runtime contract is invalid');
            }
            if (!Array.isArray(runtime.threadpools) || runtime.threadpools.length < 2) {
              throw new Error('numeric runtime threadpools are missing');
            }
            const runtimeApis = new Set();
            const runtimePoolRecords = new Set();
            for (const [index, pool] of runtime.threadpools.entries()) {
              exactKeys(pool, [
                'architecture', 'internal_api', 'num_threads', 'prefix', 'version'
              ], `numeric threadpool ${index}`);
              if (!['openblas', 'openmp'].includes(pool.internal_api) ||
                  !Number.isInteger(pool.num_threads) || pool.num_threads !== 1) {
                throw new Error(`numeric threadpool ${index} is not allowlisted single-threaded`);
              }
              if ((pool.internal_api === 'openblas' && pool.architecture !== 'Haswell') ||
                  (pool.internal_api === 'openmp' && pool.architecture !== null)) {
                throw new Error(`numeric threadpool ${index} architecture is invalid`);
              }
              for (const field of ['prefix', 'version']) {
                const value = pool[field];
                if (value !== null &&
                    (typeof value !== 'string' || value.length === 0 || value.trim() !== value)) {
                  throw new Error(`numeric threadpool ${index} ${field} is invalid`);
                }
              }
              const canonical = JSON.stringify(Object.fromEntries(
                Object.entries(pool).sort(([left], [right]) => left.localeCompare(right))
              ));
              if (runtimePoolRecords.has(canonical)) {
                throw new Error('numeric runtime threadpool record is duplicated');
              }
              runtimePoolRecords.add(canonical);
              runtimeApis.add(pool.internal_api);
            }
            if (runtimeApis.size !== 2 || !runtimeApis.has('openblas') || !runtimeApis.has('openmp')) {
              throw new Error('numeric runtime API set is not exact');
            }
            const nullableText = value => value === null ? 'None' : String(value);
            const sortedPools = [...runtime.threadpools].sort((left, right) => {
              const leftKey = [left.internal_api, nullableText(left.prefix), nullableText(left.version)];
              const rightKey = [right.internal_api, nullableText(right.prefix), nullableText(right.version)];
              const leftText = leftKey.join('\0');
              const rightText = rightKey.join('\0');
              return leftText < rightText ? -1 : (leftText > rightText ? 1 : 0);
            });
            if (runtime.threadpools.some((pool, index) => pool !== sortedPools[index])) {
              throw new Error('numeric runtime threadpool order is not canonical');
            }
            const launcherPath = 'scripts/run_deterministic_numeric.py';
            const replayPath = 'scripts/replay_frozen_canonical_v2.py';
            const launcherEvidence = receipt.source_evidence?.[launcherPath];
            const replayEvidence = receipt.source_evidence?.[replayPath];
            exactKeys(launcherEvidence, ['git_blob_sha1', 'sha256', 'size'], 'launcher source evidence');
            exactKeys(replayEvidence, ['git_blob_sha1', 'sha256', 'size'], 'replay source evidence');
            const sha256Pattern = /^[0-9a-f]{64}$/;
            if (!launcherEvidence || !replayEvidence ||
                !sha256Pattern.test(runtime.launcher_sha256) ||
                !sha256Pattern.test(runtime.target_sha256) ||
                !Number.isInteger(launcherEvidence.size) || launcherEvidence.size <= 0 ||
                !Number.isInteger(replayEvidence.size) || replayEvidence.size <= 0 ||
                runtime.launcher_sha256 !== launcherEvidence.sha256 ||
                runtime.target_sha256 !== replayEvidence.sha256) {
              throw new Error('numeric runtime hashes are not bound to source evidence');
            }
            const rebuild = receipt.action_rebuild_stability;
            exactKeys(rebuild, [
              'schema_version', 'projection', 'replay_sha256', 'final_sha256',
              'matched', 'candidate_rows', 'stage_watch_rows'
            ], 'action rebuild stability');
            if (rebuild.schema_version !== 'decision_action_rebuild_stability_v2' ||
                rebuild.projection !== 'raw_action_excluding_generation_and_exact_base_observation_truth' ||
                rebuild.matched !== true ||
                !sha256Pattern.test(rebuild.replay_sha256) ||
                rebuild.replay_sha256 !== rebuild.final_sha256 ||
                !Number.isInteger(rebuild.candidate_rows) || rebuild.candidate_rows < 0 ||
                !Number.isInteger(rebuild.stage_watch_rows) || rebuild.stage_watch_rows < 0) {
              throw new Error('action rebuild stability evidence is invalid');
            }
            const changed = receipt.changed_paths;
            if (!Array.isArray(changed) || changed.length === 0) {
              throw new Error('publisher requires a nonempty changed path set');
            }
            if (changed.some(relative => typeof relative !== 'string') ||
                changed.some((relative, index) => relative !== [...new Set(changed)].sort()[index])) {
              throw new Error('publisher requires sorted unique changed paths');
            }

            async function readMain() {
              const value = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
              if (value.data.object.type !== 'commit') throw new Error('main is not a commit ref');
              return value.data.object.sha;
            }
            const firstMain = await readMain();
            if (firstMain !== baseSha) throw new Error(`main/base mismatch before publish: ${firstMain}`);

            const baseCommit = await github.rest.git.getCommit({owner, repo, commit_sha: baseSha});
            if (baseCommit.data.sha !== baseSha || baseCommit.data.tree.sha !== receipt.base_tree_sha) {
              throw new Error('remote base commit/tree differs from receipt');
            }
            const baseTreeResponse = await github.rest.git.getTree({
              owner, repo, tree_sha: receipt.base_tree_sha, recursive: '1'
            });
            if (baseTreeResponse.data.truncated) throw new Error('remote base tree is truncated');
            const baseEntries = new Map(baseTreeResponse.data.tree.map(entry => [entry.path, entry]));

            for (const [sourcePath, evidence] of Object.entries(receipt.source_evidence)) {
              const entry = baseEntries.get(sourcePath);
              if (!entry || entry.type !== 'blob' || entry.mode !== '100644' || entry.sha !== evidence.git_blob_sha1) {
                throw new Error(`exact-base source blob mismatch: ${sourcePath}`);
              }
            }
            async function verifyNumericSourceBytes(sourcePath, evidence, expectedSha256) {
              const entry = baseEntries.get(sourcePath);
              const blob = await github.rest.git.getBlob({owner, repo, file_sha: entry.sha});
              if (blob.data.sha !== entry.sha || blob.data.encoding !== 'base64') {
                throw new Error(`numeric source blob response mismatch: ${sourcePath}`);
              }
              const bytes = Buffer.from(blob.data.content.replace(/\s/g, ''), 'base64');
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (bytes.length !== evidence.size || digest !== evidence.sha256 || digest !== expectedSha256) {
                throw new Error(`numeric source byte evidence mismatch: ${sourcePath}`);
              }
            }
            await verifyNumericSourceBytes(launcherPath, launcherEvidence, runtime.launcher_sha256);
            await verifyNumericSourceBytes(replayPath, replayEvidence, runtime.target_sha256);
            for (const relative of changed) {
              const entry = baseEntries.get(relative);
              const claimed = receipt.base_blob_sha1[relative];
              if (claimed === null) {
                if (entry !== undefined) throw new Error(`receipt falsely claims absent base path: ${relative}`);
              } else if (!entry || entry.type !== 'blob' || entry.mode !== '100644' || entry.sha !== claimed) {
                throw new Error(`candidate base blob mismatch: ${relative}`);
              }
            }

            exactKeys(receipt.output_sha256, changed, 'candidate SHA256 inventory');
            exactKeys(receipt.output_size, changed, 'candidate size inventory');
            exactKeys(receipt.base_blob_sha1, changed, 'candidate base blob inventory');
            const candidateFilesRoot = fs.realpathSync(path.join(root, 'files'));
            const prepared = [];
            for (const relative of changed) {
              const parts = relative.split('/');
              if (relative.includes('\\') || relative.includes('\0') ||
                  path.posix.isAbsolute(relative) ||
                  parts.some(part => part === '' || part === '.' || part === '..') ||
                  parts.join('/') !== relative) {
                throw new Error(`candidate path is not safe: ${relative}`);
              }
              const candidatePath = path.join(root, 'files', ...parts);
              const stat = fs.lstatSync(candidatePath);
              if (!stat.isFile() || stat.isSymbolicLink()) {
                throw new Error(`candidate path is not a regular file: ${relative}`);
              }
              const realCandidate = fs.realpathSync(candidatePath);
              if (realCandidate !== path.resolve(candidatePath) ||
                  !realCandidate.startsWith(`${candidateFilesRoot}${path.sep}`)) {
                throw new Error(`candidate path escapes candidate root: ${relative}`);
              }
              const bytes = fs.readFileSync(candidatePath);
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (!sha256Pattern.test(receipt.output_sha256[relative]) ||
                  !Number.isInteger(receipt.output_size[relative]) ||
                  receipt.output_size[relative] <= 0 ||
                  digest !== receipt.output_sha256[relative] ||
                  bytes.length !== receipt.output_size[relative]) {
                throw new Error(`candidate byte inventory mismatch: ${relative}`);
              }
              const localBlob = crypto.createHash('sha1')
                .update(Buffer.from(`blob ${bytes.length}\0`, 'utf8'))
                .update(bytes)
                .digest('hex');
              prepared.push({relative, bytes, localBlob});
            }

            const treeItems = [];
            for (const {relative, bytes, localBlob} of prepared) {
              const created = await github.rest.git.createBlob({
                owner, repo, content: bytes.toString('base64'), encoding: 'base64'
              });
              if (created.data.sha !== localBlob) throw new Error(`created blob mismatch: ${relative}`);
              treeItems.push({path: relative, mode: '100644', type: 'blob', sha: created.data.sha});
            }
            const createdTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: receipt.base_tree_sha,
              tree: treeItems
            });
            const createdCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `migrate(decision): retrospective canonical runtime ${receipt.report_date}`,
              tree: createdTree.data.sha,
              parents: [baseSha]
            });
            if (!Array.isArray(createdCommit.data.parents) ||
                createdCommit.data.parents.length !== 1 ||
                createdCommit.data.parents[0].sha !== baseSha) {
              throw new Error('created commit does not have exact base as sole parent');
            }

            const secondMain = await readMain();
            if (secondMain !== baseSha) throw new Error(`main moved before CAS: ${secondMain}`);
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/main', sha: createdCommit.data.sha, force: false
            });
            const finalMain = await readMain();
            if (finalMain !== createdCommit.data.sha) throw new Error('main did not reach created commit');
            const finalCommit = await github.rest.git.getCommit({
              owner, repo, commit_sha: createdCommit.data.sha
            });
            if (finalCommit.data.tree.sha !== createdTree.data.sha ||
                finalCommit.data.parents.length !== 1 ||
                finalCommit.data.parents[0].sha !== baseSha) {
              throw new Error('published commit parent/tree postcondition failed');
            }
            const finalTreeResponse = await github.rest.git.getTree({
              owner, repo, tree_sha: createdTree.data.sha, recursive: '1'
            });
            if (finalTreeResponse.data.truncated) throw new Error('published tree is truncated');
            const finalEntries = new Map(finalTreeResponse.data.tree.map(entry => [entry.path, entry]));
            const expectedPaths = new Set([...baseEntries.keys(), ...changed]);
            if (finalEntries.size !== expectedPaths.size ||
                [...expectedPaths].some(relative => !finalEntries.has(relative))) {
              throw new Error('published tree path set is not base plus exact candidate paths');
            }
            const changedSet = new Set(changed);
            for (const [relative, baseEntry] of baseEntries) {
              if (changedSet.has(relative)) continue;
              const finalEntry = finalEntries.get(relative);
              const isChangedAncestor = baseEntry.type === 'tree' &&
                changed.some(candidate => candidate.startsWith(`${relative}/`));
              if (!finalEntry || finalEntry.mode !== baseEntry.mode ||
                  finalEntry.type !== baseEntry.type ||
                  (!isChangedAncestor && finalEntry.sha !== baseEntry.sha)) {
                throw new Error(`unrelated base tree entry changed: ${relative}`);
              }
            }
            core.summary
              .addHeading('Published retrospective canonical runtime migration', 3)
              .addRaw(`Commit: \`${createdCommit.data.sha}\`\n\n`)
              .addRaw(`Base: \`${baseSha}\`\n\n`)
              .addRaw(`Report: \`${receipt.report_date}\` (RETROSPECTIVE)\n\n`)
              .addRaw(`Paths: \`${changed.length}\`\n`);
            await core.summary.write();
            core.setOutput('published_head', createdCommit.data.sha);

  deploy-pages:
    name: Deploy exact published migration revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
