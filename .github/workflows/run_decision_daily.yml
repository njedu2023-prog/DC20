          set -euo pipefail
          args=(--calendar-only)
          if [ -n "${TRADE_DATE}" ]; then args+=(--trade-date "${TRADE_DATE}"); fi
          session_evidence="${RUNNER_TEMP}/daily-session-sync.json"
          python scripts/sync_tushare_minute.py "${args[@]}" > "${session_evidence}"
          SESSION_EVIDENCE="${session_evidence}" python - <<'PY'
          import json, os, re
          from datetime import datetime
          from pathlib import Path
          payload = json.loads(Path(os.environ['SESSION_EVIDENCE']).read_text(encoding='utf-8'))
          if not isinstance(payload, dict): raise SystemExit('Daily session evidence must be one JSON object')
          trade_date = payload.get('trade_date')
          if type(trade_date) is not str or re.fullmatch(r'\d{8}', trade_date) is None:
              raise SystemExit('Daily session evidence trade_date must be exactly 8 digits')
          try:
              parsed_trade_date = datetime.strptime(trade_date, '%Y%m%d').strftime('%Y%m%d')
          except ValueError as exc:
              raise SystemExit('Daily session evidence trade_date is not a valid calendar date') from exc
          if parsed_trade_date != trade_date:
              raise SystemExit('Daily session evidence trade_date is not canonical YYYYMMDD')
          requested_trade_date = os.environ.get('TRADE_DATE', '')
          if requested_trade_date and requested_trade_date != trade_date:
              raise SystemExit('Daily session evidence trade_date differs from requested trade_date')
          status, reason, active = payload.get('status'), payload.get('reason'), payload.get('active_window')
          if type(active) is not bool: raise SystemExit('Daily active_window must be a JSON boolean')
          no_write_reasons = {'exchange_closed', 'outside_active_minute_window'}
          if status == 'not_applicable' and reason in no_write_reasons:
              eligible = False
          elif status == 'success' and reason == 'calendar_synced':
              eligible = True
          else:
              raise SystemExit(f'unexpected Daily session evidence: status={status!r} reason={reason!r}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"write_eligible={'true' if eligible else 'false'}\n")
              output.write(f"target_trade_date={trade_date}\n")
