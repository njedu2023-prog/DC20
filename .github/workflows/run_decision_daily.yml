              sha=str(payload.get('sha') or '').strip().lower()
              if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
                  raise SystemExit(f'failed to resolve immutable commit for {owner}/{repo}@main')
              output.append(f'{key}={sha}')
