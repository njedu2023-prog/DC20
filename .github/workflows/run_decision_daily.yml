          runtime_evidence = Path(
              f'data/decision/legacy_profit_relative/runtime_features_{signal_date}.csv'
          )
          immutable_relatives = (
              runtime_evidence,
              projection_json,
              projection_csv,
          )
          mutable_relatives = (public_index,)
          exact_relatives = immutable_relatives + mutable_relatives

          def safe_source(relative: Path) -> Path:
              if relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit(f'Legacy-profit source path is unsafe: {relative}')
              current = source_root
              for part in relative.parts:
                  current = current / part
                  if current.is_symlink():
                      raise SystemExit(
                          f'Legacy-profit source has a symlink ancestor: {relative}'
                      )
              if not current.is_file() or current.resolve(strict=True) != current:
                  raise SystemExit(f'Legacy-profit source is missing/escaped: {relative}')
              return current

          def target_path(relative: Path) -> Path:
              current = target_root
              for part in relative.parent.parts:
                  current = current / part
                  if current.exists():
                      if not current.is_dir() or current.is_symlink():
                          raise SystemExit(
                              f'Legacy-profit target ancestor is unsafe: {relative}'
                          )
                  else:
                      current.mkdir()
              path = target_root / relative
              if path.exists() and (not path.is_file() or path.is_symlink()):
                  raise SystemExit(f'Legacy-profit target is unsafe: {relative}')
              return path

          def install_immutable(relative: Path) -> None:
              payload = safe_source(relative).read_bytes()
              target = target_path(relative)
              if target.exists():
                  if target.read_bytes() != payload:
                      raise SystemExit(
                          f'Legacy-profit immutable conflict: {relative}'
                      )
                  return
              with tempfile.NamedTemporaryFile(
                  'wb', dir=target.parent, prefix=f'.{target.name}.', delete=False
              ) as handle:
                  temporary = Path(handle.name)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              try:
                  os.link(temporary, target)
              except FileExistsError:
                  if target.read_bytes() != payload:
                      raise SystemExit(
                          f'Legacy-profit immutable copy raced: {relative}'
                      )
              finally:
                  temporary.unlink(missing_ok=True)

          def replace_pointer(relative: Path) -> None:
              payload = safe_source(relative).read_bytes()
              target = target_path(relative)
              with tempfile.NamedTemporaryFile(
                  'wb', dir=target.parent, prefix=f'.{target.name}.', delete=False
              ) as handle:
                  temporary = Path(handle.name)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              try:
                  os.replace(temporary, target)
              finally:
                  temporary.unlink(missing_ok=True)

          for relative in immutable_relatives:
              install_immutable(relative)
          for relative in mutable_relatives:
              replace_pointer(relative)

          public_evidence = validate_repository_chain(target_root)
          if (
              public_evidence.get('signal_date') != signal_date
              or public_evidence.get('public_static_chain_match') is not True
              or public_evidence.get('deterministic_rebuild_match') is not True
          ):
              raise SystemExit('Copied legacy-profit public chain is invalid')
          private_target = target_root / '.dc20-private'
          if private_target.exists():
              raise SystemExit('Private legacy-profit runtime pool escaped isolation')
          action = target_root / 'outputs/decision/action_plan_latest.json'
          action_digest = hashlib.sha256(action.read_bytes()).hexdigest() if action.is_file() else ''
          if not hmac.compare_digest(
              action_digest,
              os.environ['PRESERVED_ACTION_SHA256'],
          ):
              raise SystemExit('Legacy-profit sidecar modified preserved Action')
          print(json.dumps({
              'status': 'LEGACY_PROFIT_RELATIVE_SIDECAR_COPIED',
              'signal_date': signal_date,
              'copied_paths': [value.as_posix() for value in exact_relatives],
              'private_runtime_copied': False,
              'actual_execution_claimed': False,
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Build exact allowlisted Daily candidate patch
        id: candidate
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- data/pred
          git add -A -- data/market
          git add -A -- docs
          git add -A -- outputs/decision data/decision
          git add -A -- data/decision_executable_profit/forward/selections data/decision_executable_profit/forward/statistics/summary.json
          git reset -q HEAD -- ':(glob)outputs/decision/action_plan_*.json' 'outputs/decision/report_index.json'
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/staged_index.bin"
          STAGED_PATHS="${RUNNER_TEMP}/staged_paths.bin" STAGED_INDEX="${RUNNER_TEMP}/staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/pred/pred_source_latest.csv','data/pred/_pred_source_meta.json','data/pred/archive/**','data/pred/pred_top10_*.csv','data/market/raw/**','data/market/trade_cal_sse.csv','data/market/features_base_*.csv','data/market/features_limit_*.csv','data/market/truth_close_*.csv','data/market/_meta_*.json','docs/weights/**','docs/signals/**','outputs/decision/decision_report_20??????.md','outputs/decision/eval_20??????.json','outputs/decision/forward_observation_protocol_v12.json','outputs/decision/research_context_20??????.json','outputs/decision/research_context_dc20_20??????.json','outputs/decision/three_rank_top10_20??????.json','outputs/decision/three_rank_top10_20??????.csv','outputs/decision/three_rank_index.json','outputs/decision/executable_profit_research/projection_20??????.json','outputs/decision/executable_profit_research/projection_20??????.csv','outputs/decision/executable_profit_research/shadow_statistics_20??????_asof_20??????.json','outputs/decision/executable_profit_research/index.json','outputs/decision/legacy_profit_relative_research/projection_20??????.json','outputs/decision/legacy_profit_relative_research/projection_20??????.csv','outputs/decision/legacy_profit_relative_research/index.json','data/decision_executable_profit/forward/selections/shadow_20??????.json','data/decision_executable_profit/forward/selections/shadow_20??????.csv','data/decision_executable_profit/forward/selections/index.json','data/decision_executable_profit/forward/statistics/summary.json','data/decision/**','docs/reports/*.md')
          forbidden=('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or any(matches(p,a) for a in forbidden)]
          if bad: raise SystemExit(f'non-allowlisted Daily paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Daily index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Daily paths staged: {bad_modes}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/candidate.patch"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path(os.environ['CANDIDATE_PATCH'])
          Path(os.environ['CANDIDATE_SHA']).write_text(hashlib.sha256(patch.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PY
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi
      - name: Upload immutable candidate patch
        if: ${{ steps.session.outputs.write_eligible == 'true' && steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate.patch.sha256
          if-no-files-found: error
          retention-days: 1

  # Compatibility jobs intentionally remain visible for workflow-contract tooling.
  # Production publication requires an active freeze, so online learning and the
  # former second writer are fail-closed here; model promotion is an offline flow.
  pfill_learning:
    name: Disabled production learning compatibility gate
    if: ${{ false }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - run: echo 'production freeze forbids online learning in the Daily writer'

  decision_refresh_after_learning:
    name: Disabled post-learning refresh compatibility gate
    needs: pfill_learning
    if: ${{ false }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo 'Daily has exactly one validated compute and one CAS publisher'

  publish:
    name: CAS publish one Daily commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daily-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {'base_sha.txt', 'candidate.patch', 'candidate.patch.sha256'}
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply exact base candidate and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/publish_staged_index.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PUBLISH_STAGED_INDEX="${RUNNER_TEMP}/publish_staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/pred/pred_source_latest.csv','data/pred/_pred_source_meta.json','data/pred/archive/**','data/pred/pred_top10_*.csv','data/market/raw/**','data/market/trade_cal_sse.csv','data/market/features_base_*.csv','data/market/features_limit_*.csv','data/market/truth_close_*.csv','data/market/_meta_*.json','docs/weights/**','docs/signals/**','outputs/decision/decision_report_20??????.md','outputs/decision/eval_20??????.json','outputs/decision/forward_observation_protocol_v12.json','outputs/decision/research_context_20??????.json','outputs/decision/research_context_dc20_20??????.json','outputs/decision/three_rank_top10_20??????.json','outputs/decision/three_rank_top10_20??????.csv','outputs/decision/three_rank_index.json','outputs/decision/executable_profit_research/projection_20??????.json','outputs/decision/executable_profit_research/projection_20??????.csv','outputs/decision/executable_profit_research/shadow_statistics_20??????_asof_20??????.json','outputs/decision/executable_profit_research/index.json','outputs/decision/legacy_profit_relative_research/projection_20??????.json','outputs/decision/legacy_profit_relative_research/projection_20??????.csv','outputs/decision/legacy_profit_relative_research/index.json','data/decision_executable_profit/forward/selections/shadow_20??????.json','data/decision_executable_profit/forward/selections/shadow_20??????.csv','data/decision_executable_profit/forward/selections/index.json','data/decision_executable_profit/forward/statistics/summary.json','data/decision/**','docs/reports/*.md')
          forbidden=('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or any(matches(p,a) for a in forbidden)]
          if bad: raise SystemExit(f'non-allowlisted Daily publish paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['PUBLISH_STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Daily publish index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Daily publish paths staged: {bad_modes}')
          if not paths: raise SystemExit('Daily candidate patch became empty')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: sync market raw, build fs, update decision outputs'
      - name: Publish exact CAS commit with minimally injected token
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact published Daily revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
