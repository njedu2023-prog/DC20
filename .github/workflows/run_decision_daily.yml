      - name: Require persisted Auction action for real Daily publication
        id: persisted_action
        if: ${{ steps.target.outputs.already_complete != 'true' }}
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from top10decision.decision.action_plan import (
              action_plan_semantic_comparison_profile_v3,
              action_plan_semantic_projection_v3,
          )
          from top10decision.decision.canonical_fingerprint import canonical_json_bytes
          from top10decision.decision.model_freeze import (
              load_model_freeze,
              model_freeze_active,
              validate_action_plan_artifact,
          )

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate JSON key')
                  result[key] = value
              return result

          publish = os.environ['PUBLISH'] == 'true'
          if not publish:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(
                      'validated=false\nsimulation=true\nsemantic_sha256=\n'
                      'comparison_profile=\nsignal_date=\nreport_date=\n'
                  )
          else:
              root = Path('.').resolve()
              try:
                  manifest = load_model_freeze(root, required=True)
                  audit = validate_action_plan_artifact(
                      root,
                      manifest,
                      force_enforcement=not model_freeze_active(manifest),
                  )
                  path = root / 'outputs/decision/action_plan_latest.json'
                  if (
                      audit.get('validated') is not True
                      or audit.get('enforced') is not True
                      or not path.is_file()
                      or path.is_symlink()
                  ):
                      raise RuntimeError('persisted Auction action was not enforced')
                  action = json.loads(
                      path.read_text(encoding='utf-8'),
                      object_pairs_hook=reject_duplicate_keys,
                  )
                  if not isinstance(action, dict):
                      raise RuntimeError('persisted Auction action must be an object')
                  generated_at = action.pop('generated_at_utc', None)
                  generated_time = datetime.fromisoformat(generated_at)
                  if (
                      type(generated_at) is not str
                      or generated_time.isoformat() != generated_at
                      or generated_time.utcoffset() != timedelta(0)
                      or generated_time.microsecond != 0
                  ):
                      raise RuntimeError('persisted Auction action timestamp is invalid')
                  signal_date = action.get('signal_date')
                  if type(signal_date) is not str:
                      raise RuntimeError('persisted Auction action signal_date is invalid')
                  try:
                      parsed_signal_date = datetime.strptime(signal_date, '%Y%m%d')
                  except ValueError as exc:
                      raise RuntimeError(
                          'persisted Auction action signal_date is invalid'
                      ) from exc
                  if parsed_signal_date.strftime('%Y%m%d') != signal_date:
                      raise RuntimeError('persisted Auction action signal_date is invalid')
                  report_date = action.get('report_date')
                  if type(report_date) is not str:
                      raise RuntimeError('persisted Auction action report_date is invalid')
                  try:
                      parsed_report_date = datetime.strptime(report_date, '%Y%m%d')
                  except ValueError as exc:
                      raise RuntimeError(
                          'persisted Auction action report_date is invalid'
                      ) from exc
                  if (
                      parsed_report_date.strftime('%Y%m%d') != report_date
                      or parsed_signal_date >= parsed_report_date
                      or action.get('exec_date') != report_date
                  ):
                      raise RuntimeError('persisted Auction action report_date is invalid')
                  comparison_profile = action_plan_semantic_comparison_profile_v3(
                      action
                  )
                  semantic_action = action_plan_semantic_projection_v3(
                      action,
                      comparison_profile=comparison_profile,
                  )
                  semantic_digest = hashlib.sha256(
                      canonical_json_bytes(semantic_action)
                  ).hexdigest()
              except Exception:
                  print(json.dumps({
                      'component': 'daily_auction_action_prerequisite',
                      'reason_code': 'AUCTION_ACTION_PREREQUISITE_FAILED',
                      'status': 'fail',
                  }, separators=(',', ':'), sort_keys=True))
                  raise SystemExit(1)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(
                      'validated=true\nsimulation=false\n'
                      f'semantic_sha256={semantic_digest}\n'
                      f'comparison_profile={comparison_profile}\n'
                      f'signal_date={signal_date}\n'
                      f'report_date={report_date}\n'
                  )
          PY
