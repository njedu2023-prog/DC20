    timeout-minutes: 5
    steps:
      - run: echo 'Daily has exactly one validated compute and one CAS publisher'

  publish:
    name: CAS publish one Daily commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daily-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {
              'base_sha.txt',
              'candidate.patch',
              'candidate.patch.sha256',
              'daily-signal-date.txt',
          }
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          signal_date = (root / 'daily-signal-date.txt').read_text(
              encoding='ascii'
          ).strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          if re.fullmatch(r'20\d{6}', signal_date) is None:
              raise SystemExit('invalid Daily candidate signal date')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply exact base candidate and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/publish_staged_index.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PUBLISH_STAGED_INDEX="${RUNNER_TEMP}/publish_staged_index.bin" SIGNAL_DATE_FILE="${RUNNER_TEMP}/candidate/daily-signal-date.txt" python - <<'PY'
          import csv, fnmatch, hashlib, json, os, re
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          allowed=('data/pred/pred_source_latest.csv','data/pred/_pred_source_meta.json','data/pred/archive/**','data/pred/pred_top10_*.csv','data/market/raw/**','data/market/trade_cal_sse.csv','data/market/features_base_*.csv','data/market/features_limit_*.csv','data/market/truth_close_*.csv','data/market/_meta_*.json','docs/weights/**','docs/signals/**','outputs/auction_v3/predictions/pred_20??????.csv','outputs/decision/decision_report_20??????.md','outputs/decision/eval_20??????.json','outputs/decision/forward_observation_protocol_v12.json','outputs/decision/research_context_20??????.json','outputs/decision/research_context_dc20_20??????.json','outputs/decision/three_rank_top10_20??????.json','outputs/decision/three_rank_top10_20??????.csv','outputs/decision/three_rank_index.json','outputs/decision/executable_profit_research/projection_20??????.json','outputs/decision/executable_profit_research/projection_20??????.csv','outputs/decision/executable_profit_research/shadow_statistics_20??????_asof_20??????.json','outputs/decision/executable_profit_research/index.json','outputs/decision/legacy_profit_relative_research/projection_20??????.json','outputs/decision/legacy_profit_relative_research/projection_20??????.csv','outputs/decision/legacy_profit_relative_research/index.json','data/decision_executable_profit/forward/selections/shadow_20??????.json','data/decision_executable_profit/forward/selections/shadow_20??????.csv','data/decision_executable_profit/forward/selections/index.json','data/decision_executable_profit/forward/statistics/summary.json','data/decision/**','docs/reports/*.md')
          forbidden=('outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          signal_date=Path(os.environ['SIGNAL_DATE_FILE']).read_text(encoding='ascii').strip()
          if re.fullmatch(r'20\d{6}', signal_date) is None:
              raise SystemExit('invalid Daily publish signal date')
          expected_prediction=f'outputs/auction_v3/predictions/pred_{signal_date}.csv'
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or any(matches(p,a) for a in forbidden)]
          bad.extend(
              p for p in paths
              if p.startswith('outputs/auction_v3/') and p != expected_prediction
          )
          if bad: raise SystemExit(f'non-allowlisted Daily publish paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['PUBLISH_STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set and path != expected_prediction:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Daily publish index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Daily publish paths staged: {bad_modes}')
          prediction_path=Path(expected_prediction)
          if (
              index_modes.get(expected_prediction) != '100644'
              or prediction_path.is_symlink()
              or not prediction_path.is_file()
              or prediction_path.stat().st_size <= 0
          ):
              raise SystemExit('Daily publish exact pred_D is missing or unsafe')
          selection_path=Path(
              f'data/decision_executable_profit/forward/selections/'
              f'shadow_{signal_date}.json'
          )
          projection_path=Path(
              f'outputs/decision/executable_profit_research/'
              f'projection_{signal_date}.json'
          )
          if any(
              path.is_symlink() or not path.is_file()
              for path in (selection_path, projection_path)
          ):
              raise SystemExit(
                  'Daily publish exact pred_D binding artifact is unsafe'
              )
          selection=json.loads(selection_path.read_text(encoding='utf-8'))
          projection=json.loads(projection_path.read_text(encoding='utf-8'))
          digest=hashlib.sha256(prediction_path.read_bytes()).hexdigest()
          source_d=selection.get('source_d_feature') or {}
          source_binding=(
              (projection.get('source_bindings') or {}).get('selection') or {}
          )
          selection_rows=selection.get('rows')
          if (
              selection.get('signal_date') != signal_date
              or projection.get('signal_date') != signal_date
              or not isinstance(selection_rows, list)
              or source_d.get('file_name') != prediction_path.name
              or source_d.get('file_sha256') != digest
              or source_d.get('selected_row_count') != len(selection_rows)
              or source_binding.get('d_feature_file_sha256') != digest
          ):
              raise SystemExit('Daily publish exact pred_D SHA binding drifted')
          with prediction_path.open(
              'r', encoding='utf-8-sig', newline=''
          ) as handle:
              reader=csv.DictReader(handle)
              required={
                  'action', 'selected', 'first_layer_selected',
                  'trade_selected', 'guidance_only', 'broker_connected',
                  'market_order_allowed', 'order_type',
              }
              if not required.issubset(reader.fieldnames or ()):
                  raise SystemExit(
                      'Daily publish exact pred_D action columns are missing'
                  )
              prediction_rows=list(reader)
          if not prediction_rows:
              raise SystemExit('Daily publish exact pred_D candidate pool is empty')
          def exact_integer(value, expected):
              try:
                  return Decimal(str(value).strip()) == expected
              except (InvalidOperation, ValueError):
                  return False
          for row in prediction_rows:
              if (
                  str(row.get('action') or '').strip()
                  not in {'REJECT', 'SHADOW_ONLY'}
                  or not all(
                      exact_integer(row.get(column), 0)
                      for column in (
                          'selected', 'first_layer_selected',
                          'trade_selected', 'broker_connected',
                          'market_order_allowed',
                      )
                  )
                  or not exact_integer(row.get('guidance_only'), 1)
                  or str(row.get('order_type') or '').strip()
                  != 'LIMIT_ONLY_MANUAL'
              ):
                  raise SystemExit(
                      'Daily publish exact pred_D action boundary drifted'
                  )
          if not paths: raise SystemExit('Daily candidate patch became empty')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: sync market raw, build fs, update decision outputs'
      - name: Publish exact CAS commit with minimally injected token
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact published Daily revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
