name: Run Top10 Decision (Auto Daily)

on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；完成真实同步、计算和校验但不提交"
        required: true
        default: true
        type: boolean
      trade_date:
        description: "手动指定交易日 YYYYMMDD（留空=自动使用最新快照）"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_DISABLE_CPU_FEATURES: "X86_V4"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Read-only build and validate Daily Decision candidate
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      has_changes: ${{ steps.candidate.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dry-run mode and immutable base
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${INPUT_DRY_RUN:-true}" != false ]; then publish=false; fi
          git rev-parse HEAD > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Require active production freeze and enforced pins for real publication
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from top10decision.decision.model_freeze import load_model_freeze, model_freeze_active, validate_pinned_files
          root=Path('.').resolve(); manifest=load_model_freeze(root, required=True)
          active=model_freeze_active(manifest)
          if os.environ['PUBLISH'] == 'true' and not active: raise SystemExit('real Daily publication requires active Decision freeze')
          audit=validate_pinned_files(root, manifest, force_enforcement=not active)
          if audit.get('enforced') is not True: raise SystemExit('Daily preflight did not enforce frozen pins')
          PY
      - name: Validate optional manual trade date
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -euo pipefail
          if [ -n "${TRADE_DATE}" ]; then echo "${TRADE_DATE}" | grep -Eq '^[0-9]{8}$'; fi
      - name: Require persisted Auction action for real Daily publication
        id: persisted_action
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from top10decision.decision.action_plan import (
              action_plan_semantic_comparison_profile_v3,
              action_plan_semantic_projection_v3,
          )
          from top10decision.decision.canonical_fingerprint import canonical_json_bytes
          from top10decision.decision.model_freeze import (
              load_model_freeze,
              model_freeze_active,
              validate_action_plan_artifact,
          )

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate JSON key')
                  result[key] = value
              return result

          publish = os.environ['PUBLISH'] == 'true'
          if not publish:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(
                      'validated=false\nsimulation=true\nsemantic_sha256=\n'
                      'comparison_profile=\nsignal_date=\nreport_date=\n'
                  )
          else:
              root = Path('.').resolve()
              try:
                  manifest = load_model_freeze(root, required=True)
                  audit = validate_action_plan_artifact(
                      root,
                      manifest,
                      force_enforcement=not model_freeze_active(manifest),
                  )
                  path = root / 'outputs/decision/action_plan_latest.json'
                  if (
                      audit.get('validated') is not True
                      or audit.get('enforced') is not True
                      or not path.is_file()
                      or path.is_symlink()
                  ):
                      raise RuntimeError('persisted Auction action was not enforced')
                  action = json.loads(
                      path.read_text(encoding='utf-8'),
                      object_pairs_hook=reject_duplicate_keys,
                  )
                  if not isinstance(action, dict):
                      raise RuntimeError('persisted Auction action must be an object')
                  generated_at = action.pop('generated_at_utc', None)
                  generated_time = datetime.fromisoformat(generated_at)
                  if (
                      type(generated_at) is not str
                      or generated_time.isoformat() != generated_at
                      or generated_time.utcoffset() != timedelta(0)
                      or generated_time.microsecond != 0
                  ):
                      raise RuntimeError('persisted Auction action timestamp is invalid')
                  signal_date = action.get('signal_date')
                  if type(signal_date) is not str:
                      raise RuntimeError('persisted Auction action signal_date is invalid')
                  try:
                      parsed_signal_date = datetime.strptime(signal_date, '%Y%m%d')
                  except ValueError as exc:
                      raise RuntimeError(
                          'persisted Auction action signal_date is invalid'
                      ) from exc
                  if parsed_signal_date.strftime('%Y%m%d') != signal_date:
                      raise RuntimeError('persisted Auction action signal_date is invalid')
                  report_date = action.get('report_date')
                  if type(report_date) is not str:
                      raise RuntimeError('persisted Auction action report_date is invalid')
                  try:
                      parsed_report_date = datetime.strptime(report_date, '%Y%m%d')
                  except ValueError as exc:
                      raise RuntimeError(
                          'persisted Auction action report_date is invalid'
                      ) from exc
                  if (
                      parsed_report_date.strftime('%Y%m%d') != report_date
                      or parsed_signal_date >= parsed_report_date
                      or action.get('exec_date') != report_date
                  ):
                      raise RuntimeError('persisted Auction action report_date is invalid')
                  comparison_profile = action_plan_semantic_comparison_profile_v3(
                      action
                  )
                  semantic_action = action_plan_semantic_projection_v3(
                      action,
                      comparison_profile=comparison_profile,
                  )
                  semantic_digest = hashlib.sha256(
                      canonical_json_bytes(semantic_action)
                  ).hexdigest()
              except Exception:
                  print(json.dumps({
                      'component': 'daily_auction_action_prerequisite',
                      'reason_code': 'AUCTION_ACTION_PREREQUISITE_FAILED',
                      'status': 'fail',
                  }, separators=(',', ':'), sort_keys=True))
                  raise SystemExit(1)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(
                      'validated=true\nsimulation=false\n'
                      f'semantic_sha256={semantic_digest}\n'
                      f'comparison_profile={comparison_profile}\n'
                      f'signal_date={signal_date}\n'
                      f'report_date={report_date}\n'
                  )
          PY
      - name: Rebuild exact-base frozen Auction runtime before live source mutation
        id: frozen_action
        env:
          PERSISTED_ACTION_SEMANTIC_SHA256: ${{ steps.persisted_action.outputs.semantic_sha256 }}
          PERSISTED_ACTION_COMPARISON_PROFILE: ${{ steps.persisted_action.outputs.comparison_profile }}
          PERSISTED_ACTION_SIGNAL_DATE: ${{ steps.persisted_action.outputs.signal_date }}
          PERSISTED_ACTION_REPORT_DATE: ${{ steps.persisted_action.outputs.report_date }}
          PERSISTED_ACTION_VALIDATED: ${{ steps.persisted_action.outputs.validated }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          replay_report="${RUNNER_TEMP}/daily-frozen-replay.json"
          replay_stdout="${RUNNER_TEMP}/daily-frozen-replay.stdout"
          replay_args=(
            --root "${GITHUB_WORKSPACE}"
            --report "${replay_report}"
          )
          if [ "${PUBLISH}" = true ]; then
            if [[ ! "${PERSISTED_ACTION_SIGNAL_DATE}" =~ ^20[0-9]{6}$ ]]; then
              echo 'Daily persisted Auction action signal_date is invalid' >&2
              exit 1
            fi
            if [[ ! "${PERSISTED_ACTION_REPORT_DATE}" =~ ^20[0-9]{6}$ ]]; then
              echo 'Daily persisted Auction action report_date is invalid' >&2
              exit 1
            fi
            replay_args+=(
              --signal-date "${PERSISTED_ACTION_SIGNAL_DATE}"
              --report-date "${PERSISTED_ACTION_REPORT_DATE}"
            )
          fi
          set +e
          python scripts/run_deterministic_numeric.py scripts/replay_frozen_canonical_v2.py \
            "${replay_args[@]}" > "${replay_stdout}"
          replay_status=$?
          set -e
          if [ "${replay_status}" -ne 0 ]; then
            REPLAY_REPORT="${replay_report}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          report = Path(os.environ['REPLAY_REPORT'])
          error = ''
          if report.is_file():
              try:
                  payload = json.loads(report.read_text(encoding='utf-8'))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  payload = {}
              if isinstance(payload, dict) and isinstance(payload.get('error'), str):
                  error = payload['error']
          lowered = error.lower()
          if 'pinned' in lowered:
              reason = 'PIN_DRIFT'
          elif 'action' in lowered or 'watchlist' in lowered:
              reason = 'ACTION_WATCHLIST_DRIFT'
          elif 'canonical' in lowered:
              reason = 'CANONICAL_RUNTIME_DRIFT'
          elif 'history' in lowered or 'snapshot' in lowered:
              reason = 'FROZEN_HISTORY_DRIFT'
          else:
              reason = 'FROZEN_RUNTIME_VALIDATION_FAILED'
          print(json.dumps({
              'component': 'daily_frozen_replay',
              'error_sha256': hashlib.sha256(error.encode('utf-8')).hexdigest(),
              'reason_code': reason,
              'status': 'fail',
          }, separators=(',', ':'), sort_keys=True))
          PY
            exit "${replay_status}"
          fi
          python - <<'PY'
          import hashlib, hmac, json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          from top10decision.decision.action_plan import (
              action_plan_semantic_comparison_profile_v3,
              action_plan_semantic_projection_v3,
          )
          from top10decision.decision.canonical_fingerprint import canonical_json_bytes
          from top10decision.decision.model_freeze import (
              load_model_freeze,
              model_freeze_active,
              validate_action_plan_artifact,
          )

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate JSON key')
                  result[key] = value
              return result

          root=Path('.').resolve()
          manifest=load_model_freeze(root, required=True)
          audit=validate_action_plan_artifact(
              root,
              manifest,
              force_enforcement=not model_freeze_active(manifest),
          )
          if audit.get('validated') is not True or audit.get('enforced') is not True:
              raise SystemExit('Daily replayed action plan contract was not enforced')
          raw=(root / 'outputs/decision/action_plan_latest.json').read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          try:
              action=json.loads(
                  raw.decode('utf-8'),
                  object_pairs_hook=reject_duplicate_keys,
              )
          except (UnicodeError, ValueError):
              raise SystemExit('Daily replayed action JSON is invalid')
          if not isinstance(action, dict):
              raise SystemExit('Daily replayed action must be an object')
          generated_at=action.pop('generated_at_utc', None)
          try:
              generated_time=datetime.fromisoformat(generated_at)
          except (TypeError, ValueError):
              raise SystemExit('Daily replayed action timestamp is invalid')
          if (
              type(generated_at) is not str
              or generated_time.isoformat() != generated_at
              or generated_time.utcoffset() != timedelta(0)
              or generated_time.microsecond != 0
          ):
              raise SystemExit('Daily replayed action timestamp is invalid')
          expected_signal_date=os.environ.get('PERSISTED_ACTION_SIGNAL_DATE', '')
          expected_report_date=os.environ.get('PERSISTED_ACTION_REPORT_DATE', '')
          if os.environ['PUBLISH'] == 'true':
              try:
                  parsed_signal_date=datetime.strptime(expected_signal_date, '%Y%m%d')
              except ValueError:
                  raise SystemExit('Daily persisted Auction action signal_date is invalid')
              if parsed_signal_date.strftime('%Y%m%d') != expected_signal_date:
                  raise SystemExit('Daily persisted Auction action signal_date is invalid')
              if action.get('signal_date') != expected_signal_date:
                  raise SystemExit(
                      'Daily replayed action signal_date differs from persisted Auction action'
                  )
              try:
                  parsed_report_date=datetime.strptime(expected_report_date, '%Y%m%d')
              except ValueError:
                  raise SystemExit('Daily persisted Auction action report_date is invalid')
              if (
                  parsed_report_date.strftime('%Y%m%d') != expected_report_date
                  or parsed_signal_date >= parsed_report_date
                  or action.get('report_date') != expected_report_date
                  or action.get('exec_date') != expected_report_date
              ):
                  raise SystemExit(
                      'Daily replayed action report_date differs from persisted Auction action'
                  )
          elif expected_signal_date or expected_report_date:
              raise SystemExit('Daily dry-run unexpectedly received persisted action dates')
          comparison_profile=os.environ['PERSISTED_ACTION_COMPARISON_PROFILE']
          if os.environ['PUBLISH'] != 'true':
              comparison_profile=action_plan_semantic_comparison_profile_v3(action)
          try:
              semantic_action=action_plan_semantic_projection_v3(
                  action,
                  comparison_profile=comparison_profile,
              )
          except ValueError:
              raise SystemExit('Daily replayed action semantic evidence is invalid')
          semantic_digest=hashlib.sha256(canonical_json_bytes(semantic_action)).hexdigest()
          if os.environ['PUBLISH'] == 'true':
              if os.environ['PERSISTED_ACTION_VALIDATED'] != 'true':
                  raise SystemExit('Daily real publication lacks a validated persisted Auction action')
              print(json.dumps({
                  'comparison_profile': comparison_profile,
                  'component': 'daily_action_semantic_comparison_v3',
                  'persisted_semantic_sha256': os.environ[
                      'PERSISTED_ACTION_SEMANTIC_SHA256'
                  ],
                  'replayed_semantic_sha256': semantic_digest,
                  'status': 'compare',
              }, separators=(',', ':'), sort_keys=True))
              if not hmac.compare_digest(
                  semantic_digest,
                  os.environ['PERSISTED_ACTION_SEMANTIC_SHA256'],
              ):
                  raise SystemExit('Daily replayed action semantics differ from persisted Auction action')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"sha256={digest}\n")
          PY
          auction_reports="${RUNNER_TEMP}/daily-auction-report-paths.bin"
          git ls-files -z --cached -- ':(glob,top)docs/reports/auction_v3*.html' > "${auction_reports}"
          if [ -s "${auction_reports}" ]; then
            git restore --worktree --source=HEAD \
              --pathspec-from-file="${auction_reports}" --pathspec-file-nul
          fi
          git clean -f -- ':(glob,top)docs/reports/auction_v3*.html'
          git status --porcelain=v1 -z --untracked-files=all -- \
            ':(glob,top)docs/reports/auction_v3*.html' \
            > "${RUNNER_TEMP}/daily-auction-report-dirty.bin"
          test ! -s "${RUNNER_TEMP}/daily-auction-report-dirty.bin"
      - name: Resolve Daily exchange write eligibility
        id: session
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -euo pipefail
          args=(--calendar-only)
          if [ -n "${TRADE_DATE}" ]; then args+=(--trade-date "${TRADE_DATE}"); fi
          session_evidence="${RUNNER_TEMP}/daily-session-sync.json"
          python scripts/sync_tushare_minute.py "${args[@]}" > "${session_evidence}"
          SESSION_EVIDENCE="${session_evidence}" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['SESSION_EVIDENCE']).read_text(encoding='utf-8'))
          if not isinstance(payload, dict): raise SystemExit('Daily session evidence must be one JSON object')
          status, reason, active = payload.get('status'), payload.get('reason'), payload.get('active_window')
          if type(active) is not bool: raise SystemExit('Daily active_window must be a JSON boolean')
          no_write_reasons = {'exchange_closed', 'outside_active_minute_window'}
          if status == 'not_applicable' and reason in no_write_reasons:
              eligible = False
          elif status == 'success' and reason == 'calendar_synced':
              eligible = True
          else:
              raise SystemExit(f'unexpected Daily session evidence: status={status!r} reason={reason!r}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"write_eligible={'true' if eligible else 'false'}\n")
          PY
      - name: Resolve immutable upstream commits before any source write
        id: upstream
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen

          token=os.environ.get('GH_API_TOKEN','').strip()
          if not token: raise SystemExit('GITHUB_TOKEN is required to resolve immutable upstream commits')
          targets=(('pred_sha','njedu2023-prog','a-top10'),('market_sha','njedu2023-prog','a-share-top3-data'))
          output=[]
          for key, owner, repo in targets:
              request=Request(
                  f'https://api.github.com/repos/{owner}/{repo}/commits/main',
                  headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
              )
              with urlopen(request, timeout=30) as response:
                  payload=json.load(response)
              sha=str(payload.get('sha') or '').strip().lower()
              if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
                  raise SystemExit(f'failed to resolve immutable commit for {owner}/{repo}@main')
              output.append(f'{key}={sha}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write('\n'.join(output)+'\n')
          PY
      - name: Sync prediction and market source snapshots
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TRADE_DATE: ${{ inputs.trade_date }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          MARKET_RAW_COMMIT: ${{ steps.upstream.outputs.market_sha }}
          TOP10_PRED_RESOLVED_COMMIT: ${{ steps.upstream.outputs.pred_sha }}
          A_TOP10_COMMIT: ${{ steps.upstream.outputs.pred_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/pred/archive data/market/raw data/decision docs/signals docs/reports docs/weights outputs/decision outputs/learning models
          if [ -n "${TRADE_DATE}" ]; then
            url="https://raw.githubusercontent.com/njedu2023-prog/a-top10/${A_TOP10_COMMIT}/outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
            TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${url}" python scripts/sync_pred_source.py
            python scripts/sync_market_raw.py --trade-date "${TRADE_DATE}"
          else
            TOP10_PRED_URL="https://raw.githubusercontent.com/njedu2023-prog/a-top10/${A_TOP10_COMMIT}/outputs/decisio/pred_decisio_latest.csv" python scripts/sync_pred_source.py
            python scripts/sync_market_raw.py
          fi
      - name: Build market features and strict exchange calendar
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TRADE_DATE: ${{ inputs.trade_date }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TRADE_DATE}" ]; then python scripts/build_market_fs.py --trade-date "${TRADE_DATE}"; else python scripts/build_market_fs.py; fi
      - name: Pin the last Auction-validated action plan
        id: preserved_action
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        env:
          FROZEN_ACTION_SHA256: ${{ steps.frozen_action.outputs.sha256 }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, hmac, os
          from pathlib import Path
          from top10decision.decision.model_freeze import (
              load_model_freeze,
              model_freeze_active,
              validate_action_plan_artifact,
          )

          root=Path('.').resolve()
          manifest=load_model_freeze(root, required=True)
          audit=validate_action_plan_artifact(
              root,
              manifest,
              force_enforcement=not model_freeze_active(manifest),
          )
          if audit.get('validated') is not True or audit.get('enforced') is not True:
              raise SystemExit('Daily action plan contract was not enforced')
          path=root / 'outputs/decision/action_plan_latest.json'
          raw=path.read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          if not hmac.compare_digest(digest, os.environ['FROZEN_ACTION_SHA256']):
              raise SystemExit('Daily source synchronization modified the frozen Auction action plan')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"sha256={digest}\n")
          PY
      - name: Run Daily Decision once with learning and refresh disabled
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TRADE_DATE: ${{ inputs.trade_date }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PRESERVED_ACTION_SHA256: ${{ steps.preserved_action.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -n "${TRADE_DATE}" ]; then python scripts/run_v2.py --trade-date "${TRADE_DATE}"; else python scripts/run_v2.py; fi
          python - <<'PY'
          import hashlib, hmac, os
          from pathlib import Path

          path=Path('outputs/decision/action_plan_latest.json')
          actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else ''
          if not hmac.compare_digest(actual, os.environ['PRESERVED_ACTION_SHA256']):
              raise SystemExit('Daily modified the preserved Auction action plan')
          PY
          python scripts/validate_io_contract.py --strict-semantic
          if [ "${PUBLISH}" = "true" ]; then
            python scripts/validate_decision_model_freeze.py --runtime
          else
            python scripts/validate_decision_model_freeze.py --runtime --force-inactive
          fi
      - name: Build exact allowlisted Daily candidate patch
        id: candidate
        if: ${{ steps.session.outputs.write_eligible == 'true' }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- data/pred
          git add -A -- data/market
          git add -A -- docs
          git add -A -- outputs/decision data/decision
          git reset -q HEAD -- ':(glob)outputs/decision/action_plan_*.json' 'outputs/decision/report_index.json'
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/staged_index.bin"
          STAGED_PATHS="${RUNNER_TEMP}/staged_paths.bin" STAGED_INDEX="${RUNNER_TEMP}/staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/pred/pred_source_latest.csv','data/pred/_pred_source_meta.json','data/pred/archive/**','data/pred/pred_top10_*.csv','data/market/raw/**','data/market/trade_cal_sse.csv','data/market/features_base_*.csv','data/market/features_limit_*.csv','data/market/truth_close_*.csv','data/market/_meta_*.json','docs/weights/**','docs/signals/**','outputs/decision/**','data/decision/**','docs/reports/*.md')
          forbidden=('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or any(matches(p,a) for a in forbidden)]
          if bad: raise SystemExit(f'non-allowlisted Daily paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Daily index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Daily paths staged: {bad_modes}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/candidate.patch"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path(os.environ['CANDIDATE_PATCH'])
          Path(os.environ['CANDIDATE_SHA']).write_text(hashlib.sha256(patch.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PY
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi
      - name: Upload immutable candidate patch
        if: ${{ steps.session.outputs.write_eligible == 'true' && steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daily-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate.patch.sha256
          if-no-files-found: error
          retention-days: 1

  # Compatibility jobs intentionally remain visible for workflow-contract tooling.
  # Production publication requires an active freeze, so online learning and the
  # former second writer are fail-closed here; model promotion is an offline flow.
  pfill_learning:
    name: Disabled production learning compatibility gate
    if: ${{ false }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - run: echo 'production freeze forbids online learning in the Daily writer'

  decision_refresh_after_learning:
    name: Disabled post-learning refresh compatibility gate
    needs: pfill_learning
    if: ${{ false }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo 'Daily has exactly one validated compute and one CAS publisher'

  publish:
    name: CAS publish one Daily commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: daily-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {'base_sha.txt', 'candidate.patch', 'candidate.patch.sha256'}
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply exact base candidate and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/publish_staged_index.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PUBLISH_STAGED_INDEX="${RUNNER_TEMP}/publish_staged_index.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed=('data/pred/pred_source_latest.csv','data/pred/_pred_source_meta.json','data/pred/archive/**','data/pred/pred_top10_*.csv','data/market/raw/**','data/market/trade_cal_sse.csv','data/market/features_base_*.csv','data/market/features_limit_*.csv','data/market/truth_close_*.csv','data/market/_meta_*.json','docs/weights/**','docs/signals/**','outputs/decision/**','data/decision/**','docs/reports/*.md')
          forbidden=('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              if pattern.endswith('/**'):
                  return path.startswith(pattern[:-3] + '/')
              path_parts = path.split('/')
              pattern_parts = pattern.split('/')
              return len(path_parts) == len(pattern_parts) and all(
                  fnmatch.fnmatchcase(part, expected)
                  for part, expected in zip(path_parts, pattern_parts)
              )
          paths=[p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or any(matches(p,a) for a in forbidden)]
          if bad: raise SystemExit(f'non-allowlisted Daily publish paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['PUBLISH_STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b'\t', 1)
              mode, _object_id, stage = metadata.decode('ascii').split()
              path = raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Daily publish index entry: {path}')
              index_modes[path] = mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Daily publish paths staged: {bad_modes}')
          if not paths: raise SystemExit('Daily candidate patch became empty')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: sync market raw, build fs, update decision outputs'
      - name: Publish exact CAS commit with minimally injected token
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact published Daily revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
