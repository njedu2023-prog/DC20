          token=os.environ.get('GH_API_TOKEN','').strip()
          if not token: raise SystemExit('GITHUB_TOKEN is required to resolve immutable upstream commits')
          targets=(('pred_sha','njedu2023-prog','a-top10'),('market_sha','njedu2023-prog','a-share-top3-data'))
          output=[]
          for key, owner, repo in targets:
