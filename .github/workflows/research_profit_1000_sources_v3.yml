name: DC20 · isolated v3 canonical sources and labels (no training)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/COLLECTION_V3.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: dc20-research-canonical-v3
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  collect-and-rebuild:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact version without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test all isolated upgrade contracts before market-data access
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production freeze
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py --root .
      - name: Read exactly the registered v2 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 180 --max-filesize 30000000 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/10292829634/zip \
            --output "${RUNNER_TEMP}/history-v2.zip"
      - name: Audit immutable v2 archive and import only qualified source bytes
        run: |
          set -euo pipefail
          python -B work/profit_1000_upgrade/research_v3.py initialize \
            --root "${RUNNER_TEMP}/v3-canonical-research" \
            --v2-archive "${RUNNER_TEMP}/history-v2.zip"
      - name: Three-date preflight before the remaining canonical requests (393 total, zero retries)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -euo pipefail
          collection_exit=0
          python -B work/profit_1000_upgrade/collect_v3.py \
            --root "${RUNNER_TEMP}/v3-canonical-research" \
            --report "${RUNNER_TEMP}/v3-canonical-research/collection_receipt.json" || collection_exit=$?
          if [ "${collection_exit}" -ne 0 ] && [ "${collection_exit}" -ne 2 ]; then
            exit "${collection_exit}"
          fi
          test -s "${RUNNER_TEMP}/v3-canonical-research/collection_receipt.json"
      - name: Rebuild all 6753 candidates preserving pending and negative labels
        run: |
          set -euo pipefail
          python -B work/profit_1000_upgrade/research_v3.py rebuild \
            --root "${RUNNER_TEMP}/v3-canonical-research"
      - name: Verify no production source model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain source receipts and full labels, including blocked evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-v3-canonical-research-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v3-canonical-research/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
