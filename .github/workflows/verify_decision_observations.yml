name: Verify Decision Top10 Observations

on:
  schedule:
    - cron: "15,45 8-9 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；完成真实结算和校验但不提交"
        required: true
        default: true
        type: boolean
      as_of_date:
        description: "校验日期 YYYYMMDD（留空=北京时间今天）"
        required: false
        type: string
      from_exec_date:
        description: "累计验证起始T日 YYYYMMDD"
        required: false
        default: "20260721"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_DISABLE_CPU_FEATURES: "X86_V4"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Read-only settle and validate observation truth
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      has_changes: ${{ steps.candidate.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dry-run mode and immutable base
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${INPUT_DRY_RUN:-true}" != false ]; then publish=false; fi
          git rev-parse HEAD > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Require active production freeze and enforced pins for real publication
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from top10decision.decision.model_freeze import load_model_freeze, model_freeze_active, validate_pinned_files
          root=Path('.').resolve(); manifest=load_model_freeze(root, required=True)
          active=model_freeze_active(manifest)
          if os.environ['PUBLISH'] == 'true' and not active: raise SystemExit('real Verify publication requires active Decision freeze')
          audit=validate_pinned_files(root, manifest, force_enforcement=not active)
          if audit.get('enforced') is not True: raise SystemExit('Verify preflight did not enforce frozen pins')
          PY
      - name: Resolve strict exchange session
        id: session
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          INPUT_DATE: ${{ inputs.as_of_date }}
        run: |
          set -euo pipefail
          python scripts/sync_tushare_minute.py --calendar-only
          as_of="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%Y%m%d)}"
          echo "${as_of}" | grep -Eq '^[0-9]{8}$'
          echo "as_of_date=${as_of}" >> "${GITHUB_OUTPUT}"
          set +e
          python scripts/verify_decision_observations.py --check-trading-date "${as_of}"
          status=$?
          set -e
          if [ "${status}" = 0 ]; then echo 'is_open=true' >> "${GITHUB_OUTPUT}"; elif [ "${status}" = 3 ]; then echo 'is_open=false' >> "${GITHUB_OUTPUT}"; else exit "${status}"; fi
      - name: Resolve immutable market upstream commit
        id: upstream
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          token = os.environ.get('GH_API_TOKEN', '').strip()
          if not token: raise SystemExit('GITHUB_TOKEN is required to resolve immutable market commit')
          request = Request(
              'https://api.github.com/repos/njedu2023-prog/a-share-top3-data/commits/main',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
          )
          with urlopen(request, timeout=30) as response:
              payload = json.load(response)
          sha = str(payload.get('sha') or '').strip().lower()
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              raise SystemExit('failed to resolve immutable commit for njedu2023-prog/a-share-top3-data@main')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'market_sha={sha}\n')
          PY
      - name: Sync all same-date truth without optional bypass
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          MARKET_RAW_COMMIT: ${{ steps.upstream.outputs.market_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
        run: |
          set -euo pipefail
          python scripts/sync_market_raw.py --trade-date "${AS_OF_DATE}"
          python scripts/sync_tushare_daily_close.py --trade-date "${AS_OF_DATE}"
          minute_evidence="${RUNNER_TEMP}/verify-minute-sync.json"
          minute_args=(--trade-date "${AS_OF_DATE}" --max-codes 120 --timeout-seconds 8 --workers 6)
          if [ "${AS_OF_DATE}" = "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then minute_args+=(--post-close-truth); fi
          python scripts/sync_tushare_minute.py "${minute_args[@]}" > "${minute_evidence}"
          MINUTE_EVIDENCE="${minute_evidence}" python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          payload = json.loads(Path(os.environ['MINUTE_EVIDENCE']).read_text(encoding='utf-8'))
          if not isinstance(payload, dict): raise SystemExit('Verify minute evidence must be one JSON object')
          as_of = os.environ['AS_OF_DATE']
          trade_date = payload.get('trade_date')
          status, reason, active = payload.get('status'), payload.get('reason'), payload.get('active_window')
          if trade_date != as_of: raise SystemExit(f'Verify minute evidence date mismatch: {trade_date!r} != {as_of!r}')
          if type(active) is not bool: raise SystemExit('Verify active_window must be a JSON boolean')
          counts = {}
          for key in ('candidate_codes', 'minute_files_written'):
              value = payload.get(key, 0)
              if type(value) is not int or value < 0:
                  raise SystemExit(f'Verify {key} must be a non-negative JSON integer')
              counts[key] = value
          today = datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y%m%d')
          if as_of != today:
              if status != 'not_applicable' or reason != 'non_current_trade_date' or active or counts['minute_files_written'] != 0:
                  raise SystemExit('prior-date Verify minute sync must be explicitly non_current_trade_date')
          else:
              allowed = {('success', 'post_close_truth_success'), ('partial_success', 'post_close_truth_partial')}
              if (status, reason) not in allowed or counts['candidate_codes'] == 0 or counts['minute_files_written'] == 0:
                  raise SystemExit('current post-close Verify minute sync produced no valid rows')
          PY
      - name: Validate frozen runtime in an isolated exact-base worktree
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/verify-runtime"
          git worktree add --detach "${runtime_root}" "$(cat "${RUNNER_TEMP}/base_sha.txt")" >/dev/null
          cleanup() { git worktree remove --force "${runtime_root}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/run_deterministic_numeric.py" \
            "${runtime_root}/scripts/replay_frozen_canonical_v2.py" \
            --root "${runtime_root}" \
            --report "${RUNNER_TEMP}/verify-frozen-replay.json" >/dev/null
          if [ "${PUBLISH}" = "true" ]; then
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime
          else
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime --force-inactive
          fi
      - name: Settle observation truth without changing action ownership
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          FROM_EXEC_DATE: ${{ inputs.from_exec_date || '20260721' }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all -- outputs/decision)"
          python scripts/verify_decision_observations.py --from-exec-date "${FROM_EXEC_DATE}"
          test -f outputs/auction_v3/verification/observation_latest.csv
          test -f outputs/auction_v3/metrics/observation_cumulative_latest.json
          python -m json.tool outputs/auction_v3/metrics/observation_cumulative_latest.json >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all -- outputs/decision)"
      - name: Build exact allowlisted Verify candidate patch
        id: candidate
        if: ${{ steps.session.outputs.is_open == 'true' }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- 'outputs/auction_v3/verification/observation_*.csv' outputs/auction_v3/verification/manual_actual_latest.csv
          git add -A -- outputs/auction_v3/metrics/observation_cumulative_latest.json outputs/auction_v3/metrics/manual_actual_cumulative_latest.json
          git add -A -- data/market/trade_cal_sse.csv
          git add -A -- 'data/market/raw/**/stk_auction_o.csv' 'data/market/raw/**/stk_auction_o.meta.json'
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/staged_index.bin"
          STAGED_PATHS="${RUNNER_TEMP}/staged_paths.bin" STAGED_INDEX="${RUNNER_TEMP}/staged_index.bin" python - <<'PY'
          import fnmatch, os
          from datetime import datetime
          from pathlib import Path
          allowed=('outputs/auction_v3/verification/observation_*.csv','outputs/auction_v3/verification/manual_actual_latest.csv','outputs/auction_v3/metrics/observation_cumulative_latest.json','outputs/auction_v3/metrics/manual_actual_cumulative_latest.json','data/market/trade_cal_sse.csv','data/market/raw/20[0-9][0-9]/20[0-9][0-9][0-9][0-9][0-9][0-9]/stk_auction_o.csv','data/market/raw/20[0-9][0-9]/20[0-9][0-9][0-9][0-9][0-9][0-9]/stk_auction_o.meta.json')
          forbidden=('outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              path_parts=path.split('/')
              pattern_parts=pattern.split('/')
              memo={}
              def visit(path_index, pattern_index):
                  key=(path_index, pattern_index)
                  if key in memo:
                      return memo[key]
                  if pattern_index == len(pattern_parts):
                      result = path_index == len(path_parts)
                  elif pattern_parts[pattern_index] == '**':
                      result = visit(path_index, pattern_index + 1) or (
                          path_index < len(path_parts)
                          and visit(path_index + 1, pattern_index)
                      )
                  else:
                      result = (
                          path_index < len(path_parts)
                          and fnmatch.fnmatchcase(
                              path_parts[path_index], pattern_parts[pattern_index]
                          )
                          and visit(path_index + 1, pattern_index + 1)
                      )
                  memo[key]=result
                  return result
              return visit(0, 0)
          def dated_raw_path_is_valid(path):
              if not path.startswith('data/market/raw/'):
                  return True
              parts=path.split('/')
              if len(parts) != 6 or parts[5] not in {'stk_auction_o.csv','stk_auction_o.meta.json'}:
                  return False
              year, trade_date=parts[3], parts[4]
              try:
                  parsed=datetime.strptime(trade_date, '%Y%m%d')
              except ValueError:
                  return False
              return parsed.strftime('%Y%m%d') == trade_date and year == trade_date[:4]
          paths=[p.decode() for p in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or not dated_raw_path_is_valid(p)]
          bad.extend(p for p in paths if any(matches(p,a) for a in forbidden))
          if bad: raise SystemExit(f'non-allowlisted Verify paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path=entry.split(b'\t', 1)
              mode, _object_id, stage=metadata.decode('ascii').split()
              path=raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Verify index entry: {path}')
              index_modes[path]=mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Verify paths staged: {bad_modes}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/candidate.patch"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path(os.environ['CANDIDATE_PATCH'])
          Path(os.environ['CANDIDATE_SHA']).write_text(hashlib.sha256(patch.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PY
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi
      - name: Upload immutable candidate patch
        if: ${{ steps.session.outputs.is_open == 'true' && steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate.patch.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: CAS publish one Verify commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verify-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {'base_sha.txt', 'candidate.patch', 'candidate.patch.sha256'}
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply exact base candidate and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --no-renames --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          git ls-files --stage -z > "${RUNNER_TEMP}/publish_staged_index.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" PUBLISH_STAGED_INDEX="${RUNNER_TEMP}/publish_staged_index.bin" python - <<'PY'
          import fnmatch, os
          from datetime import datetime
          from pathlib import Path
          allowed=('outputs/auction_v3/verification/observation_*.csv','outputs/auction_v3/verification/manual_actual_latest.csv','outputs/auction_v3/metrics/observation_cumulative_latest.json','outputs/auction_v3/metrics/manual_actual_cumulative_latest.json','data/market/trade_cal_sse.csv','data/market/raw/20[0-9][0-9]/20[0-9][0-9][0-9][0-9][0-9][0-9]/stk_auction_o.csv','data/market/raw/20[0-9][0-9]/20[0-9][0-9][0-9][0-9][0-9][0-9]/stk_auction_o.meta.json')
          forbidden=('outputs/decision/action_plan_*.json','outputs/decision/report_index.json')
          def matches(path, pattern):
              path_parts=path.split('/')
              pattern_parts=pattern.split('/')
              memo={}
              def visit(path_index, pattern_index):
                  key=(path_index, pattern_index)
                  if key in memo:
                      return memo[key]
                  if pattern_index == len(pattern_parts):
                      result = path_index == len(path_parts)
                  elif pattern_parts[pattern_index] == '**':
                      result = visit(path_index, pattern_index + 1) or (
                          path_index < len(path_parts)
                          and visit(path_index + 1, pattern_index)
                      )
                  else:
                      result = (
                          path_index < len(path_parts)
                          and fnmatch.fnmatchcase(
                              path_parts[path_index], pattern_parts[pattern_index]
                          )
                          and visit(path_index + 1, pattern_index + 1)
                      )
                  memo[key]=result
                  return result
              return visit(0, 0)
          def dated_raw_path_is_valid(path):
              if not path.startswith('data/market/raw/'):
                  return True
              parts=path.split('/')
              if len(parts) != 6 or parts[5] not in {'stk_auction_o.csv','stk_auction_o.meta.json'}:
                  return False
              year, trade_date=parts[3], parts[4]
              try:
                  parsed=datetime.strptime(trade_date, '%Y%m%d')
              except ValueError:
                  return False
              return parsed.strftime('%Y%m%d') == trade_date and year == trade_date[:4]
          paths=[p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad=[p for p in paths if not any(matches(p,a) for a in allowed) or not dated_raw_path_is_valid(p)]
          bad.extend(p for p in paths if any(matches(p,a) for a in forbidden))
          if bad: raise SystemExit(f'non-allowlisted Verify publish paths staged: {bad}')
          path_set=set(paths)
          index_modes={}
          for entry in Path(os.environ['PUBLISH_STAGED_INDEX']).read_bytes().split(b'\0'):
              if not entry:
                  continue
              metadata, raw_path=entry.split(b'\t', 1)
              mode, _object_id, stage=metadata.decode('ascii').split()
              path=raw_path.decode()
              if path not in path_set:
                  continue
              if stage != '0' or path in index_modes:
                  raise SystemExit(f'non-stage-zero Verify publish index entry: {path}')
              index_modes[path]=mode
          bad_modes=[(path,index_modes[path]) for path in paths if path in index_modes and index_modes[path] != '100644']
          if bad_modes: raise SystemExit(f'non-regular Verify publish paths staged: {bad_modes}')
          if not paths: raise SystemExit('Verify candidate patch became empty')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: verify Decision Top10 observation truth'
      - name: Publish exact CAS commit with minimally injected token
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact published Verify revision
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
