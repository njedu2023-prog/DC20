name: Verify Decision Top10 Observations

on:
  schedule:
    # A-share close truth: 16:15 Beijing, with three staggered retries.
    - cron: "15,45 8-9 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "校验日期 YYYYMMDD（留空=北京时间今天）"
        required: false
        type: string
      from_exec_date:
        description: "累计验证起始T日 YYYYMMDD"
        required: false
        default: "20260721"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  # Serialize with Decision V11/backfill writers that update the same outputs.
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  observation_truth:
    name: Settle T and T+1 observation truth
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          # This audited writer pushes one scoped observation-truth commit.
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Sync strict A-share exchange calendar
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -e
          python scripts/sync_tushare_minute.py --calendar-only --optional

      - name: Resolve strict exchange session
        id: session
        env:
          INPUT_DATE: ${{ inputs.as_of_date }}
        run: |
          set -e
          as_of="${INPUT_DATE}"
          if [ -z "${as_of}" ]; then
            as_of="$(TZ=Asia/Shanghai date +%Y%m%d)"
          fi
          if ! echo "${as_of}" | grep -Eq '^[0-9]{8}$'; then
            echo "invalid as_of_date=${as_of}"
            exit 1
          fi
          echo "as_of_date=${as_of}" >> "$GITHUB_OUTPUT"
          set +e
          python scripts/verify_decision_observations.py --check-trading-date "${as_of}"
          status=$?
          set -e
          if [ "${status}" = "0" ]; then
            echo "is_open=true" >> "$GITHUB_OUTPUT"
          elif [ "${status}" = "3" ]; then
            echo "is_open=false" >> "$GITHUB_OUTPUT"
            echo "Exchange is closed on ${as_of}; no Decision truth will be written."
          else
            exit "${status}"
          fi

      - name: Sync current market truth
        if: ${{ steps.session.outputs.is_open == 'true' }}
        id: market_sync
        continue-on-error: true
        env:
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
        run: |
          set -e
          python scripts/sync_market_raw.py --trade-date "${AS_OF_DATE}"

      - name: Sync strict same-date Tushare close truth
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
        run: |
          set -e
          python scripts/sync_tushare_daily_close.py \
            --trade-date "${AS_OF_DATE}" \
            --optional

      - name: Sync current Decision minute truth
        if: ${{ steps.session.outputs.is_open == 'true' }}
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
        run: |
          set -e
          python scripts/sync_tushare_minute.py \
            --trade-date "${AS_OF_DATE}" \
            --optional \
            --max-codes 120 \
            --timeout-seconds 8 \
            --workers 6

      - name: Settle observation truth and cumulative statistics
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          FROM_EXEC_DATE: ${{ inputs.from_exec_date || '20260721' }}
        run: |
          set -e
          python scripts/verify_decision_observations.py \
            --from-exec-date "${FROM_EXEC_DATE}"
          test -f outputs/auction_v3/verification/observation_latest.csv
          test -f outputs/auction_v3/metrics/observation_cumulative_latest.json
          python -m json.tool \
            outputs/auction_v3/metrics/observation_cumulative_latest.json \
            >/dev/null

      - name: Commit Decision observation truth
        if: ${{ steps.session.outputs.is_open == 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/auction_v3/verification/observation_*.csv
          git add outputs/auction_v3/verification/manual_actual_latest.csv
          git add outputs/auction_v3/metrics/observation_cumulative_latest.json
          git add outputs/auction_v3/metrics/manual_actual_cumulative_latest.json
          git add outputs/decision/action_plan_20*.json
          git add outputs/decision/action_plan_latest.json
          git add data/market/trade_cal_sse.csv
          find data/market/raw -type f \
            \( -name 'stk_auction_o.csv' -o -name 'stk_auction_o.meta.json' \) \
            -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Decision observation truth is already current"
            exit 0
          fi
          git commit -m "auto: verify Decision Top10 observation truth"
          # Market sync files are runtime inputs only. Remove their unstaged
          # worktree changes so the output-only commit can rebase cleanly.
          git restore --worktree -- data/market
          git clean -fd -- data/market
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 3
          done
          test "${pushed}" = "1"
