name: Verify Decision Top10 Observations

on:
  schedule:
    - cron: "15,45 8-9 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；完成真实结算和校验但不提交"
        required: true
        default: true
        type: boolean
      as_of_date:
        description: "校验日期 YYYYMMDD（留空=北京时间今天）"
        required: false
        type: string
      from_exec_date:
        description: "累计验证起始T日 YYYYMMDD"
        required: false
        default: "20260721"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Read-only settle and validate observation truth
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      has_changes: ${{ steps.candidate.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dry-run mode and immutable base
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${INPUT_DRY_RUN:-true}" != false ]; then publish=false; fi
          git rev-parse HEAD > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Require active production freeze and enforced pins for real publication
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from top10decision.decision.model_freeze import load_model_freeze, model_freeze_active, validate_pinned_files
          root=Path('.').resolve(); manifest=load_model_freeze(root, required=True)
          active=model_freeze_active(manifest)
          if os.environ['PUBLISH'] == 'true' and not active: raise SystemExit('real Verify publication requires active Decision freeze')
          audit=validate_pinned_files(root, manifest, force_enforcement=not active)
          if audit.get('enforced') is not True: raise SystemExit('Verify preflight did not enforce frozen pins')
          PY
      - name: Resolve strict exchange session
        id: session
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          INPUT_DATE: ${{ inputs.as_of_date }}
        run: |
          set -euo pipefail
          python scripts/sync_tushare_minute.py --calendar-only
          as_of="${INPUT_DATE:-$(TZ=Asia/Shanghai date +%Y%m%d)}"
          echo "${as_of}" | grep -Eq '^[0-9]{8}$'
          echo "as_of_date=${as_of}" >> "${GITHUB_OUTPUT}"
          set +e
          python scripts/verify_decision_observations.py --check-trading-date "${as_of}"
          status=$?
          set -e
          if [ "${status}" = 0 ]; then echo 'is_open=true' >> "${GITHUB_OUTPUT}"; elif [ "${status}" = 3 ]; then echo 'is_open=false' >> "${GITHUB_OUTPUT}"; else exit "${status}"; fi
      - name: Resolve immutable market upstream commit
        id: upstream
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          token = os.environ.get('GH_API_TOKEN', '').strip()
          if not token: raise SystemExit('GITHUB_TOKEN is required to resolve immutable market commit')
          request = Request(
              'https://api.github.com/repos/njedu2023-prog/a-share-top3-data/commits/main',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
          )
          with urlopen(request, timeout=30) as response:
              payload = json.load(response)
          sha = str(payload.get('sha') or '').strip().lower()
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              raise SystemExit('failed to resolve immutable commit for njedu2023-prog/a-share-top3-data@main')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'market_sha={sha}\n')
          PY
      - name: Sync all same-date truth without optional bypass
        id: truth_sync
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          MARKET_RAW_COMMIT: ${{ steps.upstream.outputs.market_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
        run: |
          set -euo pipefail
          python scripts/sync_market_raw.py --trade-date "${AS_OF_DATE}"
          python scripts/sync_tushare_daily_close.py --trade-date "${AS_OF_DATE}"
          minute_evidence="${RUNNER_TEMP}/verify-minute-sync.json"
          minute_args=(--trade-date "${AS_OF_DATE}" --max-codes 120 --timeout-seconds 8 --workers 6)
          if [ "${AS_OF_DATE}" = "$(TZ=Asia/Shanghai date +%Y%m%d)" ]; then minute_args+=(--post-close-truth); fi
          python scripts/sync_tushare_minute.py "${minute_args[@]}" > "${minute_evidence}"
          MINUTE_EVIDENCE="${minute_evidence}" python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          payload = json.loads(Path(os.environ['MINUTE_EVIDENCE']).read_text(encoding='utf-8'))
          if not isinstance(payload, dict): raise SystemExit('Verify minute evidence must be one JSON object')
          as_of = os.environ['AS_OF_DATE']
          trade_date = payload.get('trade_date')
          status, reason, active = payload.get('status'), payload.get('reason'), payload.get('active_window')
          if trade_date != as_of: raise SystemExit(f'Verify minute evidence date mismatch: {trade_date!r} != {as_of!r}')
          if type(active) is not bool: raise SystemExit('Verify active_window must be a JSON boolean')
          counts = {}
          for key in ('candidate_codes', 'minute_files_written'):
              value = payload.get(key, 0)
              if type(value) is not int or value < 0:
                  raise SystemExit(f'Verify {key} must be a non-negative JSON integer')
              counts[key] = value
          today = datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y%m%d')
          if as_of != today:
              if status != 'not_applicable' or reason != 'non_current_trade_date' or active or counts['minute_files_written'] != 0:
                  raise SystemExit('prior-date Verify minute sync must be explicitly non_current_trade_date')
          else:
              allowed = {('success', 'post_close_truth_success'), ('partial_success', 'post_close_truth_partial')}
              if (status, reason) not in allowed or counts['candidate_codes'] == 0 or counts['minute_files_written'] == 0:
                  raise SystemExit('current post-close Verify minute sync produced no valid rows')
          complete = as_of != today or (status, reason) == ('success', 'post_close_truth_success')
          github_output = os.environ.get('GITHUB_OUTPUT', '')
          if github_output:
              with Path(github_output).open('a', encoding='utf-8') as output:
                  output.write(f"complete={'true' if complete else 'false'}\n")
          PY
      - name: Validate frozen runtime in an isolated exact-base worktree
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/verify-runtime"
          git worktree add --detach "${runtime_root}" "$(cat "${RUNNER_TEMP}/base_sha.txt")" >/dev/null
          cleanup() { git worktree remove --force "${runtime_root}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/run_deterministic_numeric.py" \
            "${runtime_root}/scripts/replay_frozen_canonical_v2.py" \
            --root "${runtime_root}" \
            --report "${RUNNER_TEMP}/verify-frozen-replay.json" >/dev/null
          if [ "${PUBLISH}" = "true" ]; then
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime
          else
            PYTHONPATH="${runtime_root}/src" python "${runtime_root}/scripts/validate_decision_model_freeze.py" \
              --root "${runtime_root}" --runtime --force-inactive
          fi
      - name: Settle observation truth without changing action ownership
        if: ${{ steps.session.outputs.is_open == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          FROM_EXEC_DATE: ${{ inputs.from_exec_date || '20260721' }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all -- outputs/decision)"
          python scripts/verify_decision_observations.py --from-exec-date "${FROM_EXEC_DATE}"
          test -f outputs/auction_v3/verification/observation_latest.csv
          test -f outputs/auction_v3/metrics/observation_cumulative_latest.json
          python -m json.tool outputs/auction_v3/metrics/observation_cumulative_latest.json >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all -- outputs/decision)"
      - name: Settle immutable executable-profit Shadow truth and project exact as-of
        if: ${{ steps.session.outputs.is_open == 'true' && steps.truth_sync.outputs.complete == 'true' }}
        env:
          AS_OF_DATE: ${{ steps.session.outputs.as_of_date }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          audit_before="${RUNNER_TEMP}/executable-profit-verify-before.json"
          eligible_dates="${RUNNER_TEMP}/executable-profit-eligible-dates.txt"
          latest_date="${RUNNER_TEMP}/executable-profit-latest-date.txt"
          contract_mode="${RUNNER_TEMP}/executable-profit-contract-mode.txt"
          AUDIT_BEFORE="${audit_before}" \
            ELIGIBLE_DATES="${eligible_dates}" \
            LATEST_DATE="${latest_date}" \
            CONTRACT_MODE="${contract_mode}" \
            python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          from top10decision.decision.executable_profit_shadow_settlement import (
              load_selection,
          )
          from top10decision.decision.executable_profit_shadow import (
              _validate_existing_pointer_chain,
              validate_internal_forward_shadow_index,
          )
          from scripts.publish_primary_profit_rankings import MIXED_INDEX_SCHEMA
          from top10decision.decision.primary_profit_forward_shadow_bridge import (
              validate_primary_profit_forward_shadow_index,
              validate_primary_profit_forward_shadow_repository_chain,
          )

          root = Path('.').resolve()
          as_of_date = os.environ['AS_OF_DATE']
          if re.fullmatch(r'20\d{6}', as_of_date) is None:
              raise SystemExit('Verify executable-profit as-of date is invalid')

          def inventory(patterns):
              result = {}
              for pattern in patterns:
                  for path in sorted(root.glob(pattern)):
                      if not path.is_file() or path.is_symlink():
                          raise SystemExit(f'Verify executable-profit input is unsafe: {path}')
                      result[path.relative_to(root).as_posix()] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()
              return result

          before = {
              'selections': inventory(
                  ['data/decision_executable_profit/forward/selections/shadow_20??????.json',
                   'data/decision_executable_profit/forward/selections/shadow_20??????.csv']
              ),
              'truth': inventory(
                  ['data/decision_executable_profit/forward/verifications/t_verification_20??????.json',
                   'data/decision_executable_profit/forward/settlements/settlement_20??????.json']
              ),
              'actions': inventory(
                  ['outputs/decision/action_plan_*.json', 'outputs/decision/report_index.json']
              ),
              'primary_projection': inventory(
                  ['outputs/decision/executable_profit_research/index.json',
                   'outputs/decision/executable_profit_research/projection_20??????.json',
                   'outputs/decision/executable_profit_research/projection_20??????.csv']
              ),
              'public_shadow_states': inventory(
                  ['outputs/decision/executable_profit_research/shadow_state_20??????_asof_20??????.json']
              ),
          }
          Path(os.environ['AUDIT_BEFORE']).write_text(
              json.dumps(before, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          selection_root = root / 'data/decision_executable_profit/forward/selections'
          targets = []
          all_signal_dates = []
          if selection_root.exists():
              if not selection_root.is_dir() or selection_root.is_symlink():
                  raise SystemExit('Verify executable-profit selection root is unsafe')
              for path in sorted(selection_root.glob('shadow_20??????.json')):
                  match = re.fullmatch(r'shadow_(20\d{6})\.json', path.name)
                  if match is None:
                      raise SystemExit(f'Verify executable-profit selection name is invalid: {path.name}')
                  signal_date = match.group(1)
                  _, payload, _ = load_selection(root, signal_date)
                  if payload.get('signal_date') != signal_date:
                      raise SystemExit('Verify executable-profit selection date binding drifted')
                  selection_csv = selection_root / f'shadow_{signal_date}.csv'
                  downloads = payload.get('downloads')
                  if (
                      not selection_csv.is_file()
                      or selection_csv.is_symlink()
                      or not isinstance(downloads, dict)
                      or downloads.get('csv_url')
                      != (
                          'data/decision_executable_profit/forward/selections/'
                          f'shadow_{signal_date}.csv'
                      )
                      or downloads.get('csv_sha256')
                      != hashlib.sha256(selection_csv.read_bytes()).hexdigest()
                  ):
                      raise SystemExit('Verify executable-profit selection CSV binding drifted')
                  all_signal_dates.append(signal_date)
                  if signal_date <= as_of_date:
                      settlement_path = (
                          root
                          / 'data/decision_executable_profit/forward/settlements'
                          / f'settlement_{signal_date}.json'
                      )
                      if settlement_path.exists():
                          if not settlement_path.is_file() or settlement_path.is_symlink():
                              raise SystemExit('Verify executable-profit settlement is unsafe')
                      else:
                          targets.append(signal_date)
          if len(targets) != len(set(targets)):
              raise SystemExit('Verify executable-profit target selection is duplicated')
          latest = ''
          primary_mode = False
          if all_signal_dates:
              public_index_path = root / 'outputs/decision/executable_profit_research/index.json'
              public_index = json.loads(public_index_path.read_text(encoding='utf-8'))
              primary_mode = public_index.get('schema_version') == MIXED_INDEX_SCHEMA
              index_path = selection_root / (
                  'primary_mixed_index.json' if primary_mode else 'index.json'
              )
              if not index_path.is_file() or index_path.is_symlink():
                  raise SystemExit('Verify executable-profit selection index is unsafe')
              index = json.loads(index_path.read_text(encoding='utf-8'))
              if primary_mode:
                  validate_primary_profit_forward_shadow_index(index)
                  validate_primary_profit_forward_shadow_repository_chain(
                      root,
                      str(index['latest_signal_date']),
                  )
              else:
                  validate_internal_forward_shadow_index(index)
                  _validate_existing_pointer_chain(root, index)
              latest = str(index['latest_signal_date'])
              if latest != max(all_signal_dates):
                  raise SystemExit('Verify executable-profit selection index is not latest D')
              if latest > as_of_date:
                  raise SystemExit('Verify as-of date predates the current frozen selection index')
          Path(os.environ['ELIGIBLE_DATES']).write_text(
              ''.join(f'{value}\n' for value in targets),
              encoding='ascii',
          )
          Path(os.environ['LATEST_DATE']).write_text(
              (latest + '\n') if latest else '',
              encoding='ascii',
          )
          Path(os.environ['CONTRACT_MODE']).write_text(
              ('primary\n' if primary_mode else 'legacy\n'),
              encoding='ascii',
          )
          PY
          if [ -s "${latest_date}" ]; then
            if [ -s "${eligible_dates}" ]; then
              while IFS= read -r signal_date; do
                test -n "${signal_date}"
                python scripts/settle_decision_executable_profit_forward_shadow.py \
                  --root "${GITHUB_WORKSPACE}" \
                  --signal-date "${signal_date}" \
                  --as-of-date "${AS_OF_DATE}"
              done < "${eligible_dates}"
            fi
            signal_date="$(tr -d '\n' < "${latest_date}")"
            test -n "${signal_date}"
            if [ "$(tr -d '\n' < "${contract_mode}")" = primary ]; then
              SIGNAL_DATE="${signal_date}" PYTHONPATH="${GITHUB_WORKSPACE}/src" python - <<'PY'
              import os
              from pathlib import Path
              from top10decision.decision.primary_profit_forward_shadow_bridge import (
                  project_primary_profit_forward_shadow_state,
                  validate_primary_profit_forward_shadow_repository_chain,
              )
              root=Path('.').resolve(strict=True)
              d=os.environ['SIGNAL_DATE']
              project_primary_profit_forward_shadow_state(root,d,os.environ['AS_OF_DATE'])
              validate_primary_profit_forward_shadow_repository_chain(root,d)
              PY
            else
              python scripts/settle_decision_executable_profit_forward_shadow.py \
                --root "${GITHUB_WORKSPACE}" \
                --as-of-date "${AS_OF_DATE}" \
                --statistics-only
              python scripts/project_decision_executable_profit_research.py \
                --root "${GITHUB_WORKSPACE}" \
                --signal-date "${signal_date}" \
                --as-of-date "${AS_OF_DATE}"
            fi
          fi
          AUDIT_BEFORE="${audit_before}" \
            ELIGIBLE_DATES="${eligible_dates}" \
            LATEST_DATE="${latest_date}" \
            CONTRACT_MODE="${contract_mode}" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from top10decision.decision.executable_profit_research_projection import (
              validate_research_projection,
              validate_research_projection_index,
              validate_shadow_statistics_projection,
          )
          from top10decision.decision.executable_profit_shadow_settlement import (
              validate_statistics,
              validate_t1_settlement,
              validate_t_verification,
          )
          from scripts.publish_primary_profit_rankings import MIXED_INDEX_SCHEMA
          from top10decision.decision.primary_profit_forward_shadow_bridge import (
              validate_primary_profit_forward_shadow_repository_chain,
          )

          root = Path('.').resolve()
          as_of_date = os.environ['AS_OF_DATE']
          before = json.loads(Path(os.environ['AUDIT_BEFORE']).read_text(encoding='utf-8'))
          targets = [
              value.strip()
              for value in Path(os.environ['ELIGIBLE_DATES']).read_text(encoding='ascii').splitlines()
              if value.strip()
          ]
          latest = Path(os.environ['LATEST_DATE']).read_text(encoding='ascii').strip()
          primary_mode = (
              Path(os.environ['CONTRACT_MODE']).read_text(encoding='ascii').strip()
              == 'primary'
          )

          def inventory(patterns):
              result = {}
              for pattern in patterns:
                  for path in sorted(root.glob(pattern)):
                      if not path.is_file() or path.is_symlink():
                          raise SystemExit(f'Verify executable-profit output is unsafe: {path}')
                      result[path.relative_to(root).as_posix()] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()
              return result

          after_selections = inventory(
              ['data/decision_executable_profit/forward/selections/shadow_20??????.json',
               'data/decision_executable_profit/forward/selections/shadow_20??????.csv']
          )
          if after_selections != before['selections']:
              raise SystemExit('Verify rewrote or created an executable-profit selection')
          after_actions = inventory(
              ['outputs/decision/action_plan_*.json', 'outputs/decision/report_index.json']
          )
          if after_actions != before['actions']:
              raise SystemExit('Verify executable-profit settlement modified formal action ownership')
          if primary_mode:
              after_primary = inventory(
                  ['outputs/decision/executable_profit_research/index.json',
                   'outputs/decision/executable_profit_research/projection_20??????.json',
                   'outputs/decision/executable_profit_research/projection_20??????.csv']
              )
              if after_primary != before['primary_projection']:
                  raise SystemExit(
                      'P1 primary projection/index bytes changed during Verify'
                  )

          after_truth = inventory(
              ['data/decision_executable_profit/forward/verifications/t_verification_20??????.json',
               'data/decision_executable_profit/forward/settlements/settlement_20??????.json']
          )
          for relative, digest in before['truth'].items():
              if after_truth.get(relative) != digest:
                  raise SystemExit(f'Verify rewrote immutable Shadow truth: {relative}')
          additions = set(after_truth) - set(before['truth'])
          allowed_additions = {
              f'data/decision_executable_profit/forward/{kind}/{prefix}_{signal_date}.json'
              for signal_date in targets
              for kind, prefix in (
                  ('verifications', 't_verification'),
                  ('settlements', 'settlement'),
              )
          }
          if not additions.issubset(allowed_additions):
              raise SystemExit(f'Verify created foreign Shadow truth: {sorted(additions)}')
          for relative in sorted(after_truth):
              payload = json.loads((root / relative).read_text(encoding='utf-8'))
              if '/verifications/' in relative:
                  validate_t_verification(payload)
              else:
                  validate_t1_settlement(payload)

          if latest and primary_mode:
              validate_primary_profit_forward_shadow_repository_chain(root, latest)
              public_root = root / 'outputs/decision/executable_profit_research'
              primary_index = json.loads(
                  (public_root / 'index.json').read_text(encoding='utf-8')
              )
              if primary_index.get('schema_version') != MIXED_INDEX_SCHEMA:
                  raise SystemExit('Verify primary mode lost P1 main index schema')
              shadow_index = json.loads(
                  (public_root / 'shadow_index.json').read_text(encoding='utf-8')
              )
              state_path = root / str(shadow_index['latest_state_url'])
              state = json.loads(state_path.read_text(encoding='utf-8'))
              if (
                  shadow_index.get('latest_signal_date') != latest
                  or shadow_index.get('latest_as_of_date') != as_of_date
                  or shadow_index.get('latest_mixed_projection_sha256')
                  != primary_index.get('latest_projection_json_sha256')
                  or state.get('signal_date') != latest
                  or state.get('as_of_date') != as_of_date
              ):
                  raise SystemExit('Verify P1 Shadow sidecar D/as-of/SHA binding drifted')
              after_states = inventory(
                  ['outputs/decision/executable_profit_research/shadow_state_20??????_asof_20??????.json']
              )
              for relative, digest in before['public_shadow_states'].items():
                  if after_states.get(relative) != digest:
                      raise SystemExit(f'Verify rewrote immutable P1 Shadow state: {relative}')
              additions = set(after_states) - set(before['public_shadow_states'])
              expected_addition = {
                  f'outputs/decision/executable_profit_research/shadow_state_{latest}_asof_{as_of_date}.json'
              }
              if not additions.issubset(expected_addition):
                  raise SystemExit(f'Verify created foreign P1 Shadow state: {sorted(additions)}')
          elif latest:
              summary = json.loads(
