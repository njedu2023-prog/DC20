name: DC2.0 · Diagnose Frozen Fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  diagnose:
    name: Read-only frozen replay and component hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install current runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check

      - name: Validate canonical fingerprint unit contract
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest tests.test_canonical_fingerprint -v

      - name: Validate immutable freeze inputs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py

      - name: Snapshot persisted reference artifacts
        run: |
          set -euo pipefail
          reference_dir="${RUNNER_TEMP}/dc20-fingerprint-reference"
          mkdir -p "${reference_dir}"
          check_and_copy() {
            expected="$1"
            source="$2"
            destination="$3"
            actual="$(git hash-object "${source}")"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::Untrusted persisted reference blob for ${source}: ${actual}"
              exit 1
            fi
            cp "${source}" "${destination}"
          }
          check_and_copy "1bbebbbe4a3b94c0a95fd64f4e27b242ea5b0222" \
            outputs/auction_v3/metrics/backtest_top10_latest.csv \
            "${reference_dir}/backtest_top10_latest.csv"
          check_and_copy "6afd29e31cf98c434ac6e67183f7005a89663a49" \
            outputs/auction_v3/metrics/backtest_trade_selector_oos_latest.csv \
            "${reference_dir}/backtest_trade_selector_oos_latest.csv"
          check_and_copy "e27511643fc5aa1ee5bdb60f1d3b15b7e90adef4" \
            outputs/auction_v3/metrics/backtest_latest.json \
            "${reference_dir}/backtest_latest.json"
          check_and_copy "9fee4a2bc9904bf703a292b5df3c367c4c39712b" \
            outputs/auction_v3/models/model_meta_latest.json \
            "${reference_dir}/model_meta_latest.json"
          echo "FINGERPRINT_REFERENCE_DIR=${reference_dir}" >> "${GITHUB_ENV}"
          echo "FINGERPRINT_REPLAY_REPORT=${RUNNER_TEMP}/dc20-canonical-v2-replay.json" >> "${GITHUB_ENV}"

      - name: Force exact frozen snapshot through canonical V2 and publish workspace action plan
        id: replay
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python scripts/replay_frozen_canonical_v2.py \
            --root "${GITHUB_WORKSPACE}" \
            --reference-dir "${FINGERPRINT_REFERENCE_DIR}" \
            --reference-profile persisted-c6 \
            --report "${FINGERPRINT_REPLAY_REPORT}"

      - name: Print non-sensitive component and behavior hashes
        id: probe
        continue-on-error: true
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/diagnose_decision_fingerprint.py

      - name: Report replay outcome and enforce honest status
        if: ${{ always() }}
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          {
            echo "### DC2.0 forced frozen canonical V2 diagnostic"
            echo "- replay outcome: ${REPLAY_OUTCOME}"
            echo "- invariant probe outcome: ${PROBE_OUTCOME}"
            echo "- component evidence: printed in the previous step"
            echo "- canonical gate: q8 hard; q6/q10/q12 audit-only"
            echo "- execution mode: raw float64 preserved"
            echo "- repository publication: disabled; action plan was generated only in runner workspace"
          } >> "${GITHUB_STEP_SUMMARY}"
          failed=0
          if [ "${REPLAY_OUTCOME}" != "success" ]; then
            echo "::error::Forced frozen canonical V2 replay failed. See reference, behavior, policy, and action evidence above."
            failed=1
          fi
          if [ "${PROBE_OUTCOME}" != "success" ]; then
            echo "::error::A frozen invariant, strict schema, identity, or discrete behavior gate failed."
            failed=1
          fi
          exit "${failed}"
