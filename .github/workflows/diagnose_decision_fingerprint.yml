name: DC2.0 · Diagnose Frozen Fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  diagnose:
    name: Read-only frozen replay and component hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install current runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check

      - name: Validate canonical fingerprint unit contract
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest tests.test_canonical_fingerprint -v

      - name: Validate shared C3 activation evidence contract
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/diagnose_decision_fingerprint.py --self-test-evidence-contract > /dev/null

      - name: Validate immutable freeze inputs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py > /dev/null 2>&1

      - name: Snapshot persisted reference artifacts
        run: |
          set -euo pipefail
          reference_dir="${RUNNER_TEMP}/dc20-fingerprint-reference"
          mkdir -p "${reference_dir}"
          check_and_copy() {
            expected="$1"
            source="$2"
            destination="$3"
            actual="$(git hash-object "${source}")"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::persisted_reference_blob_verified=false"
              exit 1
            fi
            cp "${source}" "${destination}"
          }
          check_and_copy "1bbebbbe4a3b94c0a95fd64f4e27b242ea5b0222" \
            outputs/auction_v3/metrics/backtest_top10_latest.csv \
            "${reference_dir}/backtest_top10_latest.csv"
          check_and_copy "6afd29e31cf98c434ac6e67183f7005a89663a49" \
            outputs/auction_v3/metrics/backtest_trade_selector_oos_latest.csv \
            "${reference_dir}/backtest_trade_selector_oos_latest.csv"
          check_and_copy "e27511643fc5aa1ee5bdb60f1d3b15b7e90adef4" \
            outputs/auction_v3/metrics/backtest_latest.json \
            "${reference_dir}/backtest_latest.json"
          check_and_copy "9fee4a2bc9904bf703a292b5df3c367c4c39712b" \
            outputs/auction_v3/models/model_meta_latest.json \
            "${reference_dir}/model_meta_latest.json"
          echo "FINGERPRINT_REFERENCE_DIR=${reference_dir}" >> "${GITHUB_ENV}"
          echo "FINGERPRINT_REPLAY_REPORT=${RUNNER_TEMP}/dc20-canonical-v2-replay.json" >> "${GITHUB_ENV}"
          echo "FINGERPRINT_EVIDENCE_OUTPUT=${RUNNER_TEMP}/dc20-canonical-v2-evidence.json" >> "${GITHUB_ENV}"

      - name: Force exact frozen snapshot through canonical V2 and publish workspace action plan
        id: replay
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python scripts/replay_frozen_canonical_v2.py \
            --root "${GITHUB_WORKSPACE}" \
            --reference-dir "${FINGERPRINT_REFERENCE_DIR}" \
            --reference-profile persisted-c6 \
            --report "${FINGERPRINT_REPLAY_REPORT}" > /dev/null 2>&1

      - name: Validate post-replay production runtime contract
        id: runtime
        continue-on-error: true
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          schema="$(python -c 'import json; print(json.load(open("models/decision_model_freeze.json", encoding="utf-8")).get("schema_version", ""))')"
          if [ "${schema}" = "decision_model_freeze_v2" ]; then
            if python -c 'import json; raise SystemExit(0 if json.load(open("models/decision_model_freeze.json", encoding="utf-8")).get("active") is True else 1)'; then
              python scripts/validate_decision_model_freeze.py --runtime > /dev/null 2>&1
            else
              python scripts/validate_decision_model_freeze.py --runtime --force-inactive > /dev/null 2>&1
            fi
          elif [ "${schema}" = "decision_model_freeze_v1" ]; then
            # One-time exact V1 bootstrap only. It cannot authorize a writer;
            # the next inactive V2 head must pass the full runtime validator.
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path("models/decision_model_freeze.json")
          expected_manifest_sha = "87605814bce9f2180e151ed91d6c16e2c22b46c3dcd147e8bdab7895c3f0975a"
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != expected_manifest_sha:
              raise SystemExit("legacy bootstrap manifest is not the reviewed exact V1 bytes")
          report = json.loads(
              Path(os.environ["FINGERPRINT_REPLAY_REPORT"]).read_text(encoding="utf-8")
          )
          golden = report.get("golden") or {}
          history = report.get("history") or {}
          runtime = report.get("runtime_validation") or {}
          fingerprint = golden.get("fingerprint_integrity") or {}
          prediction = golden.get("prediction_policy_execution") or {}
          action = golden.get("action_plan_candidates") or {}
          checks = {
              "report_pass": report.get("status") == "pass",
              "golden_pass": golden.get("status") == "pass",
              "exact_v1_loader": history.get("loader_contract") == "one_time_exact_v1_no_live_fallback",
              "no_live_history": history.get("live_history_fallback") is False,
              "legacy_runtime_marker": runtime == {"validated": False, "legacy_bootstrap_only": True},
              "live_policy_exact": fingerprint.get("live_policies_match_fingerprint_projection") is True,
              "prediction_rows": prediction.get("rows") == 51,
              "prediction_domain": prediction.get("selector_domain_rows") == 9,
              "prediction_outside": prediction.get("selector_outside_rows") == 42,
              "action_rows": action.get("rows") == 9,
              "action_shadow": action.get("shadow_only_count") == 2,
              "action_formal_zero": action.get("formal_buy_count") == 0,
              "action_weights_zero": action.get("all_target_weights_zero") is True,
          }
          failed = sorted(name for name, passed in checks.items() if passed is not True)
          if failed:
              raise SystemExit("exact V1 bootstrap replay checks failed: " + ", ".join(failed))
          PY
          else
            echo "unsupported freeze schema in post-replay runtime gate: ${schema}" >&2
            exit 1
          fi

      - name: Publish strict allowlisted activation evidence
        id: evidence
        continue-on-error: true
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/diagnose_decision_fingerprint.py

      - name: Report replay outcome and enforce honest status
        if: ${{ always() }}
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          {
            echo "### DC2.0 forced frozen canonical V2 diagnostic"
            echo "- replay outcome: ${REPLAY_OUTCOME}"
            echo "- post-replay runtime outcome: ${RUNTIME_OUTCOME}"
            echo "- activation evidence outcome: ${EVIDENCE_OUTCOME}"
            echo "- activation evidence: one strict allowlisted JSON line in the previous step"
            echo "- canonical gate: q8 hard; q6/q10/q12 audit-only"
            echo "- execution mode: raw float64 preserved"
            echo "- excluded from evidence: secrets, raw rows, stock records, environment dumps, and absolute paths"
            echo "- repository publication: disabled; action plan was generated only in runner workspace"
          } >> "${GITHUB_STEP_SUMMARY}"
          failed=0
          if [ "${REPLAY_OUTCOME}" != "success" ]; then
            echo "::error::Forced frozen canonical V2 replay failed. Review the named invariant checks without disclosing the runner-temp evidence payload."
            failed=1
          fi
          if [ "${RUNTIME_OUTCOME}" != "success" ]; then
            echo "::error::Post-replay production runtime validation failed."
            failed=1
          fi
          if [ "${EVIDENCE_OUTCOME}" != "success" ]; then
            echo "::error::Activation evidence publication or a frozen invariant, strict schema, identity, or discrete behavior gate failed."
            failed=1
          fi
          exit "${failed}"
