name: DC20 daily Top2 delivery watchdog
on:
  workflow_run:
    # Controlled P0 completion wakes the existing inspector; cron recovery is unchanged.
    workflows: ['DC2.0 · Publish Primary D List (P0)']
    branches: [main]
    types: [completed]
  schedule:
    # Independent recovery ticks, Beijing 20:07 through next-day 09:07.
    # Existing P0, model, settlement and nightly research schedules are unchanged.
    - cron: '7,27,47 12-23,0 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only delivery check, never dispatch recovery'
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - scripts/candidate_delivery_watchdog.py
      - scripts/candidate_runtime_preflight.py
      - scripts/dc20_writer_queue.py
      - tests/test_candidate_delivery_watchdog.py
      - tests/test_candidate_watchdog_code_approval.py
      - tests/test_candidate_delivery_missing_p0.py
      - tests/test_dc20_writer_queue.py
      - .github/workflows/candidate_delivery_watchdog.yml
permissions:
  contents: read
concurrency:
  group: dc20-delivery-watchdog
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name != 'workflow_run' ||
       (github.event.action == 'completed' && github.event.workflow_run.status == 'completed' &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
        github.event.workflow_run.workflow_id == 343703608 && github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.path == '.github/workflows/run_primary_d_daily.yml' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        startsWith(github.event.workflow_run.display_title, 'DC20 controlled daily NATURAL | D=')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - run: PYTHONPATH=.:src python -m pytest -q tests/test_candidate_delivery_watchdog.py tests/test_candidate_watchdog_code_approval.py tests/test_candidate_delivery_missing_p0.py tests/test_dc20_writer_queue.py
      - name: Check live queue without dispatch on push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dc20_writer_queue.py
          --signal-date "$(TZ=Asia/Shanghai date +%Y%m%d)"
          --workflow run_primary_d_daily.yml
  recover:
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover at most one missing stage, or explicitly fail on missing source/deadline/retry exhaustion
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.dry_run == false }}
        run: |
          args=()
          if [ "$EXECUTE" = "true" ]; then args+=(--execute); fi
          python3 scripts/candidate_delivery_watchdog.py "${args[@]}"

