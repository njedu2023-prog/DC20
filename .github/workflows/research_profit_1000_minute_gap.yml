name: DC20 · rejected minute table diagnostic (read only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/MINUTE_GAP_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: dc20-profit-1000-minute-gap-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  probe:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Test exact diagnostic without credentials or network
        run: |
          set -euo pipefail
          python -m unittest discover -s work/profit_1000_upgrade -p 'test_minute_gap_probe.py' -v
          python -m unittest discover -s work/profit_1000_upgrade -p 'test_auction_truth.py' -v
          python -m unittest discover -s work/profit_1000_upgrade -p 'test_minute_truth.py' -v
      - name: Diagnose six rejected stock sessions without relaxing minute validation
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python work/profit_1000_upgrade/minute_gap_probe.py
          --output "${RUNNER_TEMP}/dc20-profit-1000-minute-gap"
      - name: Verify checkout unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Save original safe tables and strict diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-profit-1000-minute-gap-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-profit-1000-minute-gap
          if-no-files-found: warn
          retention-days: 30
