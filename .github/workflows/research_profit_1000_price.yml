name: DC20 · auction price source probe (read only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/PRICE_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: dc20-profit-1000-price-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  probe:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"
      - name: Test exact diagnostic without credentials or network
        run: python -m unittest discover -s work/profit_1000_upgrade -p 'test_price_probe.py' -v
      - name: Compare four exact stock sessions across three endpoints (maximum twelve calls)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python work/profit_1000_upgrade/price_probe.py
          --output "${RUNNER_TEMP}/dc20-profit-1000-price"
      - name: Verify checkout unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Save raw data tables and comparison without changing entry policy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dc20-profit-1000-price-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-profit-1000-price
          if-no-files-found: warn
          retention-days: 30
