name: DC20 · Fixed candidate natural forward (research)

on:
  workflow_run:
    workflows:
      - DC2.0 · Publish Primary D List (P0)
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      p0_run_id:
        description: "已成功自然发布本日名单的原始 P0 run ID；不接受历史恢复"
        required: true
        type: string
      original_generation_run_id:
        description: "仅原生成 CAS 成功而部署失败时，填写原始受控 P0 run ID；须与原 CAS 成对"
        required: false
        type: string
      original_cas_commit:
        description: "原生成 run 唯一 CAS 提交的完整 40 位 SHA；p0_run_id 必须为后继自然复用成功 run"
        required: false
        type: string
      dry_run:
        description: "只读演练，不提交新模型研究冻表"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/research_candidate_natural_forward.yml"
      - "work/profit_1000_upgrade/candidate_natural_*.py"
      - "work/profit_1000_upgrade/candidate_p0_generation_artifact.py"
      - "tests/test_candidate_p0_generation_artifact.py"
      - "tests/test_candidate_continuation_evidence.py"
      - "work/profit_1000_upgrade/test_candidate_natural_*.py"
      - "work/profit_1000_upgrade/candidate_natural_forward_registration.json"
      - "work/profit_1000_upgrade/candidate_natural_model/evaluation.json"

permissions:
  contents: read

concurrency:
  group: dc20-candidate-natural-research-${{ github.event_name == 'push' && github.run_id || 'daily' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

jobs:
  validate:
    name: Validate fixed natural candidate contracts
    permissions:
      actions: read
      contents: read
    outputs:
      needs_freeze: ${{ steps.trigger.outputs.needs_work }}
    if: >-
      github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.workflow_id == 343703608 && github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.path == '.github/workflows/run_primary_d_daily.yml' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact main code without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"
      - name: Install hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Validate new components and unchanged formal freeze
        run: |
          python -m pytest -q -p no:cacheprovider work/profit_1000_upgrade/candidate_natural_forward_test.py work/profit_1000_upgrade/test_candidate_natural_p0_github.py work/profit_1000_upgrade/test_candidate_natural_workflow.py work/profit_1000_upgrade/test_candidate_natural_trigger_gate.py work/profit_1000_upgrade/test_candidate_natural_p0_continuation.py tests/test_candidate_p0_generation_artifact.py tests/test_candidate_continuation_evidence.py
          python scripts/validate_decision_model_freeze.py --root .
          test -z "$(git status --porcelain=v1)"
      - name: Check whether original P0 needs a new candidate freeze
        id: trigger
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          DC20_CANDIDATE_GITHUB_TOKEN: ${{ github.token }}
          P0_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.p0_run_id }}
          ORIGINAL_GENERATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.original_generation_run_id || '' }}
          ORIGINAL_CAS_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.original_cas_commit || '' }}
        run: |
          args=(p0 --run-id "$P0_RUN_ID" --receipt "$RUNNER_TEMP/candidate-preflight.json")
          if [ -n "$ORIGINAL_GENERATION_RUN_ID" ] || [ -n "$ORIGINAL_CAS_COMMIT" ]; then
            args+=(--original-generation-run-id "$ORIGINAL_GENERATION_RUN_ID" --original-cas-commit "$ORIGINAL_CAS_COMMIT")
          fi
          python -m work.profit_1000_upgrade.candidate_natural_trigger_gate "${args[@]}"
      - name: Preserve read-only trigger classification
        if: always() && steps.trigger.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dc20-candidate-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-preflight.json
          if-no-files-found: error
          retention-days: 90
  freeze:
    name: Freeze original P0 bound new model research slots
    needs: validate
    if: (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && needs.validate.outputs.needs_freeze == 'true'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated main code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"
      - name: Install hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Import exact original run and freeze four independent research slots
        env:
          DC20_CANDIDATE_GITHUB_TOKEN: ${{ github.token }}
          P0_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.p0_run_id }}
          ORIGINAL_GENERATION_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.original_generation_run_id || '' }}
          ORIGINAL_CAS_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.original_cas_commit || '' }}
          PUBLISH_RESEARCH: ${{ github.event_name == 'workflow_run' || inputs.dry_run == false }}
        run: |
          args=(--p0-run-id "$P0_RUN_ID" --work-parent "$RUNNER_TEMP")
          if [ -n "$ORIGINAL_GENERATION_RUN_ID" ] || [ -n "$ORIGINAL_CAS_COMMIT" ]; then
            args+=(--original-generation-run-id "$ORIGINAL_GENERATION_RUN_ID" --original-cas-commit "$ORIGINAL_CAS_COMMIT")
          fi
          if [ "$PUBLISH_RESEARCH" = "true" ]; then args+=(--publish); fi
          python -m work.profit_1000_upgrade.candidate_natural_workflow "${args[@]}"
      - name: Verify local formal files remain untouched
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain original source bindings and publication acknowledgement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dc20-candidate-natural-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dc20-candidate-natural-*
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: false
          compression-level: 6
