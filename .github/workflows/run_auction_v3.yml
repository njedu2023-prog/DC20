name: Run Decision Top10 Trade Selector V12

on:
  push:
    branches: [main]
    paths:
      - "models/decision_model_freeze.json"
      - "src/top10decision/auction_v3/**"
      - "src/top10decision/decision/**"
      - "src/top10decision/data/**"
      - "scripts/run_auction_v3.py"
      - "scripts/sync_tushare_minute.py"
      - "scripts/publish_decision_action.py"
  schedule:
    - cron: "35 1 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；完成真实计算和校验但不提交"
        required: true
        default: true
        type: boolean
      signal_date:
        description: "信号日 YYYYMMDD（留空=最新冻结候选）"
        required: false
        type: string
      order_amount:
        description: "单票计划金额（元），用于竞价容量校验"
        required: false
        default: "100000"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Read-only compute and validate Auction candidate
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
      }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      has_changes: ${{ steps.candidate.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout immutable main base without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dry-run mode and immutable base
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-true}" != "false" ]; then publish=false; fi
          git rev-parse HEAD > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -c 'import pip; assert pip.__version__ == "26.2.1", pip.__version__'
          python -m pip check
      - name: Require active production freeze and enforced pins for real publication
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from top10decision.decision.model_freeze import load_model_freeze, model_freeze_active, validate_pinned_files
          root = Path('.').resolve()
          manifest = load_model_freeze(root, required=True)
          publish = os.environ['PUBLISH'] == 'true'
          active = model_freeze_active(manifest)
          if publish and not active: raise SystemExit('real Auction publication requires active Decision freeze')
          audit = validate_pinned_files(root, manifest, force_enforcement=not active)
          if audit.get('enforced') is not True: raise SystemExit('Auction preflight did not enforce frozen pins')
          PY
      - name: Run Decision execution tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_auction_v3.py' -v
          python -m unittest discover -s tests -p 'test_decision_v8_calibration.py' -v
          python -m unittest discover -s tests -p 'test_decision_trade_selector.py' -v
          python -m unittest discover -s tests -p 'test_decision_contract.py' -v
          python -m unittest discover -s tests -p 'test_decision_model_freeze.py' -v
      - name: Sync strict calendar and minute truth
        id: minute_sync
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SIGNAL_DATE: ${{ inputs.signal_date }}
        run: |
          set -euo pipefail
          args=(--max-codes 80 --timeout-seconds 8 --workers 6)
          if [ -n "${SIGNAL_DATE}" ]; then args+=(--signal-date "${SIGNAL_DATE}"); fi
          sync_evidence="${RUNNER_TEMP}/auction-minute-sync.json"
          python scripts/sync_tushare_minute.py "${args[@]}" > "${sync_evidence}"
          SYNC_EVIDENCE="${sync_evidence}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['SYNC_EVIDENCE']).read_text(encoding='utf-8'))
          if not isinstance(payload, dict):
              raise SystemExit('Auction sync evidence must be one JSON object')
          status = payload.get('status')
          reason = payload.get('reason')
          session_open = payload.get('active_window')
          if status not in {'success', 'partial_success', 'not_applicable'}:
              raise SystemExit(f'unexpected Auction sync status: {status!r}')
          if not isinstance(reason, str) or not reason:
              raise SystemExit('Auction sync reason must be a non-empty string')
          if type(session_open) is not bool:
              raise SystemExit('Auction sync active_window must be a JSON boolean')
          counts = {}
          for key in ('candidate_codes', 'minute_files_written'):
              value = payload.get(key, 0)
              if type(value) is not int or value < 0:
                  raise SystemExit(f'Auction sync {key} must be a non-negative JSON integer')
              counts[key] = value
          valid_count = counts['minute_files_written']
          if status == 'not_applicable':
              allowed = {'exchange_closed', 'outside_active_minute_window', 'non_current_trade_date'}
              if reason not in allowed or session_open or valid_count != 0:
                  raise SystemExit('invalid not_applicable Auction sync evidence')
          else:
              allowed = {'minute_sync_success', 'minute_partial_success'}
              if reason not in allowed or not session_open or counts['candidate_codes'] == 0 or valid_count == 0:
                  raise SystemExit('open production Auction sync produced no valid minute rows')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"write_eligible={'false' if status == 'not_applicable' else 'true'}\n")
          PY
      - name: Run Auction pipeline and final runtime gates
        if: ${{ steps.minute_sync.outputs.write_eligible == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SIGNAL_DATE: ${{ inputs.signal_date }}
          ORDER_AMOUNT: ${{ inputs.order_amount || '100000' }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          args=(--order-amount "${ORDER_AMOUNT}")
          if [ -n "${SIGNAL_DATE}" ]; then echo "${SIGNAL_DATE}" | grep -Eq '^[0-9]{8}$'; args+=(--signal-date "${SIGNAL_DATE}"); fi
          python scripts/run_auction_v3.py "${args[@]}"
          python scripts/publish_decision_action.py
          if [ "${PUBLISH}" = "true" ]; then
            python scripts/validate_decision_model_freeze.py --runtime
          else
            python scripts/validate_decision_model_freeze.py --runtime --force-inactive
          fi
          python scripts/validate_io_contract.py --strict-semantic
      - name: Build exact allowlisted candidate patch
        id: candidate
        if: ${{ steps.minute_sync.outputs.write_eligible == 'true' }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- outputs/auction_v3
          git add -A -- 'outputs/decision/action_plan_*.json' outputs/decision/report_index.json
          git add -A -- models/decision_v12_frozen_history_20260805.csv.gz
          git add -A -- data/market/trade_cal_sse.csv data/market/minute_1m
          git add -A -- 'data/market/raw/**/stk_auction_o.csv' 'data/market/raw/**/stk_auction_o.meta.json'
          git add -A -- 'docs/reports/auction_v3*.html'
          git diff --cached --name-only -z > "${RUNNER_TEMP}/staged_paths.bin"
          STAGED_PATHS="${RUNNER_TEMP}/staged_paths.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed = ('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json','models/decision_v12_frozen_history_20260805.csv.gz','data/market/trade_cal_sse.csv','data/market/minute_1m/**','data/market/raw/**/stk_auction_o.csv','data/market/raw/**/stk_auction_o.meta.json','docs/reports/auction_v3*.html')
          paths = [p.decode() for p in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad = [p for p in paths if not any(fnmatch.fnmatchcase(p, pattern) for pattern in allowed)]
          if bad: raise SystemExit(f'non-allowlisted Auction paths staged: {bad}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/candidate.patch"
          CANDIDATE_PATCH="${RUNNER_TEMP}/candidate.patch" CANDIDATE_SHA="${RUNNER_TEMP}/candidate.patch.sha256" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          patch = Path(os.environ['CANDIDATE_PATCH'])
          Path(os.environ['CANDIDATE_SHA']).write_text(hashlib.sha256(patch.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PY
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi
      - name: Upload immutable candidate patch
        if: ${{ steps.minute_sync.outputs.write_eligible == 'true' && steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auction-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate.patch.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: CAS publish one Auction commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Download validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: auction-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate envelope
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['CANDIDATE_DIR'])
          expected_files = {'base_sha.txt', 'candidate.patch', 'candidate.patch.sha256'}
          if not root.is_dir() or any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate envelope is missing or contains a symlink')
          actual_files = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f'candidate envelope file set mismatch: {sorted(actual_files)}')
          base_sha = (root / 'base_sha.txt').read_text(encoding='ascii').strip()
          claimed_sha = (root / 'candidate.patch.sha256').read_text(encoding='ascii').strip()
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              raise SystemExit('invalid candidate base SHA')
          if re.fullmatch(r'[0-9a-f]{64}', claimed_sha) is None:
              raise SystemExit('invalid candidate patch SHA256')
          actual_sha = hashlib.sha256((root / 'candidate.patch').read_bytes()).hexdigest()
          if actual_sha != claimed_sha:
              raise SystemExit('candidate.patch SHA256 mismatch')
          PY
      - name: Apply candidate with base-SHA CAS and create one commit
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          git apply --index --binary "${RUNNER_TEMP}/candidate/candidate.patch"
          git diff --cached --name-only -z > "${RUNNER_TEMP}/publish_staged_paths.bin"
          PUBLISH_STAGED_PATHS="${RUNNER_TEMP}/publish_staged_paths.bin" python - <<'PY'
          import fnmatch, os
          from pathlib import Path
          allowed = ('outputs/auction_v3/**','outputs/decision/action_plan_*.json','outputs/decision/report_index.json','models/decision_v12_frozen_history_20260805.csv.gz','data/market/trade_cal_sse.csv','data/market/minute_1m/**','data/market/raw/**/stk_auction_o.csv','data/market/raw/**/stk_auction_o.meta.json','docs/reports/auction_v3*.html')
          paths = [p.decode() for p in Path(os.environ['PUBLISH_STAGED_PATHS']).read_bytes().split(b'\0') if p]
          bad = [p for p in paths if not any(fnmatch.fnmatchcase(p, pattern) for pattern in allowed)]
          if bad: raise SystemExit(f'non-allowlisted Auction publish paths staged: {bad}')
          if not paths: raise SystemExit('Auction candidate patch became empty')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: update Decision V12 trade selector and validation'
      - name: Publish exact CAS commit with minimally injected token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
