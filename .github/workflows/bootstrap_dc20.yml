name: Bootstrap DC20 Decision-only snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap_dc20.yml

permissions:
  contents: write

concurrency:
  group: dc20-decision-bootstrap
  cancel-in-progress: true

jobs:
  copy-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Copy pinned Decision snapshot through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: njedu2023-prog/top10-decision
          SOURCE_COMMIT: 8741bfabf73cf9c64e3b6808b3529457474349e2
        run: |
          python - <<'PY'
          import base64
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          source_repo = os.environ["SOURCE_REPOSITORY"]
          source_commit = os.environ["SOURCE_COMMIT"]
          target_repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com"
          marker_path = ".dc20-bootstrap-complete.json"

          if os.path.exists(marker_path):
              print("DC20 bootstrap marker already exists; nothing to do.")
              raise SystemExit(0)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "dc20-decision-bootstrap",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_json(method, path, payload=None, retries=8):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(api + path, data=body, headers=headers, method=method)
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode("utf-8", errors="replace")
                      if exc.code in (403, 429, 500, 502, 503, 504) and attempt + 1 < retries:
                          wait = int(exc.headers.get("Retry-After", "0") or 0) or min(60, 2 ** attempt)
                          print(f"GitHub API retry {attempt + 1}/{retries} after {exc.code}: {wait}s")
                          time.sleep(wait)
                          continue
                      raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          current_models = {
              "models/decision_model_freeze.json",
              "models/decision_promotion_v13_validation.json",
              "models/decision_v12_frozen_history_20260805.csv.gz",
              "models/eret_lgbm.joblib",
              "models/eret_lgbm_20260805.joblib",
              "models/eret_lr.joblib",
              "models/eret_lr_20260805.joblib",
              "models/eret_meta.json",
              "models/eret_meta_20260805.json",
              "models/pfill_lgbm.joblib",
              "models/pfill_lgbm_20260806.joblib",
              "models/pfill_lr.joblib",
              "models/pfill_lr_20260806.joblib",
              "models/pfill_meta.json",
              "models/pfill_meta_20260806.json",
          }
          market_anchors = ("20260805", "20260806", "20260807", "20260813", "20260814")
          split_history_path = (
              "data/auction_v3/history/tplus1_open_0930_v1/"
              "training_20240624_20260715.csv"
          )
          regenerated_large_outputs = {
              "outputs/auction_v3/metrics/backtest_gate_audit_latest.csv",
              "outputs/auction_v3/metrics/training_history_latest.csv",
          }

          def selected(path):
              lowered = path.lower()
              if "premium" in lowered or "__pycache__" in path or path.endswith(".pyc"):
                  return False
              if path in {"decision.html", "requirements.txt"}:
                  return True
              if path.startswith("src/top10decision/"):
                  return True
              if path.startswith("scripts/"):
                  return True
              if path.startswith("tests/") and "decision_premium_merge" not in lowered:
                  return True
              if path.startswith("data/auction_v3/"):
                  return True
              if path.startswith("data/decision/"):
                  return True
              if path.startswith("data/jq_feedback/"):
                  return True
              if path.startswith("data/pred/") and "/archive/" not in path:
                  return True
              if path == "data/market/trade_cal_sse.csv":
                  return True
              if path.startswith("data/market/raw/latest/"):
                  return True
              if path in {
                  "data/market/sample_maturity_latest.csv",
                  "data/market/sample_maturity_latest.json",
                  "data/market/minute_1m/sync_latest.json",
              }:
                  return True
              if (
                  path.startswith("data/market/")
                  and len(path.split("/")) == 3
                  and any(anchor in path for anchor in market_anchors)
              ):
                  return True
              if path in current_models:
                  return True
              if path.startswith("outputs/decision/"):
                  return True
              if path.startswith("outputs/auction_v3/"):
                  return True
              return False

          tree = api_json("GET", f"/repos/{source_repo}/git/trees/{source_commit}?recursive=1")
          if tree.get("truncated"):
              raise RuntimeError("Source tree response was truncated; refusing partial migration.")
          source_files = [
              item for item in tree.get("tree", [])
              if (
                  item.get("type") == "blob"
                  and selected(item["path"])
                  and item["path"] not in regenerated_large_outputs
              )
          ]
          source_files.sort(key=lambda item: item["path"])
          if not source_files:
              raise RuntimeError("Decision-only selection is empty.")
          bad_paths = [item["path"] for item in source_files if "premium" in item["path"].lower()]
          if bad_paths:
              raise RuntimeError(f"Premium paths selected unexpectedly: {bad_paths[:5]}")

          print(f"Selected {len(source_files)} Decision-only files ({sum(item.get('size', 0) for item in source_files)} bytes).")

          def raw_bytes(path, retries=8):
              encoded_path = urllib.parse.quote(path, safe="/")
              url = f"https://raw.githubusercontent.com/{source_repo}/{source_commit}/{encoded_path}"
              request = urllib.request.Request(url, headers={"User-Agent": "dc20-decision-bootstrap"})
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(request, timeout=300) as response:
                          return response.read()
                  except Exception:
                      if attempt + 1 == retries:
                          raise
                      time.sleep(min(60, 2 ** attempt))

          completed = 0

          def copy_blob(item):
              nonlocal_data = raw_bytes(item["path"])
              if len(nonlocal_data) != item.get("size", len(nonlocal_data)):
                  raise RuntimeError(
                      f"Size mismatch for {item['path']}: expected {item.get('size')} got {len(nonlocal_data)}"
                  )
              chunks = [(item["path"], nonlocal_data)]
              if item["path"] == split_history_path:
                  lines = nonlocal_data.splitlines(keepends=True)
                  header = lines[0]
                  chunks = []
                  current = bytearray(header)
                  part = 1
                  for line in lines[1:]:
                      if len(current) + len(line) > 7_500_000 and len(current) > len(header):
                          chunks.append((item["path"].replace(".csv", f"_part{part:03d}.csv"), bytes(current)))
                          part += 1
                          current = bytearray(header)
                      current.extend(line)
                  if len(current) > len(header):
                      chunks.append((item["path"].replace(".csv", f"_part{part:03d}.csv"), bytes(current)))

              entries = []
              for target_path, data in chunks:
                  created = api_json(
                      "POST",
                      f"/repos/{target_repo}/git/blobs",
                      {"content": base64.b64encode(data).decode("ascii"), "encoding": "base64"},
                  )
                  entries.append({
                      "path": target_path,
                      "mode": item.get("mode", "100644"),
                      "type": "blob",
                      "sha": created["sha"],
                  })
              return entries

          copied = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures = {pool.submit(copy_blob, item): item["path"] for item in source_files}
              for future in concurrent.futures.as_completed(futures):
                  copied.extend(future.result())
                  completed += 1
                  if completed % 25 == 0 or completed == len(source_files):
                      print(f"Copied {completed}/{len(source_files)} files")

          marker = {
              "schema_version": "dc20_decision_migration_v1",
              "source_repository": source_repo,
              "source_commit": source_commit,
              "target_repository": target_repo,
              "source_file_count": len(source_files),
              "target_file_count": len(copied),
              "decision_bytes": sum(item.get("size", 0) for item in source_files),
              "premium_included": False,
              "split_source_files": [split_history_path],
              "regenerated_outputs_not_copied": sorted(regenerated_large_outputs),
              "copy_method": "GitHub Git Data API; no SSH and no git push",
          }
          marker_blob = api_json(
              "POST",
              f"/repos/{target_repo}/git/blobs",
              {"content": json.dumps(marker, ensure_ascii=False, indent=2) + "\n", "encoding": "utf-8"},
          )
          copied.append({"path": marker_path, "mode": "100644", "type": "blob", "sha": marker_blob["sha"]})

          ref = api_json("GET", f"/repos/{target_repo}/git/ref/heads/main")
          parent_sha = ref["object"]["sha"]
          parent = api_json("GET", f"/repos/{target_repo}/git/commits/{parent_sha}")
          new_tree = api_json(
              "POST",
              f"/repos/{target_repo}/git/trees",
              {"base_tree": parent["tree"]["sha"], "tree": copied},
          )
          commit = api_json(
              "POST",
              f"/repos/{target_repo}/git/commits",
              {
                  "message": "Bootstrap independent Decision-only research snapshot",
                  "tree": new_tree["sha"],
                  "parents": [parent_sha],
              },
          )
          api_json(
              "PATCH",
              f"/repos/{target_repo}/git/refs/heads/main",
              {"sha": commit["sha"], "force": False},
          )
          print(f"Published bootstrap commit {commit['sha']}")
          PY
