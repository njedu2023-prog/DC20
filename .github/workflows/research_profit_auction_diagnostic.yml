name: DC20 · two failed auction responses (diagnostic only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/AUCTION_DIAGNOSTIC_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: dc20-two-auction-response-diagnostic
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  diagnostic:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact version without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test diagnostic contracts before source credentials
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production freeze is intact
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py --root .
      - name: Fetch exactly two failed full-market responses without retries
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python work/profit_1000_upgrade/auction_diagnostic.py
          --output "${RUNNER_TEMP}/dc20-two-auction-diagnostic"
      - name: Verify no production source model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain safe original tables and rejection diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-two-auction-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-two-auction-diagnostic
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          compression-level: 6
