name: DC20 · canonical auction and 10:00 replay v2 (research only)

on:
  push:
    branches: [main]
    paths:
      - "work/profit_1000_upgrade/COLLECTION_V2.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: dc20-profit-1000-sources-v2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  research:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout exact version without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install existing hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Test research contracts before source credentials
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/work/profit_1000_upgrade
        run: python -m pytest -q work/profit_1000_upgrade -p no:cacheprovider
      - name: Verify production freeze is intact
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python scripts/validate_decision_model_freeze.py --root .
      - name: Read one exact retained historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 300 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/njedu2023-prog/DC20/actions/artifacts/10291376913/zip \
            --output "${RUNNER_TEMP}/history-v1.zip"
      - name: Verify archive SHA and create new v2 mirror
        run: >-
          python work/profit_1000_upgrade/run.py --plan-version v2
          --output "${RUNNER_TEMP}/dc20-profit-1000-sources-v2"
          --resume-zip "${RUNNER_TEMP}/history-v1.zip"
      - name: Collect canonical auction and exact 09:31 minute sources within fixed budget
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: >-
          python work/profit_1000_upgrade/collect.py --plan-version v2
          --root "${RUNNER_TEMP}/dc20-profit-1000-sources-v2"
          --report "${RUNNER_TEMP}/dc20-profit-1000-sources-v2/collection_receipt.json"
      - name: Rebuild labels and fit only after unchanged data gates
        if: ${{ !cancelled() }}
        run: >-
          python work/profit_1000_upgrade/run.py --plan-version v2
          --evaluate-root "${RUNNER_TEMP}/dc20-profit-1000-sources-v2"
      - name: Independently rebuild two capital comparisons or retain blocked evidence
        if: ${{ !cancelled() }}
        run: >-
          python work/profit_1000_upgrade/capital_report.py
          --root "${RUNNER_TEMP}/dc20-profit-1000-sources-v2"
          --expected-source-run-id "${{ github.run_id }}"
          --expected-source-commit "${{ github.sha }}"
      - name: Verify no production source model or ledger changed
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Preserve full v2 evidence including blocked and negative results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-profit-1000-sources-v2-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dc20-profit-1000-sources-v2
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          compression-level: 6
