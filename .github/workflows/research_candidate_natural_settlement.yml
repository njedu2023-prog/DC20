name: DC20 · Settle natural candidate research slots

on:
  schedule:
    # UTC slots = Beijing 19:50 and 20:50. A verified schedule delayed by up to
    # 12h retains its intended closed session, including Friday -> Saturday.
    # The reviewed calendar still excludes holidays; dispatch has no as-of input.
    - cron: "50 11 * * 1-5"
    - cron: "50 12 * * 1-5"
  workflow_run:
    workflows: ["DC20 · Preserve natural candidate publication (research)"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读验证；不请求行情、不写研究账本"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/research_candidate_natural_settlement.yml"
      - "work/profit_1000_upgrade/candidate_natural_*.py"
      - "work/profit_1000_upgrade/test_candidate_natural_*.py"

# Normal P0 schedule/dispatch -> freeze -> observer -> settlement is three
# workflow_run levels. An extra upstream CI/health level cannot trigger a
# fourth level; the independent evening schedules are the fallback.
permissions:
  contents: read

concurrency:
  group: dc20-natural-settlement-${{ github.event_name == 'push' && github.run_id || 'research-journal' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

jobs:
  validate:
    name: Validate bounded research settlement contracts
    if: >-
      github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.workflow_id == 357027830 && github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.path == '.github/workflows/research_candidate_natural_observer.yml' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Check collector, original state recovery, statistics and workflow boundary
        run: |
          python -m pytest -q -p no:cacheprovider work/profit_1000_upgrade/test_candidate_natural_outcome_collect.py work/profit_1000_upgrade/test_candidate_natural_evidence_publication.py work/profit_1000_upgrade/test_candidate_natural_daily.py work/profit_1000_upgrade/test_candidate_natural_journal.py work/profit_1000_upgrade/test_candidate_natural_journal_integration.py work/profit_1000_upgrade/test_candidate_natural_journal_git.py work/profit_1000_upgrade/test_candidate_natural_statistics.py work/profit_1000_upgrade/test_candidate_natural_settlement_workflow.py work/profit_1000_upgrade/test_candidate_natural_settlement_contract.py
          python -c 'from work.profit_1000_upgrade import candidate_natural_settlement_workflow as m; m.code_guard(m.dependencies())'
          python scripts/validate_decision_model_freeze.py --root .
          test -z "$(git status --porcelain=v1)"
  settle:
    name: Collect bounded quotes and append isolated research journal
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout latest research state without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Read latest journal data. The coordinator independently requires all
          # code bytes to match BOTH this main tree and the original github.sha.
          ref: main
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Install hash-locked runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-dev.lock
      - name: Restore, verify and settle original frozen slots
        # Leave job time for always() diagnostics after a bounded step failure.
        timeout-minutes: 45
        env:
          DC20_CANDIDATE_GITHUB_TOKEN: ${{ github.token }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          EXECUTE_RESEARCH: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          args=(--work-parent "$RUNNER_TEMP")
          if [ "$EXECUTE_RESEARCH" = "true" ]; then args+=(--execute); fi
          python - "${args[@]}" <<'PY'
          import json, re, sys
          from work.profit_1000_upgrade import candidate_natural_settlement_workflow as m
          def trace(frame, event, arg):
              if event == 'exception' and frame.f_code.co_name == 'run_settlement' and frame.f_code.co_filename == m.__file__:
                  kind, error, tb = arg
                  # Only fixed guard identifiers; never print payloads, URLs or locals.
                  reason = str(error)
                  safe = reason if re.fullmatch(r'[A-Z][A-Z0-9_]{2,120}', reason) else 'REDACTED_NON_GUARD_EXCEPTION'
                  print(json.dumps({'settlement_error_type': kind.__name__, 'guard': safe, 'line': frame.f_lineno}), flush=True)
              return trace
          sys.settrace(trace)
          raise SystemExit(m.main(sys.argv[1:]))
          PY
      - name: Check formal files remain untouched
        if: always()
        run: test -z "$(git status --porcelain=v1)"
      - name: Retain bounded result and source state for failure diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc20-candidate-settlement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dc20-candidate-settlement-*
            /tmp/dc20-candidate-natural-state/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: false
          compression-level: 6
