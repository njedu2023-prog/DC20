name: DC20 · Read-only extended core diagnosis

# Supplemental diagnostic only: this never replaces the required core,
# source-surface audit, frozen replay, or production publishing gates.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose_decision_core_extended.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OMP_DYNAMIC: "FALSE"
  OPENBLAS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "Haswell"
  GOTO_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MKL_DYNAMIC: "FALSE"
  BLIS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NPY_ENABLE_CPU_FEATURES: "X86_V3"

jobs:
  extended-core-diagnostic:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-extended-diagnostic"
          : > "$RUNNER_TEMP/core-extended-diagnostic/core-regression.log"
          printf '%s\n' 'diagnostic_only=true' 'replaces_required_core_ci=false' 'state=NOT_STARTED' 'exit_code=unknown' > "$RUNNER_TEMP/core-extended-diagnostic/core-status.txt"
      - name: Verify checkout is byte-clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          eol_violations="$(git ls-files --eol | awk '($1 == "i/crlf" || $1 == "i/mixed") && /attr\/text.*eol=lf/')"
          test -z "${eol_violations}"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock
      - name: Install deps
        run: |
          set -e
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -c "import pip; assert pip.__version__ == '26.2.1', pip.__version__"
          python -m pip check
      - name: Validate extended diagnostic on actual Linux
        shell: bash
        timeout-minutes: 5
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python -m pytest tests/test_decision_core_extended_diagnostics.py -q --tb=short --junitxml="$RUNNER_TEMP/core-extended-diagnostic/selftest.xml"
          python -c 'import os,sys,xml.etree.ElementTree as E; assert sys.platform.startswith("linux"); r=E.parse(os.environ["RUNNER_TEMP"]+"/core-extended-diagnostic/selftest.xml").getroot(); s=list(r.iter("testsuite")); assert sum(int(x.get("tests","0")) for x in s)>0; assert all(int(x.get(k,"0"))==0 for x in s for k in ("skipped","failures","errors"))'
      - name: Run decision core regression tests
        shell: bash
        timeout-minutes: 50
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          node --version
          printf '%s\n' 'diagnostic_only=true' 'replaces_required_core_ci=false' 'state=RUNNING' 'exit_code=unknown' > "$RUNNER_TEMP/core-extended-diagnostic/core-status.txt"
          # Direct regular-file output cannot wait on a descendant-held pipe.
          # GNU timeout operates on its process group; no --foreground option.
          # Escaped sessions and externally killed runners can prevent cleanup
          # or artifact upload. Exit 137 alone does not identify an OOM cause.
          set +e
          timeout --signal=TERM --kill-after=15s 45m python -u -m pytest -vv --tb=short --durations=25 --ignore=tests/test_decision_source_surface_rotation.py -o faulthandler_timeout=120 --junitxml="$RUNNER_TEMP/core-extended-diagnostic/core-regression.xml" > "$RUNNER_TEMP/core-extended-diagnostic/core-regression.log" 2>&1
          core_status=$?
          set -e
          case "$core_status" in
            0) state=COMMAND_COMPLETED ;;
            124) state=DIAGNOSTIC_WINDOW_TIMEOUT ;;
            137) state=KILLED_CAUSE_UNDETERMINED ;;
            *) state=COMMAND_FAILED ;;
          esac
          printf '%s\n' 'diagnostic_only=true' 'replaces_required_core_ci=false' "state=$state" "exit_code=$core_status" > "$RUNNER_TEMP/core-extended-diagnostic/core-status.txt"
          printf 'Extended core diagnostic: %s (exit %s). This does not replace the required core CI gate. A timeout is incomplete evidence.\n' "$state" "$core_status" >> "$GITHUB_STEP_SUMMARY"
          exit "$core_status"
      - name: Preserve extended core diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-extended-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-extended-diagnostic/core-regression.log
            ${{ runner.temp }}/core-extended-diagnostic/core-regression.xml
            ${{ runner.temp }}/core-extended-diagnostic/core-status.txt
            ${{ runner.temp }}/core-extended-diagnostic/selftest.xml
          if-no-files-found: warn
          retention-days: 14
