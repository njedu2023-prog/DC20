name: DC2.0 · Freeze Primary Profit Forward Shadow

on:
  workflow_run:
    workflows:
      - DC2.0 · Publish Primary Profit Rankings (P1)
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只读演练；生成并校验但不提交"
        required: true
        default: true
        type: boolean
      trade_date:
        description: "当前前向D日 YYYYMMDD（不得回填）"
        required: true
        type: string
      confirm_prospective:
        description: "确认仍处于D收盘后、T日09:20前的前向冻结窗口"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

concurrency:
  # This sidecar writes immutable D selections and cumulative truth state.  It
  # therefore shares the one production writer lock with P0/P1/Daily/Verify.
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  compute:
    name: Freeze P1 Top1/Top2 without rescoring
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.status == 'completed' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.run_attempt == 1 &&
            github.event.workflow_run.workflow_id == 343703610 &&
            github.event.workflow_run.name == 'DC2.0 · Publish Primary Profit Rankings (P1)' &&
            github.event.workflow_run.path == '.github/workflows/run_primary_profit_rankings.yml' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.repository.full_name == github.repository &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      base_head: ${{ steps.mode.outputs.base_head }}
      signal_date: ${{ steps.target.outputs.signal_date }}
      has_changes: ${{ steps.candidate.outputs.has_changes || 'false' }}
    steps:
      - name: Checkout immutable current main without writer credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve prospective mode and exact P1-owned D
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM_PROSPECTIVE: ${{ inputs.confirm_prospective }}
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            if [ "${INPUT_DRY_RUN:-true}" != false ]; then publish=false; fi
            if [ "${publish}" = true ] && [ "${INPUT_CONFIRM_PROSPECTIVE:-false}" != true ]; then
              echo 'real prospective dispatch requires explicit confirmation' >&2
              exit 1
            fi
          fi
          base_head="$(git rev-parse HEAD)"
          printf '%s\n' "${base_head}" > "${RUNNER_TEMP}/base_sha.txt"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "base_head=${base_head}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact successful P1 source and resolve D
        id: target
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TRADE_DATE: ${{ inputs.trade_date }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          event=os.environ['GITHUB_EVENT_NAME']
          if event == 'workflow_run':
              run_id=str(os.environ.get('UPSTREAM_RUN_ID') or '')
              if re.fullmatch(r'[1-9][0-9]*',run_id) is None:
                  raise SystemExit('P1 upstream run id is invalid')
              token=str(os.environ.get('GH_API_TOKEN') or '').strip()
              request=Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/jobs?filter=latest&per_page=100",
                  headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
              )
              with urlopen(request,timeout=30) as response: payload=json.load(response)
              jobs=payload.get('jobs') if isinstance(payload,dict) else None
              if not isinstance(jobs,list) or payload.get('total_count') != len(jobs):
                  raise SystemExit('P1 upstream jobs response is incomplete')
              required={
                  'Build atomic P1 single/mixed research candidate':'success',
                  'CAS publish one complete P1 commit':None,
                  'Deploy exact P1 revision':'success',
              }
              observed={}
              for job in jobs:
                  if not isinstance(job,dict):
                      raise SystemExit('P1 upstream jobs response is invalid')
                  raw_name=str(job.get('name') or '')
                  reusable_suffix=' / deploy'
                  name=(
                      raw_name[:-len(reusable_suffix)]
                      if raw_name.endswith(reusable_suffix)
                      else raw_name
                  )
                  if name not in required:
                      continue
                  if name in observed:
                      raise SystemExit(f'P1 upstream job is duplicated: {name}')
                  observed[name]=str(job.get('conclusion') or '')
              if any(name not in observed for name in required):
                  raise SystemExit('P1 upstream required jobs are missing')
              if observed['Build atomic P1 single/mixed research candidate'] != 'success' or observed['Deploy exact P1 revision'] != 'success':
                  raise SystemExit('P1 upstream compute/deploy was not successful')
              if observed['CAS publish one complete P1 commit'] not in {'success','skipped'}:
                  raise SystemExit('P1 upstream CAS result is invalid')
              d=''
          elif event == 'workflow_dispatch':
              d=str(os.environ.get('INPUT_TRADE_DATE') or '').strip()
              if re.fullmatch(r'20\d{6}',d) is None:
                  raise SystemExit('prospective dispatch trade_date must be YYYYMMDD')
          else:
              raise SystemExit('unsupported Shadow bridge event')

          index_path=Path('outputs/decision/executable_profit_research/index.json')
          if not index_path.is_file() or index_path.is_symlink():
              raise SystemExit('P1 mixed index is missing or unsafe')
          index=json.loads(index_path.read_text(encoding='utf-8'))
          if not (
              index.get('schema_version') == 'dc20_primary_mixed_profit_research_index_v1'
              and index.get('generation_mode') == 'NATURAL'
              and index.get('status') == 'PROSPECTIVE_RESEARCH'
              and index.get('prospective') is True
              and index.get('retrospective_non_forward') is False
          ):
              raise SystemExit('only an exact prospective NATURAL P1 bundle may freeze Shadow')
          index_d=str(index.get('latest_signal_date') or '')
          if event == 'workflow_run': d=index_d
          if d != index_d:
              raise SystemExit('requested D differs from current prospective P1 mixed index')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'signal_date={d}\n')
          PY

      - name: Set up pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact hash-locked Decision runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip check

      - name: Freeze published P1 order and build independent public sidecar
        env:
          PYTHONPATH: src
          SIGNAL_DATE: ${{ steps.target.outputs.signal_date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          d=os.environ['SIGNAL_DATE']
          protected=[
              Path('outputs/decision/executable_profit_research/index.json'),
              Path(f'outputs/decision/executable_profit_research/projection_{d}.json'),
              Path(f'outputs/decision/executable_profit_research/projection_{d}.csv'),
              Path('data/decision_executable_profit/forward/selections/index.json'),
          ]
          protected.extend(sorted(Path('outputs/decision').glob('action_plan_*.json')))
          protected.append(Path('outputs/decision/report_index.json'))
          inventory={}
          for path in protected:
              if path.exists():
                  if not path.is_file() or path.is_symlink(): raise SystemExit(f'protected input is unsafe: {path}')
                  inventory[path.as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          Path(os.environ['RUNNER_TEMP'],'shadow-protected-before.json').write_text(json.dumps(inventory,sort_keys=True)+'\n',encoding='utf-8')
          PY
          python scripts/freeze_primary_profit_forward_shadow.py \
            --signal-date "${SIGNAL_DATE}"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from top10decision.decision.primary_profit_forward_shadow_bridge import (
              validate_primary_profit_forward_shadow_repository_chain,
          )

          d=os.environ['SIGNAL_DATE']
          validate_primary_profit_forward_shadow_repository_chain(Path('.'),d)
          before=json.loads(Path(os.environ['RUNNER_TEMP'],'shadow-protected-before.json').read_text(encoding='utf-8'))
          after={}
          for relative in before:
              path=Path(relative)
              if not path.is_file() or path.is_symlink(): raise SystemExit(f'protected P1/Action input disappeared: {relative}')
              after[relative]=hashlib.sha256(path.read_bytes()).hexdigest()
          if after != before:
              raise SystemExit('Shadow bridge changed P1 projection, legacy pointer, or Action bytes')
          before_actions={
              relative for relative in before
              if relative.startswith('outputs/decision/action_plan_')
              or relative == 'outputs/decision/report_index.json'
          }
          after_actions={
              path.as_posix()
              for path in Path('outputs/decision').glob('action_plan_*.json')
          }
          if Path('outputs/decision/report_index.json').exists():
              after_actions.add('outputs/decision/report_index.json')
          if after_actions != before_actions:
              raise SystemExit('Shadow bridge created or removed an Action artifact')
          PY

      - name: Build exact allowlisted Shadow candidate
        id: candidate
        env:
          SIGNAL_DATE: ${{ steps.target.outputs.signal_date }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A -- \
            "data/decision_executable_profit/forward/selections/shadow_${SIGNAL_DATE}.json" \
            "data/decision_executable_profit/forward/selections/shadow_${SIGNAL_DATE}.csv" \
            data/decision_executable_profit/forward/selections/primary_mixed_index.json \
            data/decision_executable_profit/forward/statistics/summary.json \
            "outputs/decision/executable_profit_research/shadow_state_${SIGNAL_DATE}_asof_${SIGNAL_DATE}.json" \
            outputs/decision/executable_profit_research/shadow_index.json
          git diff --cached --name-only -z > "${RUNNER_TEMP}/shadow-paths.bin"
          STAGED_PATHS="${RUNNER_TEMP}/shadow-paths.bin" SIGNAL_DATE="${SIGNAL_DATE}" python3 - <<'PY'
          import os
          from pathlib import Path
          d=os.environ['SIGNAL_DATE']
          expected={
              f'data/decision_executable_profit/forward/selections/shadow_{d}.json',
              f'data/decision_executable_profit/forward/selections/shadow_{d}.csv',
              'data/decision_executable_profit/forward/selections/primary_mixed_index.json',
              'data/decision_executable_profit/forward/statistics/summary.json',
              f'outputs/decision/executable_profit_research/shadow_state_{d}_asof_{d}.json',
              'outputs/decision/executable_profit_research/shadow_index.json',
          }
          paths={value.decode() for value in Path(os.environ['STAGED_PATHS']).read_bytes().split(b'\0') if value}
          if not paths.issubset(expected):
              raise SystemExit(f'Shadow candidate has foreign paths: {sorted(paths)}')
          required={
              f'data/decision_executable_profit/forward/selections/shadow_{d}.json',
              f'data/decision_executable_profit/forward/selections/shadow_{d}.csv',
              'data/decision_executable_profit/forward/selections/primary_mixed_index.json',
              'data/decision_executable_profit/forward/statistics/summary.json',
              f'outputs/decision/executable_profit_research/shadow_state_{d}_asof_{d}.json',
              'outputs/decision/executable_profit_research/shadow_index.json',
          }
          if paths and not required.issubset(paths):
              raise SystemExit(f'Shadow candidate is incomplete: {sorted(required-paths)}')
          PY
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/shadow.patch"
          sha256sum "${RUNNER_TEMP}/shadow.patch" | cut -d' ' -f1 > "${RUNNER_TEMP}/shadow.patch.sha256"
          if git diff --cached --quiet; then echo 'has_changes=false' >> "${GITHUB_OUTPUT}"; else echo 'has_changes=true' >> "${GITHUB_OUTPUT}"; fi

      - name: Upload immutable Shadow candidate
        if: ${{ steps.mode.outputs.publish == 'true' && steps.candidate.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primary-profit-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base_sha.txt
            ${{ runner.temp }}/shadow.patch
            ${{ runner.temp }}/shadow.patch.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: CAS publish one complete Shadow sidecar commit
    needs: compute
    if: ${{ needs.compute.outputs.publish == 'true' && needs.compute.outputs.has_changes == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: primary-profit-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify envelope and create exact-base commit
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/candidate"
          test "$(find "${candidate}" -type f | wc -l | tr -d ' ')" = 3
          expected="$(cat "${candidate}/base_sha.txt")"
          test "$(git rev-parse HEAD)" = "${expected}"
          test "$(sha256sum "${candidate}/shadow.patch" | cut -d' ' -f1)" = "$(cat "${candidate}/shadow.patch.sha256")"
          git apply --index --binary "${candidate}/shadow.patch"
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "auto: freeze primary profit forward Shadow ${{ needs.compute.outputs.signal_date }} [dc20-shadow-pages-owned]"
      - name: Publish exact CAS commit
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(cat "${RUNNER_TEMP}/candidate/base_sha.txt")"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "published_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy-pages:
    name: Deploy exact Shadow sidecar revision
    needs: [compute, publish]
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published_head != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.publish.outputs.published_head }}
