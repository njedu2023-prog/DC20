name: DC20 · Independent profit research data
on:
  workflow_dispatch:
  # Called inside the publisher: a fourth workflow_run hop is never delivered.
  workflow_call:
    secrets:
      TUSHARE_TOKEN:
        required: true
  schedule:
    - cron: "20 15 * * 1-5"
  push:
    branches: [main]
    paths:
      - scripts/build_profit_research.py
      - scripts/collect_profit_research.py
      - scripts/publish_profit_research.py
      - scripts/profit_research_extensions.py
      - scripts/profit_research_enrichment.py
      - scripts/profit_research_comparison.py
      - scripts/profit_research_operations.py
      - scripts/profit_research_delivery.py
      - tests/test_profit_research_delivery.py
      - tests/test_profit_research.py
      - tests/test_profit_research_extensions.py
      - tests/test_profit_research_enrichment.py
      - tests/test_profit_research_comparison.py
      - tests/test_profit_research_integration.py
      - tests/test_profit_research_operations.py
      - tests/test_profit_research_ui.js
      - .github/workflows/profit_research.yml
      - outputs/decision/profit_research/index.html
permissions:
  contents: read
concurrency:
  group: dc20-independent-profit-research
  cancel-in-progress: false
jobs:
  accumulate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      head: ${{ steps.publish.outputs.head }}
      signal_date: ${{ steps.bind.outputs.signal_date }}
      source_revision: ${{ steps.bind.outputs.source_revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - name: Bind one immutable source revision
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/profit_research_delivery.py wait
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD
          echo "RESEARCH_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RESEARCH_RUN_STARTED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python scripts/profit_research_delivery.py bind >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - name: Targeted research checks only
        run: |
          python -m unittest discover -s tests -p 'test_profit_research*.py' -v
          node tests/test_profit_research_ui.js
      - name: Install existing hash-locked label runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
      - name: Import complete candidate feature snapshots
        run: python -m scripts.build_profit_research --revision "$RESEARCH_BASE"
      - name: Bounded research-only D feature enrichment
        id: enrichment
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python -m scripts.profit_research_enrichment --revision "$RESEARCH_BASE"
      - name: Bounded independent counterfactual labels
        id: quotes
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PYTHONPATH: src:.
        run: python scripts/collect_profit_research.py --revision "$RESEARCH_BASE"
      - name: Publish explicit data gaps and immutable research versions
        run: |
          python -m scripts.build_profit_research --revision "$RESEARCH_BASE"
          echo "Research collection outcome: ${{ steps.quotes.outcome }}. No training or production model changes." >> "$GITHUB_STEP_SUMMARY"
          echo "D feature enrichment: ${{ steps.enrichment.outcome }}. Backfills remain separate from frozen production inputs." >> "$GITHUB_STEP_SUMMARY"
      - name: Append read-only collection acceptance receipt
        id: acceptance
        continue-on-error: true
        run: python -m scripts.profit_research_operations --record
      - name: Render acceptance state without hiding collection failures
        run: |
          python -m scripts.build_profit_research --revision "$RESEARCH_BASE"
          echo "Read-only acceptance: ${{ steps.acceptance.outcome }}. Natural collection, replay, backfill and private storage remain separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Write only research evidence through GitHub API
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_profit_research.py
  deploy:
    needs: accumulate
    if: needs.accumulate.outputs.head != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_dc20_pages.yml
    with:
      expected_head: ${{ needs.accumulate.outputs.head }}
  verify_public:
    name: Accept exact research date and public fingerprint
    needs: [accumulate, deploy]
    if: always() && needs.accumulate.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.accumulate.outputs.head }}
          persist-credentials: false
      - env:
          EXPECTED_RESEARCH_D: ${{ needs.accumulate.outputs.signal_date }}
          EXPECTED_RESEARCH_SOURCE: ${{ needs.accumulate.outputs.source_revision }}
          EXPECTED_RESEARCH_HEAD: ${{ needs.accumulate.outputs.head }}
        run: python scripts/profit_research_delivery.py verify

