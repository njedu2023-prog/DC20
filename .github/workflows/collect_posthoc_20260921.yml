name: DC20 · Collect September 21 posthoc evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc20-posthoc-evidence-20260921
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'njedu2023-prog/DC20' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Collect fixed historical sources and separate research result
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/collect_posthoc_20260921.py --output "$RUNNER_TEMP/posthoc-20260921"
      - name: Preserve evidence even if a source is missing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: posthoc-20260921-evidence
          path: ${{ runner.temp }}/posthoc-20260921
          retention-days: 30
          if-no-files-found: error
